<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#C4728A"/>
<title>Abriendo WhatsApp… · Nova Floe</title>
<link rel="icon" href="/icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#FBF0F3;color:#1A1118;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:2px solid #EDD8E0;border-radius:20px;padding:28px 22px;max-width:420px;width:100%;text-align:center}
.marca{font-family:Georgia,serif;font-size:26px;margin-bottom:14px}.marca em{color:#C4728A}
p{font-size:17px;line-height:1.45;color:#3D2E38;margin-bottom:14px}
.msg{background:#FBF0F3;border-radius:12px;padding:12px 14px;font-size:15px;color:#3D2E38;text-align:left;margin-bottom:16px;display:none}
a.btn{display:inline-block;background:#3D7A5A;color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:15px 24px;border-radius:14px}
</style>
</head>
<body>
<div class="card">
  <div class="marca">Nova <em>Floe</em></div>
  <p id="txt">Abriendo el chat de WhatsApp con la asesora…</p>
  <div class="msg" id="msg"></div>
  <a class="btn" id="btn" href="https://wa.me/573003547932">Abrir WhatsApp</a>
</div>
<script>
(function(){
  var SB_URL = "https://rkmhmzlbpbsdihuiofkv.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrbWhtemxicGJzZGlodWlvZmt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjcxNjQsImV4cCI6MjEwNzA0MzE2NH0.9FX6_K6Am7budpWgJG4X164lCH93Hl6XVssSqwmQVu8";
  var ASESORA = "573003547932";
  var partes = location.pathname.split('/').filter(Boolean);
  var codigo = (partes[0] === 'a' && partes[1]) ? partes[1] : (new URLSearchParams(location.search).get('c') || '');
  codigo = String(codigo).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
  function ir(texto){
    var url = 'https://wa.me/' + ASESORA + (texto ? '?text=' + encodeURIComponent(texto) : '');
    document.getElementById('btn').href = url;
    if (texto) { var m = document.getElementById('msg'); m.textContent = texto; m.style.display = 'block'; }
    location.replace(url);
  }
  if (!codigo) { ir(''); return; }
  var vencio = setTimeout(function(){ ir(''); }, 6000);   // si tarda, abre el chat sin el mensaje
  fetch(SB_URL + '/rest/v1/rpc/nf_derivacion_leer', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, body: JSON.stringify({ p_codigo: codigo }) })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(t){ clearTimeout(vencio); ir(typeof t === 'string' ? t : ''); })
    .catch(function(){ clearTimeout(vencio); ir(''); });
})();
</script>
</body>
</html>
