<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nova Floe — Inventario</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#C4728A"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Nova Floe"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --blush:   #E8A4B4;
  --blush-d: #C4728A;
  --blush-dd:#9A4A62;
  --blush-l: #FBF0F3;
  --blush-m: #F2D0DA;
  --night:   #1A1118;
  --night-2: #3D2E38;
  --night-3: #7A6070;
  --mist:    #F7F2F4;
  --white:   #FFFFFF;
  --border:  #EDD8E0;
  --green:   #3D7A5A;
  --green-l: #E4F2EB;
  --amber:   #B07820;
  --amber-l: #FBF0D8;
  --red:     #C03040;
  --red-l:   #FCEAEC;
  --body:    'DM Sans', sans-serif;
  --display: 'Playfair Display', serif;
  --r: 14px;
  --r-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--body);background:var(--mist);color:var(--night);min-height:100vh;}

/* LOGIN */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: linear-gradient(145deg, #FBF0F3 0%, #F7F2F4 50%, #F0E8F0 100%);
  padding:1.5rem;
}
.login-card{
  background:var(--white);border-radius:24px;padding:2.5rem 2rem;
  width:100%;max-width:360px;
  box-shadow: 0 8px 40px rgba(196,114,138,.12), 0 2px 8px rgba(196,114,138,.06);
}
.login-logo{
  width:56px;height:56px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;
}
.login-logo svg{width:26px;height:26px;fill:white;}
.login-title{font-family:var(--display);font-size:26px;text-align:center;color:var(--night);margin-bottom:4px;}
.login-title em{font-style:italic;color:var(--blush-d);}
.login-sub{font-size:13px;color:var(--night-3);text-align:center;margin-bottom:1.75rem;}
.login-card label{font-size:12px;font-weight:600;color:var(--night-2);display:block;margin-bottom:6px;letter-spacing:.3px;}
.login-card input{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:11px 14px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
  margin-bottom:12px;
}
.login-card input:focus{border-color:var(--blush-d);background:white;}
.login-err{font-size:12px;color:var(--red);margin-bottom:10px;text-align:center;}
.btn-login{
  width:100%;height:44px;background:var(--blush-d);color:white;border:none;
  border-radius:var(--r-sm);font-family:var(--body);font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.2px;transition:background .15s;
}
.btn-login:hover{background:var(--blush-dd);}

/* TOPBAR */
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 1.25rem;height:58px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px;fill:white;}
.brand-name{font-family:var(--display);font-size:18px;color:var(--night);}
.brand-name em{font-style:italic;color:var(--blush-d);}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* BUTTONS */
.btn{
  border:none;border-radius:var(--r-sm);padding:0 16px;height:36px;
  font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn-primary{background:var(--blush-d);color:white;}
.btn-primary:hover{background:var(--blush-dd);}
.btn-ghost{background:transparent;color:var(--night-2);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--blush-l);}
.btn-danger-soft{background:var(--red-l);color:var(--red);border:none;}
.btn-danger-soft:hover{background:#f5c5ca;}
.btn-lg{height:44px;font-size:14px;padding:0 20px;}

/* STATS */
.stats-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;padding:1.1rem 1.25rem 0;
}
.stat{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:.85rem 1rem;
}
.stat-label{font-size:11px;color:var(--night-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:500;}
.stat-val{font-size:24px;font-weight:600;line-height:1;color:var(--night);}
.stat-val.accent{color:var(--blush-d);}
.stat-val.warn{color:var(--amber);}
.stat-val.danger{color:var(--red);}

/* FILTERS */
.toolbar{
  padding:.85rem 1.25rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.chip{
  border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;
  font-size:12px;font-family:var(--body);font-weight:500;background:transparent;
  color:var(--night-3);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--blush);color:var(--blush-d);}
.chip.on{background:var(--blush-d);border-color:var(--blush-d);color:white;}
.search-box{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--white);border:1.5px solid var(--border);border-radius:20px;
  padding:0 14px;height:34px;
}
.search-box svg{width:14px;height:14px;opacity:.35;flex-shrink:0;}
.search-box input{
  border:none;outline:none;background:transparent;font-family:var(--body);
  font-size:13px;color:var(--night);width:100%;
}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;padding:0 1.25rem 2rem;
}
.card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,114,138,.13);}
.card-photo{aspect-ratio:3/4;background:var(--blush-l);position:relative;overflow:hidden;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-photo .no-img{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--blush);
}
.card-photo .no-img svg{width:32px;height:32px;opacity:.4;}
.card-photo .no-img span{font-size:11px;opacity:.5;}
.stock-pill{
  position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;background:var(--green-l);color:var(--green);
}
.stock-pill.low{background:var(--amber-l);color:var(--amber);}
.stock-pill.out{background:var(--red-l);color:var(--red);}
.card-body{padding:.7rem .85rem .85rem;}
.card-ref{font-size:10px;color:var(--night-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.card-name{font-size:13px;font-weight:600;color:var(--night);line-height:1.3;margin-bottom:6px;}
.tallas-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
.t-chip{
  font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px;
  background:var(--blush-l);color:var(--blush-dd);
}
.t-chip.low{background:var(--amber-l);color:var(--amber);}
.t-chip.out{background:var(--red-l);color:var(--red);text-decoration:line-through;}
.card-price{font-size:14px;font-weight:700;color:var(--blush-d);}

/* EMPTY */
.empty{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4rem 1rem;gap:12px;
}
.empty svg{width:48px;height:48px;color:var(--blush-m);}
.empty p{font-size:14px;color:var(--night-3);text-align:center;}

/* DRAWER */
.drawer-bg{position:fixed;inset:0;background:rgba(26,17,24,.45);z-index:150;backdrop-filter:blur(2px);}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(460px,100vw);
  background:var(--white);z-index:160;overflow-y:auto;
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(26,17,24,.12);
}
.drawer-head{
  padding:1rem 1.25rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--white);z-index:5;
}
.drawer-head h3{font-family:var(--display);font-size:20px;color:var(--night);}
.drawer-head h3 em{font-style:italic;color:var(--blush-d);}
.close-btn{
  width:32px;height:32px;border:1.5px solid var(--border);border-radius:50%;
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.close-btn svg{width:14px;height:14px;stroke:var(--night-2);fill:none;stroke-width:2;}
.drawer-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex:1;}

/* FORM */
.field label{font-size:11px;font-weight:600;color:var(--night-2);display:block;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blush-d);background:white;
}
.field textarea{resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* FOTO UPLOAD */
.foto-drop{
  border:2px dashed var(--blush-m);border-radius:var(--r);padding:1.5rem;
  text-align:center;cursor:pointer;transition:background .15s;position:relative;
  background:var(--blush-l);
}
.foto-drop:hover{background:var(--blush-m);}
.foto-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.foto-drop svg{width:32px;height:32px;stroke:var(--blush-d);fill:none;stroke-width:1.5;margin-bottom:8px;}
.foto-drop p{font-size:13px;color:var(--blush-d);font-weight:500;}
.foto-drop small{font-size:11px;color:var(--night-3);}
.foto-preview-wrap{position:relative;}
.foto-preview{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);display:block;}
.foto-change{
  position:absolute;bottom:10px;right:10px;background:white;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:4px;color:var(--night-2);
}
.foto-change input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.uploading-overlay{
  position:absolute;inset:0;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;border-radius:var(--r);
}

/* TALLAS */
.tallas-editor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.talla-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
.talla-cell label{font-size:10px;font-weight:700;color:var(--night-3);text-transform:uppercase;}
.talla-num{
  width:100%;border:1.5px solid var(--border);border-radius:6px;
  padding:6px 4px;text-align:center;font-size:13px;font-weight:600;
  font-family:var(--body);outline:none;color:var(--night);background:var(--mist);
  transition:border-color .15s;
}
.talla-num:focus{border-color:var(--blush-d);background:white;}
.talla-num::-webkit-outer-spin-button,.talla-num::-webkit-inner-spin-button{-webkit-appearance:none;}

/* SECCION TALLAS */
.section-title{
  font-size:11px;font-weight:700;color:var(--night-3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px;
}

/* DRAWER FOOTER */
.drawer-footer{
  padding:1rem 1.25rem;border-top:1px solid var(--border);
  display:flex;gap:8px;background:var(--white);
  position:sticky;bottom:0;
}

/* TOAST */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(0);
  background:var(--night);color:white;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:400;white-space:nowrap;
  transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px);}

/* CONFIRM */
.modal-bg{position:fixed;inset:0;background:rgba(26,17,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:20px;padding:1.75rem;width:100%;max-width:300px;text-align:center;}
.modal h3{font-family:var(--display);font-size:20px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--night-3);margin-bottom:1.5rem;line-height:1.5;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;height:40px;}

/* SPINNER */
.spinner{
  width:22px;height:22px;border:2.5px solid var(--blush-m);
  border-top-color:var(--blush-d);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-page{display:flex;align-items:center;justify-content:center;min-height:60vh;}

@media(max-width:480px){
  .tallas-editor{grid-template-columns:repeat(4,1fr);}
  .row2{grid-template-columns:1fr;}
}

/* TABS */
.tabs{display:flex;gap:4px;padding:0 1.25rem;margin-top:.75rem;}
.tab{
  border:none;background:transparent;padding:8px 4px;font-family:var(--body);
  font-size:13px;font-weight:600;color:var(--night-3);cursor:pointer;
  border-bottom:2px solid transparent;
}
.tab.on{color:var(--blush-dd);border-bottom-color:var(--blush-d);}

/* PEDIDOS */
.pk-chips{display:flex;gap:8px;flex-wrap:wrap;padding:1rem 1.25rem 0}
.pk-chip{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:12px 18px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--night-2)}
.pk-chip.on{background:var(--blush-d);border-color:var(--blush-d);color:#fff}
.pk-nota{margin:12px 1.25rem 0;padding:12px 14px;border-radius:12px;background:#FBF0D8;color:#7a5410;font-size:16px;line-height:1.4}
.pk-card{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:18px 18px 16px}
.pk-card.nuevo{border-color:#3D7A5A;box-shadow:0 0 0 4px rgba(61,122,90,.15)}
.pk-card.hecho{opacity:.62}
.pk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pk-nombre{font-size:23px;font-weight:700;line-height:1.2}
.pk-fecha{font-size:16px;color:var(--night-3)}
.pk-nuevo{display:inline-block;background:#3D7A5A;color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:3px 9px;margin-left:8px;vertical-align:middle}
.pk-items{margin:14px 0 6px;display:grid;gap:8px}
.pk-item{font-size:21px;line-height:1.3;padding:10px 14px;background:var(--blush-l);border-radius:12px}
.pk-item b{font-weight:800}
.pk-total{font-size:17px;color:var(--night-3);margin:6px 0 12px}
.pk-envio{background:#F7F3F5;border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.pk-envio .t{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--night-3)}
.pk-envio .f{display:flex;gap:8px;font-size:19px;line-height:1.3;flex-wrap:nowrap}
.pk-envio .f span:first-child{color:var(--night-3);min-width:92px;flex:none}
.pk-envio .f span:last-child{font-weight:700;word-break:break-word}
.pk-falta{background:#FBF0D8;color:#7a5410;border-radius:12px;padding:12px 14px;font-size:18px}
.pk-acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pk-btn{border:none;border-radius:14px;padding:16px 20px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;flex:1;min-width:150px}
.pk-btn.ok{background:#3D7A5A;color:#fff}
.pk-btn.sec{background:var(--white);border:2px solid var(--border);color:var(--night-2)}
.pedidos-list{display:flex;flex-direction:column;gap:12px;padding:1rem 1.25rem 2rem;}
.pedido-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:1rem;display:flex;flex-direction:column;gap:8px;
}
.pedido-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pedido-cliente{font-size:14px;font-weight:700;color:var(--night);}
.pedido-tel{font-size:12px;color:var(--night-3);}
.estado-badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}
.estado-badge.preguntando,.estado-badge.cuenta_enviada{background:var(--amber-l);color:var(--amber);}
.estado-badge.comprobante_recibido,.estado-badge.pendiente_confirmacion_humana{background:#E4ECF7;color:#2C5AA0;}
.estado-badge.confirmado,.estado-badge.pidiendo_datos_envio,.estado-badge.listo_para_enviar{background:var(--green-l);color:var(--green);}
.estado-badge.rechazado,.estado-badge.cancelado{background:var(--red-l);color:var(--red);}
.pedido-detalle{font-size:13px;color:var(--night-2);line-height:1.5;}
.pedido-detalle b{color:var(--night);}
.pedido-envio{
  background:var(--blush-l);border-radius:var(--r-sm);padding:.6rem .75rem;
  font-size:12px;color:var(--night-2);line-height:1.6;
}
.pedido-comprobante{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--blush-d);text-decoration:none;
}
.pedido-comprobante img{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

/* INVENTARIO: movimientos */
.card-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;}
.card-acts .btn{height:32px;font-size:12px;padding:0 4px;justify-content:center;border:none;font-weight:600;}
.btn-in{background:var(--green-l);color:var(--green);} .btn-in:hover{background:#cfe8da;}
.btn-out{background:var(--amber-l);color:var(--amber);} .btn-out:hover{background:#f5e2b5;}
.btn-cnt{background:var(--blush-l);color:var(--blush-dd);} .btn-cnt:hover{background:var(--blush-m);}
.card-acts .btn-hist{grid-column:1/-1;background:transparent;border:1.5px solid var(--border);color:var(--night-2);height:28px;font-size:11.5px;}
.stock-ayuda{font-size:13px;color:var(--night-3);line-height:1.5;}
.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stock-cell{background:var(--mist);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.stock-cell .st-t{font-size:12px;font-weight:700;color:var(--night-2);text-transform:uppercase;}
.stock-cell .st-hay{font-size:11px;color:var(--night-3);}
.stock-cell input{width:100%;height:44px;text-align:center;font-size:18px;font-weight:600;border:1.5px solid var(--border);border-radius:10px;background:white;color:var(--night);outline:none;}
.stock-cell input:focus{border-color:var(--blush-d);}
.stock-cell input::-webkit-outer-spin-button,.stock-cell input::-webkit-inner-spin-button{-webkit-appearance:none;}
.stock-cell.malo input{border-color:var(--red);background:var(--red-l);}
.stock-cell .st-dif{font-size:11px;font-weight:700;min-height:14px;}
.dif-mas{color:var(--green);} .dif-menos{color:var(--red);} .dif-cero{color:var(--night-3);}
.stock-resumen{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--blush-l);color:var(--blush-dd);line-height:1.45;}
.stock-resumen.err{background:var(--red-l);color:var(--red);}
.hist-list{display:flex;flex-direction:column;gap:8px;padding:.75rem 1.25rem 2rem;}

const DB = {
  async cargar(){

    if(error) throw error;

  async subirFoto(file,id){
    const resized = await redimensionarImagen(file, 1500, 0.85);
    const path = `productos/${id}.jpg`;

    const {error} = await sb.storage.from('nf-fotos').upload(path,resized,{upsert:true,contentType:'image/jpeg'});

function redimensionarImagen(file, maxDim, calidad){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width,height} = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else { width = Math.round(width*(maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error('No se pudo procesar la imagen')); return; }
        resolve(blob);
      }, 'image/jpeg', calidad);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

function uid(){ return 'nf'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ return n?'$'+Number(n).toLocaleString('es-CO'):''; }
function stockTotal(p){ return Object.values(p.tallas||{}).reduce((s,v)=>s+(parseInt(v)||0),0); }
function stockInfo(p){
  const t=stockTotal(p);
  if(t===0) return {label:'Agotado',cls:'out'};
  if(t<=3)  return {label:t+' uds',cls:'low'};
  return {label:t+' uds',cls:''};
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.remove('hidden');
  clearTimeout(window._t);
  window._t=setTimeout(()=>el.classList.add('hidden'),2600);
}

<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ── SVG ICONS ── */
const Ico = {
  Hanger: ()=><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 18H2.5a.5.5 0 0 1-.33-.87L11 10V8a1 1 0 1 1 2 0v2l8.83 7.13a.5.5 0 0 1-.33.87Z"/><path d="M10 8a2 2 0 1 1 4 0"/></svg>,

  X:      ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2.2"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>,
  Trash:  ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><polyline points="2,4 14,4"/><path d="M6 4V2h4v2"/><path d="M4 4l1 10h6l1-10"/></svg>,
  Camera: ()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="7" width="20" height="14" rx="3"/><circle cx="12" cy="14" r="4"/><path d="M8 7l2-3h4l2 3"/></svg>,
  Search: ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>,
  Edit:   ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M11 2l3 3-8 8H3v-3L11 2Z"/></svg>,
};

/* ── EDITOR DRAWER ── */
function Editor({item, onSave, onClose}){
  const isNew = !item.id;
  const [f, setF] = useState({
    id: item.id||uid(),
    nombre: item.nombre||'',
    ref: item.ref||'',
    categoria: item.categoria||'Jeans',
    precio: item.precio||'',
    linea: item.linea||'premium',
    foto_url: item.foto_url||'',
    tallas: item.tallas||{},
    notas: item.notas||'',
  });
  const [localImg, setLocalImg] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);

  function set(k,v){ setF(p=>({...p,[k]:v})); }
  function setT(t,v){ setF(p=>({...p,tallas:{...p.tallas,[t]:parseInt(v)||0}})); }

  async function handleFoto(e){
    const file = e.target.files[0]; if(!file) return;
    setLocalImg(URL.createObjectURL(file));
    setUploading(true);
    try{
      const url = await DB.subirFoto(file, f.id);
      set('foto_url', url);
      toast('Foto subida ✓');
    } catch(err){ toast('Error al subir foto'); }
    setUploading(false);
  }

  /* foto de medidas: se guarda en el almacenamiento (medidas/<id>.jpg); el bot la manda cuando piden medidas */
  const [medidasSrc, setMedidasSrc] = useState('');
  const [uploadingM, setUploadingM] = useState(false);
  useEffect(()=>{
    if(isNew) return;
    const im = new Image();
    im.onload = ()=> setMedidasSrc(DB.urlMedidas(f.id)+'?v='+Date.now());
    im.src = DB.urlMedidas(f.id)+'?c='+Date.now();
  },[]);
  async function handleMedidas(e){
    const file = e.target.files[0]; if(!file) return;
    setMedidasSrc(URL.createObjectURL(file));
    setUploadingM(true);
    try{
      const url = await DB.subirMedidas(file, f.id);
      setMedidasSrc(url);
      toast('Foto de medidas subida ✓');
    } catch(err){ toast('Error al subir la foto de medidas'); setMedidasSrc(''); }
    setUploadingM(false);
  }

  async function handleSave(){
    if(!f.nombre.trim()){ toast('Escribe el nombre del producto'); return; }
    const pr = Number(f.precio);
    if(f.precio!=='' && pr>0 && pr<1000){ toast('El precio parece incompleto: escribe 75000 (no 75)'); return; }
    setSaving(true);
    try{
      const payload = isNew ? f : (({tallas, ...resto})=>resto)(f);
      const saved = await DB.guardar(payload);
      toast(isNew ? '✓ Producto agregado al inventario' : '✓ Cambios guardados');
      onSave(saved);
    } catch(err){ toast('Error: '+err.message); }
    setSaving(false);
  }

  const imgSrc = localImg || f.foto_url;

  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{isNew ? <>Nuevo <em>producto</em></> : <>Editar <em>producto</em></>}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>

      <div className="drawer-body">

        {/* FOTO */}
        <div className="field">
          <label>Foto del producto</label>
          {imgSrc
            ? <div className="foto-preview-wrap">
                <img src={imgSrc} className="foto-preview" alt=""/>
                {uploading && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleFoto}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleFoto}/>
                <Ico.Camera/>
                <p>{uploading ? 'Subiendo foto...' : 'Toca para subir foto'}</p>
                <small>JPG, PNG o WEBP</small>
              </div>
          }
        </div>

        {/* FOTO DE MEDIDAS */}
        <div className="field">
          <label>Foto de medidas (el bot la manda cuando piden las medidas)</label>
          {medidasSrc
            ? <div className="foto-preview-wrap">
                <img src={medidasSrc} className="foto-preview" alt=""/>
                {uploadingM && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleMedidas}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleMedidas}/>
                <Ico.Camera/>
                <p>{uploadingM ? 'Subiendo foto de medidas...' : 'Toca para subir la foto de medidas'}</p>
                <small>Foto de la prenda con las medidas al lado</small>
              </div>
          }
        </div>

        {/* NOMBRE + REF */}
        <div className="row2">
          <div className="field">
            <label>Nombre *</label>
            <input value={f.nombre} onChange={e=>set('nombre',e.target.value)} placeholder="Jean Tiro Alto"/>
          </div>
          <div className="field">
            <label>Referencia</label>
            <input value={f.ref} onChange={e=>set('ref',e.target.value)} placeholder="NF-J001"/>
          </div>
        </div>

        {/* CATEGORIA + PRECIO */}
        <div className="row2">
          <div className="field">
            <label>Categoría</label>
            <select value={f.categoria} onChange={e=>set('categoria',e.target.value)}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Precio ($)</label>
            <input type="number" value={f.precio} onChange={e=>set('precio',e.target.value)} placeholder="85000"/>
          </div>
        </div>

        {/* LINEA (premium / económica) */}
        <div className="field">
          <label>Línea (para precios por mayor)</label>
          <select value={f.linea} onChange={e=>set('linea',e.target.value)}>
            <option value="premium">Premium (por mayor desde 6: $60.000)</option>
            <option value="economica">Económica (6 a $50.000, 12 a $46.000)</option>
          </select>
        </div>

        {/* TALLAS */}
        <div>
          <div className="section-title">Cantidad por talla</div>
          {!isNew && <div className="stock-ayuda" style={{marginBottom:8}}>Para cambiar las unidades usa los botones <strong>Llegó</strong>, <strong>Vendí</strong> o <strong>Contar</strong> de la tarjeta. Así queda anotado en el historial.</div>}
          <div className="tallas-editor">
            {TALLAS_LIST.map(t=>(
              <div className="talla-cell" key={t}>
                <label>{t}</label>
                <input
                  type="number" min="0" className="talla-num" disabled={!isNew}
                  value={f.tallas[t]||''}
                  onChange={e=>setT(t,e.target.value)}
                  placeholder="0"
                />
              </div>
            ))}
          </div>
        </div>

        {/* NOTAS */}
        <div className="field">
          <label>Notas</label>
          <textarea rows={3} value={f.notas} onChange={e=>set('notas',e.target.value)} placeholder="Color, temporada, proveedor, detalles..."/>
        </div>
      </div>

      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={handleSave} disabled={saving} style={{flex:2}}>
          {saving ? '...' : (isNew ? '+ Agregar al inventario' : 'Guardar cambios')}
        </button>
      </div>
    </div>
  </>;
}

/* ── CARD ── */
function ProductCard({prod, onEdit, onDelete, onStock, onHist}){
  const badge = stockInfo(prod);

  return (

          ? <img src={prod.foto_url} alt={prod.nombre} loading="lazy"/>
          : <div className="no-img"><Ico.Hanger/><span>Sin foto</span></div>
        }
        <div className={`stock-pill ${badge.cls}`}>{badge.label}</div>
      </div>
      <div className="card-body">
        {prod.ref && <div className="card-ref">{prod.ref}</div>}
        <div className="card-name">{prod.nombre}</div>
        {tallasLista.length===0
          ? <div className="tg-vacio">Todavía no hay unidades. Toca <strong>+ Sumar</strong> para cargar lo que llegó.</div>
          : <div className="tg">
              {tallasLista.map(([t,q])=>{
                const n = parseInt(q)||0;
                return <div className={`tg-c ${n===0?'out':n<=2?'low':''}`} key={t} title={`Talla ${t}: ${n} unidades`}><span>T{t}</span><b>{n}</b></div>;
              })}

        }
        {prod.precio && <div className="card-price">{fmt(prod.precio)}</div>}

          <button className="btn btn-out" title="Descontar unidades vendidas por fuera del bot (mayoristas, en físico)" onClick={()=>onStock(prod,'venta_manual')}>− Descontar</button>
          <button className="btn btn-in" title="Sumar mercancía que llegó" onClick={()=>onStock(prod,'llegada')}>+ Sumar</button>

        <div style={{display:'flex',gap:6,marginTop:10}}>

            <Ico.Edit/> Editar
          </button>
          <button className="btn btn-danger-soft" style={{height:30,width:32,padding:0,justifyContent:'center'}} onClick={()=>onDelete(prod)}>
            <Ico.Trash/>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── MOVER STOCK ── */
const MODOS = {
  venta_manual:{titulo:'Descontar unidades', ayuda:'Para ventas que no hizo el bot (mayoristas, en físico). Toca + por cada unidad que salió. Las ventas del bot se descuentan solas.'},
  llegada:{titulo:'Sumar unidades', ayuda:'Para mercancía que llegó. Toca + por cada unidad que entró, o escribe el número.'},
  conteo:{titulo:'Contar inventario', ayuda:'Cuenta lo que hay en físico y escribe el número de cada talla que contaste. La app te muestra la diferencia y deja el inventario con lo que contaste.'},
};
function StockModal({prod, modo, onClose, onDone}){
  const [actual,setActual] = useState(prod.tallas||{});
  const [vals,setVals] = useState({});
  const [nota,setNota] = useState('');
  const [dev,setDev] = useState(false);
  const [saving,setSaving] = useState(false);
  useEffect(()=>{ DB.cargarUno(prod.id).then(p=>setActual(p.tallas||{})).catch(()=>{}); },[]);
  const tipo = (modo==='llegada' && dev) ? 'devolucion' : modo;
  const llaves = Object.keys(actual);
  const base = modo==='venta_manual' ? llaves : [...new Set([...TALLAS_LIST, ...llaves])];
  const tallas = (base.length ? base : TALLAS_LIST).sort((a,b)=>(Number(a)||99)-(Number(b)||99));
  const hay = t => parseInt(actual[t])||0;
  const num = t => { const v = vals[t]; return (v===undefined||v==='') ? null : parseInt(v); };
  const filas = tallas.map(t=>({t, n:num(t)})).filter(x=>x.n!==null && !isNaN(x.n));
  const excede = filas.filter(x=>tipo==='venta_manual' && x.n>hay(x.t));
  const invalidas = filas.filter(x=>x.n<0 || (tipo!=='conteo' && x.n===0));
  const movs = filas.filter(x=>x.n>=0 && (tipo==='conteo' || x.n>0)).map(x=>({talla:x.t, cantidad:x.n}));
  const unidades = movs.reduce((s,m)=>s+m.cantidad,0);
  const difTotal = movs.reduce((s,m)=>s+(m.cantidad-hay(m.talla)),0);
  const puede = movs.length>0 && excede.length===0 && invalidas.length===0 && !saving;
  function paso(t,d){
    setVals(v=>{
      let n = (parseInt(v[t])||0) + d;
      if(n < 0) n = 0;
      if(tipo==='venta_manual' && n > hay(t)) n = hay(t);
      return {...v,[t]: n===0 ? '' : String(n)};
    });
  }
  let resumen = modo==='conteo' ? 'Escribe lo que contaste en cada talla.' : 'Toca + en las tallas que vas a '+(modo==='venta_manual'?'descontar':'sumar')+'.';
  if(movs.length>0){
    if(tipo==='conteo') resumen = difTotal===0 ? 'El conteo coincide con el inventario.' : 'Diferencia total: '+(difTotal>0?'+':'')+difTotal+' unidades. El inventario quedará con lo que contaste.';
    else if(tipo==='venta_manual') resumen = 'Se descontarán '+unidades+' unidad'+(unidades===1?'':'es')+'.';
    else resumen = 'Se sumarán '+unidades+' unidad'+(unidades===1?'':'es')+(tipo==='devolucion'?' (devolución).':'.');
  }
  if(excede.length>0) resumen = 'Solo hay '+excede.map(x=>hay(x.t)+' en la talla '+x.t).join(' y ')+'.';
  async function guardar(){
    if(!puede) return;
    setSaving(true);
    try{
      const nuevas = await DB.moverStock(prod.id,tipo,movs,nota);
      toast('✓ '+(tipo==='conteo'?'Conteo guardado':tipo==='venta_manual'?'Unidades descontadas':tipo==='devolucion'?'Devolución registrada':'Unidades sumadas'));
      onDone(nuevas); onClose();
    }catch(err){ toast('Error: '+(err.message||'no se pudo guardar')); setSaving(false); }
  }
  const textoBtn = saving ? '...' : tipo==='conteo' ? 'Guardar conteo' : tipo==='venta_manual' ? (unidades>0?'Descontar '+unidades:'Descontar') : (unidades>0?'Sumar '+unidades:'Sumar');
  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{MODOS[modo].titulo}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>
      <div className="drawer-body">
        <div className="stock-prod">
          {prod.foto_url ? <img src={prod.foto_url} alt=""/> : <div className="sp-ph"/>}
          <div>
            <div className="sp-n">{prod.nombre}{prod.ref?<span style={{color:'var(--night-3)',fontWeight:500}}> · {prod.ref}</span>:null}</div>
            {prod.precio ? <div className="sp-p">{fmt(prod.precio)}</div> : null}
          </div>
        </div>
        <div className="stock-ayuda">{MODOS[modo].ayuda}</div>
        {modo==='llegada' && (
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
            <input type="checkbox" checked={dev} onChange={e=>setDev(e.target.checked)}/> Es una devolución de una clienta
          </label>
        )}
        {modo==='venta_manual' && llaves.length===0 && <div className="stock-resumen err">Este producto no tiene unidades cargadas todavía.</div>}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {tallas.map(t=>{
            const n = num(t);
            const valido = n!==null && !isNaN(n);
            const malo = (tipo==='venta_manual' && valido && n>hay(t)) || (valido && n<0);
            const dif = (tipo==='conteo' && valido) ? n-hay(t) : null;
            let res = null;
            if(valido && tipo==='venta_manual' && !malo) res = <> → quedan <span className="res amber">{hay(t)-n}</span></>;
            if(valido && (tipo==='llegada'||tipo==='devolucion')) res = <> → quedan <span className="res green">{hay(t)+n}</span></>;
            return (
              <div className={`sr ${malo?'malo':''} ${tipo==='conteo'?'sr-conteo':''}`} key={t}>
                <div className="sr-t">
                  <div className="a">Talla {t}</div>
                  <div className="b">Hay {hay(t)}{res}</div>
                </div>
                {tipo==='conteo'
                  ? <>
                      <div className="sr-ctl">
                        <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                          onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="Contado"/>
                      </div>
                      <div className={`sr-dif ${dif===null?'':dif>0?'dif-mas':dif<0?'dif-menos':'dif-cero'}`}>{dif===null?'':dif===0?'Igual':(dif>0?'+':'')+dif}</div>
                    </>
                  : <div className="sr-ctl">
                      <button type="button" onClick={()=>paso(t,-1)} aria-label="Quitar uno">−</button>
                      <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                        onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="0"/>
                      <button type="button" onClick={()=>paso(t,1)} aria-label="Agregar uno">+</button>
                    </div>
                }
              </div>
            );
          })}
        </div>
        <div className="field">
          <label>Nota (opcional)</label>
          <input value={nota} onChange={e=>setNota(e.target.value)} maxLength={200}
            placeholder={tipo==='llegada'?'Ej: llegada del proveedor, factura 123':tipo==='venta_manual'?'Ej: venta mayorista a Laura':tipo==='conteo'?'Ej: conteo de fin de mes':'Ej: cambio de talla'}/>
        </div>
        <div className={`stock-resumen ${excede.length>0?'err':''}`}>{resumen}</div>
      </div>
      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={guardar} disabled={!puede} style={{flex:2,opacity:puede?1:.5}}>{textoBtn}</button>
      </div>
    </div>
  </>;
}

const TIPO_LABEL = {llegada:'Se sumó', venta_bot:'Vendió el bot', venta_manual:'Descuento manual', conteo:'Conteo', devolucion:'Devolución', ajuste:'Ajuste'};
const CHIP_LABEL = {llegada:'Sumas', venta_bot:'Bot', venta_manual:'Manuales', conteo:'Conteos', devolucion:'Devoluciones'};
function HistorialView({productos, filtro, setFiltro}){
  const [rows,setRows] = useState(null);
  const [tipo,setTipo] = useState('todos');
  const [err,setErr] = useState('');
  useEffect(()=>{ DB.cargarMovimientos().then(setRows).catch(e=>setErr(e.message)); },[]);
  if(err) return <div className="empty"><p>No se pudo cargar el historial: {err}</p></div>;
  if(!rows) return <div className="loading-page"><div className="spinner"/></div>;
  const nombre = id => (productos.find(p=>p.id===id)||{}).nombre;
  const lista = rows.filter(r=>(filtro==='todos'||r.producto_id===filtro)&&(tipo==='todos'||r.tipo===tipo));
  const grupos = [];
  lista.forEach(r=>{
    const k = r.producto_id+'|'+r.tipo+'|'+r.created_at.slice(0,19)+'|'+r.nota;
    let g = grupos.find(x=>x.k===k);
    if(!g){ g = {k, r, items:[]}; grupos.push(g); }
    g.items.push(r);
  });
  let diaPrev = '';
  const ids = [...new Set(rows.map(r=>r.producto_id))];
  return <>
    <div className="hist-filtros">
      <select value={filtro} onChange={e=>setFiltro(e.target.value)}>
        <option value="todos">Todos los productos</option>
        {ids.map(id=><option key={id} value={id}>{nombre(id)||(rows.find(r=>r.producto_id===id)||{}).producto_nombre||id}</option>)}
      </select>
      {['todos','llegada','venta_bot','venta_manual','conteo','devolucion'].map(t=>(
        <button key={t} className={`chip ${tipo===t?'on':''}`} onClick={()=>setTipo(t)}>{t==='todos'?'Todo':CHIP_LABEL[t]}</button>
      ))}
    </div>
    <div className="hist-list">
      {grupos.length===0 && <div className="empty"><p>Todavía no hay movimientos{filtro!=='todos'||tipo!=='todos'?' con ese filtro':''}.</p></div>}
      {grupos.map(g=>{
        const d = new Date(g.r.created_at);
        const dia = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
        const cab = dia!==diaPrev ? <div className="hist-dia" key={'d'+g.k}>{dia}</div> : null;
        diaPrev = dia;
        const items = [...g.items].sort((a,b)=>(Number(a.talla)||99)-(Number(b.talla)||99));
        return <React.Fragment key={g.k}>{cab}
          <div className="hist-item">
            <div className="hist-top">
              <div className="hist-prod">{nombre(g.r.producto_id)||g.r.producto_nombre||g.r.producto_id}</div>
              <span className={`hist-tipo ${g.r.tipo}`}>{TIPO_LABEL[g.r.tipo]||g.r.tipo}</span>
            </div>
            <div className="hist-tallas">
              {items.map(it=><span key={it.id} className={`hist-t ${it.delta>0?'mas':'menos'}`}>T{it.talla}: {it.delta>0?'+':''}{it.delta} <span style={{color:'var(--night-3)',fontWeight:500}}>(quedan {it.stock_despues})</span></span>)}
            </div>
            <div className="hist-meta">{d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}{g.r.nota?' · '+g.r.nota:''}</div>
          </div>
        </React.Fragment>;
      })}
    </div>
  </>;
}

const ESTADO_LABEL = {
  preguntando:'Preguntando',
  cuenta_enviada:'Cuenta enviada',
  comprobante_recibido:'Comprobante recibido',
  pendiente_confirmacion_humana:'Esperando confirmación',

  pidiendo_datos_envio:'Pidiendo datos de envío',
  listo_para_enviar:'Listo para enviar',
  rechazado:'Rechazado',

};

function fechaAmable(iso){
  if(!iso) return '';
  const d = new Date(iso), hoy = new Date(), ayer = new Date(hoy.getTime()-864e5);
  const hora = d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===hoy.toDateString()) return 'Hoy, '+hora;
  if(d.toDateString()===ayer.toDateString()) return 'Ayer, '+hora;
  return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+', '+hora;
}
function agruparPedidos(rows){
  /* Un paquete = una persona + una dirección: los jeans que son de la misma clienta, misma dirección y mismo estado salen en UNA sola tarjeta (así no se empaca uno y se olvida el otro). */
  const g = {};
  rows.forEach(r=>{ const k = [r.cliente_telefono||r.grupo_id||r.id, (r.envio_direccion||'').trim().toLowerCase(), r.estado, r.empacado?1:0].join('|'); (g[k] = g[k] || []).push(r); });
  return Object.values(g).map(fs=>{ const base = fs.slice().sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))[0]; return { id: fs.map(f=>f.id).join(','), filas: fs, base }; });
}
function PedidoEmpaque({g, productos, onMarcar}){
  const b = g.base;
  const nombre = b.envio_nombre || b.cliente_nombre || 'Cliente sin nombre';
  const esperando = b.estado==='pendiente_confirmacion_humana';
  const empacado = g.filas.every(f=>f.empacado);
  const total = g.filas.reduce((s,f)=>s+(Number(f.precio_total)||0),0);
  const nuevo = !empacado && !esperando && (Date.now() - new Date(b.updated_at||b.created_at).getTime() < 120000);
  async function copiar(){
    const t = `Nombre: ${b.envio_nombre||''}\nCédula: ${b.envio_cedula||''}\nTeléfono: ${b.envio_telefono||''}\nDirección: ${b.envio_direccion||''}\nCiudad: ${b.envio_ciudad||''}`;
    try{ await navigator.clipboard.writeText(t); toast('Datos copiados'); }catch(e){ toast('No se pudo copiar'); }
  }
  return (
    <div className={`pk-card ${nuevo?'nuevo':''} ${empacado?'hecho':''}`}>
      <div className="pk-top">
        <div className="pk-nombre">{nombre}{nuevo && <span className="pk-nuevo">NUEVO</span>}</div>
        <div className="pk-fecha">{fechaAmable(b.updated_at||b.created_at)}</div>
      </div>
      <div className="pk-items">
        {g.filas.map(f=>{
          const pr = productos.find(x=>x.id===f.producto_id);
          return <div className="pk-item" key={f.id}><b>{pr ? pr.nombre.trim() : 'Jean (ya no está en el inventario)'}</b> · Talla <b>{f.talla}</b> · <b>{f.cantidad}</b> {Number(f.cantidad)===1?'unidad':'unidades'}</div>;
        })}
      </div>
      <div className="pk-total">Total del pedido: {fmt(total)}</div>
      {b.envio_direccion ? (
        <div className="pk-envio">
          <div className="t">Datos de envío</div>
          <div className="f"><span>Nombre</span><span>{b.envio_nombre}</span></div>
          <div className="f"><span>Cédula</span><span>{b.envio_cedula}</span></div>
          <div className="f"><span>Teléfono</span><span>{b.envio_telefono}</span></div>
          <div className="f"><span>Dirección</span><span>{b.envio_direccion}</span></div>
          <div className="f"><span>Ciudad</span><span>{b.envio_ciudad}</span></div>
        </div>
      ) : <div className="pk-falta">Todavía no mandó los datos de envío.</div>}
      <div className="pk-acciones">
        {b.envio_direccion && <button className="pk-btn sec" onClick={copiar}>Copiar datos de envío</button>}
        {!esperando && !empacado && <button className="pk-btn ok" onClick={()=>onMarcar(g,true)}>Ya empaqué este pedido</button>}
        {empacado && <button className="pk-btn sec" onClick={()=>onMarcar(g,false)}>Deshacer</button>}
      </div>
    </div>
  );
}

function pitidoNuevo(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.value=0.08; o.start(); setTimeout(()=>{ o.stop(); c.close(); },200); if(navigator.vibrate) navigator.vibrate(120); }catch(e){} }
function PedidosView({productos}){
  const [pedidos, setPedidos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [filtro, setFiltro] = useState('listo');

  useEffect(()=>{
    cargar();
    // se actualiza solo cada 8 s mientras la pestana esta a la vista; avisa cuando entra un pedido nuevo
    const t = setInterval(async ()=>{
      if(document.visibilityState!=='visible') return;
      try{
        const nuevos = await DB.cargarPedidos();
        setPedidos(prev=>{
          const ids = new Set(prev.map(x=>x.id));
          const nu = nuevos.filter(x=>!ids.has(x.id) && x.estado==='listo_para_enviar');
          const cambio = prev.length && nuevos.some(x=>x.estado==='listo_para_enviar' && !x.empacado && prev.some(y=>y.id===x.id && y.estado!=='listo_para_enviar'));
          if(prev.length && (nu.length || cambio)){ toast('Pedido nuevo para empacar'); pitidoNuevo(); }
          return nuevos;
        });
      }catch(e){}
    }, 8000);
    // al volver a la pantalla (desbloquear el celular, cambiar de pestana) se actualiza al instante
    const alVolver = ()=>{ if(document.visibilityState==='visible') DB.cargarPedidos().then(setPedidos).catch(()=>{}); };
    document.addEventListener('visibilitychange', alVolver);
    window.addEventListener('online', alVolver);
    return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange', alVolver); window.removeEventListener('online', alVolver); };
  },[]);

  async function cargar(){
    setCargando(true);
    try{ setPedidos(await DB.cargarPedidos()); }
    catch(e){ toast('Error: '+e.message); }
    setCargando(false);
  }
  async function marcar(g, valor){
    const ids = g.filas.map(f=>f.id);
    const {error} = await sb.from('nf_pedidos').update({empacado:valor}).in('id',ids);
    if(error){ toast('No se pudo guardar: '+error.message); return; }
    setPedidos(prev=>prev.map(p=>ids.includes(p.id)?{...p,empacado:valor}:p));
    toast(valor?'Listo, pedido empacado':'Pedido devuelto a la lista');
  }

  const listos = agruparPedidos(pedidos.filter(p=>p.estado==='listo_para_enviar'));
  const porEmpacar = listos.filter(g=>!g.filas.every(f=>f.empacado));
  const empacados = listos.filter(g=>g.filas.every(f=>f.empacado));
  const esperando = agruparPedidos(pedidos.filter(p=>p.estado==='pendiente_confirmacion_humana'));
  const lista = filtro==='listo' ? porEmpacar : filtro==='esperando' ? esperando : empacados;
  const vacio = {listo:'No hay pedidos por empacar por ahora. Cuando llegue uno, aparece aquí solo.', esperando:'No hay pagos en revisión.', hechos:'Todavía no has marcado pedidos como empacados.'}[filtro];

  return (
    <div>
      <div className="pk-chips">
        <button className={`pk-chip ${filtro==='listo'?'on':''}`} onClick={()=>setFiltro('listo')}>Listo para enviar ({porEmpacar.length})</button>
        <button className={`pk-chip ${filtro==='esperando'?'on':''}`} onClick={()=>setFiltro('esperando')}>Esperando confirmación ({esperando.length})</button>
        <button className={`pk-chip ${filtro==='hechos'?'on':''}`} onClick={()=>setFiltro('hechos')}>Ya empacados ({empacados.length})</button>
      </div>
      {filtro==='esperando' && <div className="pk-nota">Estos pedidos todavía <b>no se deben empacar</b>: el pago se está revisando. Cuando se confirme, pasan solos a "Listo para enviar".</div>}
      <div className="pedidos-list">
        {cargando
          ? <div className="loading-page"><div className="spinner"/></div>
          : lista.length===0
            ? <div className="empty"><p style={{fontSize:18}}>{vacio}</p></div>
            : lista.map(g=><PedidoEmpaque key={g.id} g={g} productos={productos} onMarcar={marcar}/>)
        }
      </div>
    </div>
  );
}

function LiveView({productos}){
  const [estado, setEstado] = useState(null);
  const [guardando, setGuardando] = useState(false);
  useEffect(()=>{ DB.cargarLive().then(setEstado).catch(e=>toast('Error: '+e.message)); },[]);

  async function cambiar(patch){
    setGuardando(true);
    try{ setEstado(await DB.guardarLive(patch)); }
    catch(e){ toast('Error: '+e.message); }
    setGuardando(false);
  }
  async function copiar(){
    try{ await navigator.clipboard.writeText(MSG_LIVE); toast('Instrucciones copiadas ✓'); }
    catch(e){ toast('No se pudo copiar, selecciona el texto y cópialo'); }
  }

  if(!estado) return <div className="loading-page"><div className="spinner"/></div>;
  const activo = !!estado.modo_live;
  const pausado = !!estado.bot_pausado;
  const auto = !!estado.autoconfirmar;
  const orden = Array.isArray(estado.orden_live) ? estado.orden_live : [];
  const porId = Object.fromEntries(productos.map(p=>[p.id,p]));
  const enLive = orden.map(id=>porId[id]).filter(Boolean);
  const disponibles = productos.filter(p=>Number(p.precio)>=1000 && !orden.includes(p.id));

  function agregar(id){ cambiar({orden_live:[...orden,id]}); }
  function quitar(id){ cambiar({orden_live:orden.filter(x=>x!==id), ...(estado.producto_live===id?{producto_live:null}:{})}); }
  function mover(i,dir){
    const j=i+dir; if(j<0||j>=orden.length) return;
    const n=[...orden]; [n[i],n[j]]=[n[j],n[i]]; cambiar({orden_live:n});
  }
  const mini = {height:34,minWidth:34,borderRadius:8,border:'1.5px solid var(--border)',background:'var(--white)',cursor:'pointer',fontFamily:'inherit',fontSize:14};

  return (
    <div style={{padding:'1rem 1.25rem 3rem',maxWidth:720,margin:'0 auto'}}>
      <div style={{background:pausado?'var(--red-l)':'var(--white)',border:'1.5px solid '+(pausado?'var(--red)':'var(--border)'),borderRadius:'var(--r)',padding:'1rem 1.1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:12}}>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>{pausado?'Bot de WhatsApp PAUSADO':'Bot de WhatsApp activo'}</div>
          <div style={{fontSize:13,color:'var(--night-3)',marginTop:4}}>
            {pausado ? 'No responde a las clientas. Reanúdalo cuando todo esté bien.' : 'Si algo falla, páusalo aquí desde cualquier celular. También puedes escribirle "pausar bot" desde el número de la jefa.'}
          </div>
        </div>
        <button className={`btn btn-lg ${pausado?'btn-primary':'btn-danger-soft'}`} disabled={guardando} onClick={()=>{ if(pausado || confirm('¿Pausar el bot? Dejará de responder a las clientas.')) cambiar({bot_pausado:!pausado}); }}>
          {pausado?'Reanudar':'Pausar'}
        </button>
      </div>
      <div style={{background:'var(--white)',border:'1.5px solid var(--border)',borderRadius:'var(--r)',padding:'1rem 1.1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:12}}>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>{auto?'Confirmación automática de pagos: ACTIVADA':'Confirmación automática de pagos: apagada'}</div>
          <div style={{fontSize:13,color:'var(--night-3)',marginTop:4}}>
            {auto ? 'Si el comprobante es válido (monto exacto y referencia sin repetir), el bot da el pago por registrado y pide los datos de envío. Tú verificas después en el panel (Conciliar). Si algo no cuadra, te avisa por WhatsApp.' : 'Cada comprobante te llega por WhatsApp y tú respondes SI con el código.'}
          </div>
        </div>
        <button className={`btn btn-lg ${auto?'btn-danger-soft':'btn-primary'}`} disabled={guardando} onClick={()=>cambiar({autoconfirmar:!auto})}>
          {auto?'Apagar':'Activar'}
        </button>
      </div>
      <div style={{background:activo?'var(--red-l)':'var(--white)',border:'1.5px solid '+(activo?'var(--red)':'var(--border)'),borderRadius:'var(--r)',padding:'1rem 1.1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>{activo?'Modo Live ACTIVO':'Modo Live apagado'}</div>
          <div style={{fontSize:13,color:'var(--night-3)',marginTop:4}}>
            {activo ? 'El bot responde más corto, no manda fotos por su cuenta y atiende más rápido.' : 'Prende el modo live cuando empieces el live y apágalo al terminar.'}
          </div>
        </div>
        <button className={`btn btn-lg ${activo?'btn-danger-soft':'btn-primary'}`} disabled={guardando} onClick={()=>cambiar({modo_live:!activo})}>
          {activo?'Apagar':'Prender'}
        </button>
      </div>

      <h3 style={{margin:'1.4rem 0 .3rem',fontSize:15}}>Jeans de este live (numerados)</h3>
      <p style={{fontSize:13,color:'var(--night-3)',marginBottom:'.7rem'}}>
        Las clientas escriben "jean 1 talla 8". Muestra el número en pantalla (un cartel con "JEAN 1"). Marca "En pantalla" el que estás mostrando: si alguien escribe solo "quiero talla 8", el bot entiende que habla de ese.
      </p>
      <div style={{display:'grid',gap:8}}>
        {enLive.length===0 && <div style={{fontSize:13,color:'var(--night-3)'}}>Aún no has agregado jeans al live. Agrégalos abajo, en el orden en que los vas a mostrar.</div>}
        {enLive.map((p,i)=>{
          const ahora = estado.producto_live===p.id;
          return (
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:'var(--r)',border:'2px solid '+(ahora?'var(--blush-d)':'var(--border)'),background:ahora?'var(--blush-l)':'var(--white)'}}>
              <div style={{minWidth:54,fontWeight:700,color:'var(--blush-dd)',fontSize:14}}>Jean {i+1}</div>
              <div style={{width:40,height:54,borderRadius:8,overflow:'hidden',background:'var(--blush-l)',flex:'none'}}>
                {p.foto_url && <img src={p.foto_url} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.nombre}</div>
                <div style={{fontSize:12,color:'var(--night-3)'}}>{fmt(p.precio)} · {stockTotal(p)===0?'Agotado':stockTotal(p)+' uds'}</div>
                <button disabled={guardando} onClick={()=>cambiar({producto_live:ahora?null:p.id})}
                  style={{marginTop:4,fontSize:12,fontWeight:600,border:'none',borderRadius:6,padding:'3px 8px',cursor:'pointer',fontFamily:'inherit',background:ahora?'var(--blush-d)':'var(--mist)',color:ahora?'white':'var(--night-2)'}}>
                  {ahora?'En pantalla':'Marcar en pantalla'}
                </button>
              </div>
              <div style={{display:'flex',gap:4}}>
                <button style={mini} disabled={guardando||i===0} onClick={()=>mover(i,-1)}>↑</button>
                <button style={mini} disabled={guardando||i===enLive.length-1} onClick={()=>mover(i,1)}>↓</button>
                <button style={{...mini,color:'var(--red)'}} disabled={guardando} onClick={()=>quitar(p.id)}>✕</button>
              </div>
            </div>
          );
        })}
      </div>

      {disponibles.length>0 && <>
        <h3 style={{margin:'1.4rem 0 .5rem',fontSize:15}}>Agregar al live</h3>
        <div style={{display:'grid',gap:8}}>
          {disponibles.map(p=>(
            <button key={p.id} disabled={guardando} onClick={()=>agregar(p.id)}
              style={{display:'flex',alignItems:'center',gap:12,textAlign:'left',padding:'8px 10px',borderRadius:'var(--r)',cursor:'pointer',border:'1.5px dashed var(--border)',background:'var(--white)',fontFamily:'inherit'}}>
              <div style={{width:40,height:54,borderRadius:8,overflow:'hidden',background:'var(--blush-l)',flex:'none'}}>
                {p.foto_url && <img src={p.foto_url} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14}}>{p.nombre}</div>
                <div style={{fontSize:12,color:'var(--night-3)'}}>{fmt(p.precio)} · {stockTotal(p)===0?'Agotado':stockTotal(p)+' uds'}</div>
              </div>
              <div style={{fontSize:13,fontWeight:600,color:'var(--blush-dd)'}}>+ Jean {orden.length+1}</div>
            </button>
          ))}
        </div>
      </>}

      <h3 style={{margin:'1.6rem 0 .5rem',fontSize:15}}>Mensaje para las clientas del live</h3>
      <pre style={{whiteSpace:'pre-wrap',fontFamily:'inherit',fontSize:13,background:'var(--white)',border:'1.5px solid var(--border)',borderRadius:'var(--r)',padding:'12px 14px',lineHeight:1.5}}>{MSG_LIVE}</pre>
      <button className="btn btn-primary btn-lg" style={{marginTop:10}} onClick={copiar}>Copiar mensaje</button>
    </div>
  );
}

/* ── LOGIN ── */
function Login({onLogin}){
  const [pwd, setPwd] = useState('');
  const [err, setErr] = useState('');
  function tryLogin(){
    if(pwd===PASS){ onLogin(); }
    else{ setErr('Contraseña incorrecta'); }
  }
  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7l.5 1h9l.5-1c2.5-1.5 4-4 4-7 0-5-4-9-9-9Z"/></svg>
        </div>
        <h1 className="login-title">Nova <em>Floe</em></h1>
        <p className="login-sub">Ingresa tu contraseña para acceder al inventario</p>
        <label>Contraseña</label>
        <input
          type="password" placeholder="••••••••••"
          value={pwd} onChange={e=>setPwd(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&tryLogin()}
          autoFocus
        />
        {err && <div className="login-err">{err}</div>}
        <button className="btn-login" onClick={tryLogin}>Entrar</button>
      </div>
    </div>
  );
}

/* ── APP ── */
function App(){
  const [auth, setAuth] = useState(()=>{ try{ return sessionStorage.getItem('nf_ok')==='1' || (Date.now() - Number(localStorage.getItem('nf_ok_ts')||0) < 30*864e5); }catch(e){ return false; } });
  const [view, setView] = useState('inventario');
  const [prods, setProds] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [editing, setEditing] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [cat, setCat] = useState('Todos');
  const [q, setQ] = useState('');
  const [stockModal, setStockModal] = useState(null);
  const escrituraRef = useRef(0);
  const [histProd, setHistProd] = useState('todos');

  useEffect(()=>{ if(auth) cargar(); },[auth]);
  useEffect(()=>{
    if(!auth) return;
    const refrescar = ()=>{
      if(document.hidden) return;
      const t0 = Date.now();
      DB.cargar().then(d=>{ if(escrituraRef.current > t0 - 500) return; setProds(d); }).catch(()=>{});
    };
    const id = setInterval(refrescar, 15000);
    document.addEventListener('visibilitychange', refrescar);
    return ()=>{ clearInterval(id); document.removeEventListener('visibilitychange', refrescar); };
  },[auth]);

  async function cargar(){
    setCargando(true);
    try{ setProds(await DB.cargar()); }
    catch(e){ toast('Error: '+e.message); }
    setCargando(false);
  }

  function login(){ try{ sessionStorage.setItem('nf_ok','1'); localStorage.setItem('nf_ok_ts', String(Date.now())); }catch(e){} setAuth(true); }

  function onSave(saved){
    setProds(p=>{
      const i=p.findIndex(x=>x.id===saved.id);
      if(i>=0){ const n=[...p]; n[i]=saved; return n; }
      return [saved,...p];
    });
    setEditing(null);
  }

  async function onDelete(prod){
    setConfirm(null);
    await DB.eliminar(prod.id);
    setProds(p=>p.filter(x=>x.id!==prod.id));
    toast('Producto eliminado');
  }

  if(!auth) return <Login onLogin={login}/>;

  const cats = ['Todos',...CATS.filter(c=>prods.some(p=>p.categoria===c))];
  const filtrados = prods.filter(p=>{
    const mc = cat==='Todos'||p.categoria===cat;
    const mq = !q||p.nombre?.toLowerCase().includes(q.toLowerCase())||p.ref?.toLowerCase().includes(q.toLowerCase());
    return mc&&mq;
  });

  const total = prods.length;
  const unidades = prods.reduce((s,p)=>s+stockTotal(p),0);
  const pocos = prods.filter(p=>{ const t=stockTotal(p); return t>0&&t<=3; }).length;
  const agotados = prods.filter(p=>stockTotal(p)===0).length;

  return (
    <div>
      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">
            <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7l.5 1h9l.5-1c2.5-1.5 4-4 4-7 0-5-4-9-9-9Z"/></svg>
          </div>
          <span className="brand-name">Nova <em>Floe</em></span>
        </div>
        <div className="topbar-right">
          <button className="btn btn-ghost" title="Actualizar la página" onClick={()=>{ window.location.href = window.location.pathname + '?v=' + Date.now(); }}>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></svg> Actualizar
          </button>
          {view==='inventario' && (
            <button className="btn btn-primary" onClick={()=>setEditing({})}>
              <Ico.Plus/> Agregar
            </button>
          )}
        </div>
      </div>

      {/* TABS */}
      <div className="tabs">
        <button className={`tab ${view==='inventario'?'on':''}`} onClick={()=>setView('inventario')}>Inventario</button>
        <button className={`tab ${view==='pedidos'?'on':''}`} onClick={()=>setView('pedidos')}>Pedidos vendidos</button>
        <button className={`tab ${view==='historial'?'on':''}`} onClick={()=>setView('historial')}>Historial</button>
        <button className={`tab ${view==='live'?'on':''}`} onClick={()=>setView('live')}>Live</button>
      </div>

      {view==='pedidos' ? <PedidosView productos={prods}/> : view==='historial' ? <HistorialView productos={prods} filtro={histProd} setFiltro={setHistProd}/> : view==='live' ? <LiveView productos={prods}/> : <>

      {/* STATS */}
      <div className="stats-bar">
        <div className="stat"><div className="stat-label">Productos</div><div className="stat-val accent">{total}</div></div>
        <div className="stat"><div className="stat-label">Unidades</div><div className="stat-val">{unidades}</div></div>
        <div className="stat"><div className="stat-label">Poco stock</div><div className="stat-val warn">{pocos}</div></div>
        <div className="stat"><div className="stat-label">Agotados</div><div className="stat-val danger">{agotados}</div></div>
      </div>

      <div className="auto-nota">Las unidades se actualizan solas cuando el bot vende.</div>

      {/* TOOLBAR */}
      <div className="toolbar">
        {cats.map(c=>(
          <button key={c} className={`chip ${cat===c?'on':''}`} onClick={()=>setCat(c)}>{c}</button>
        ))}
        <div className="search-box">
          <Ico.Search/>
          <input placeholder="Buscar por nombre o referencia..." value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
      </div>

      {/* GRID */}
      <div className="grid">
        {cargando
          ? <div className="loading-page" style={{gridColumn:'1/-1'}}><div className="spinner"/></div>
          : filtrados.length===0
            ? <div className="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7l.5 1h9l.5-1c2.5-1.5 4-4 4-7 0-5-4-9-9-9Z"/></svg>
                <p>{total===0 ? 'Aún no hay productos. Toca "+ Agregar" para empezar.' : 'Ningún producto coincide con la búsqueda.'}</p>
                {total===0 && <button className="btn btn-primary btn-lg" onClick={()=>setEditing({})}>+ Agregar primer producto</button>}
              </div>
            : filtrados.map(p=>(
                <ProductCard key={p.id} prod={p} onEdit={setEditing} onDelete={setConfirm} onStock={(prod,modo)=>setStockModal({prod,modo})} onHist={prod=>{ setHistProd(prod.id); setView('historial'); }}/>
              ))
        }
      </div>

      </>}

      {/* EDITOR */}
      {editing!==null && <Editor item={editing} onSave={onSave} onClose={()=>setEditing(null)}/>}

      {/* MOVER STOCK */}
      {stockModal && <StockModal prod={stockModal.prod} modo={stockModal.modo} onClose={()=>setStockModal(null)}
        onDone={tallas=>{ escrituraRef.current = Date.now(); setProds(ps=>ps.map(x=>x.id===stockModal.prod.id?{...x,tallas}:x)); }}/>}

      {/* CONFIRM */}
      {confirm && (
        <div className="modal-bg">
          <div className="modal">
            <h3>¿Eliminar?</h3>
            <p>Se eliminará "<strong>{confirm.nombre}</strong>" del inventario. Esta acción no se puede deshacer.</p>
            <div className="modal-btns">
              <button className="btn btn-ghost" onClick={()=>setConfirm(null)}>Cancelar</button>
              <button className="btn btn-danger-soft btn-lg" onClick={()=>onDelete(confirm)}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
