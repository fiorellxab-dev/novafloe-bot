<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nova Floe — Inventario</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Nova Floe"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  /* marca-novafloe: colores del logo (negro + rosado #FBA6DA) */
  --blush:   #FBA6DA;
  --blush-d: #121212;
  --blush-dd:#000000;
  --blush-l: #FFF1F9;
  --blush-m: #FDD3EC;
  --night:   #121212;
  --night-2: #3A3539;
  --night-3: #6F666C;
  --mist:    #FCF8FA;
  --white:   #FFFFFF;
  --border:  #F2E1EB;
  --green:   #3D7A5A;
  --green-l: #E4F2EB;
  --amber:   #B07820;
  --amber-l: #FBF0D8;
  --red:     #C03040;
  --red-l:   #FCEAEC;
  --body:    'DM Sans', sans-serif;
  --display: 'Playfair Display', serif;
  --r: 14px;
  --r-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--body);background:var(--mist);color:var(--night);min-height:100vh;}

/* LOGIN */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: linear-gradient(160deg, #FFF1F9 0%, #FFFFFF 55%, #FDE3F2 100%);
  padding:1.5rem;
}
.login-card{
  background:var(--white);border-radius:24px;padding:2.5rem 2rem;
  width:100%;max-width:360px;
  box-shadow: 0 8px 40px rgba(251,166,218,.28), 0 2px 8px rgba(18,18,18,.05);
}
.login-logo{
  width:56px;height:56px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;
}
.login-logo svg{width:26px;height:26px;fill:white;}
.login-title{font-family:var(--display);font-size:26px;text-align:center;color:var(--night);margin-bottom:4px;}
.login-title em{font-style:italic;color:var(--blush-d);}
.login-sub{font-size:13px;color:var(--night-3);text-align:center;margin-bottom:1.75rem;}
.login-card label{font-size:12px;font-weight:600;color:var(--night-2);display:block;margin-bottom:6px;letter-spacing:.3px;}
.login-card input{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:11px 14px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
  margin-bottom:12px;
}
.login-card input:focus{border-color:var(--blush-d);background:white;}
.login-err{font-size:12px;color:var(--red);margin-bottom:10px;text-align:center;}
.btn-login{
  width:100%;height:44px;background:var(--blush-d);color:white;border:none;
  border-radius:var(--r-sm);font-family:var(--body);font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.2px;transition:background .15s;
}
.btn-login:hover{background:var(--blush-dd);}

/* TOPBAR */
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 1.25rem;height:58px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px;fill:white;}
.brand-name{font-family:var(--display);font-size:18px;color:var(--night);}
.brand-logo{height:30px;width:auto;display:block}
@media (max-width:480px){ .topbar{padding:0 12px;gap:8px} .brand-logo{height:22px} .topbar-right .btn{padding:0 12px} .solo-ancho{display:none} }
.login-logo-img{display:block;width:230px;max-width:80%;height:auto;margin:0 auto 1.25rem;}
.brand-name em{font-style:italic;color:var(--blush-d);}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* BUTTONS */
.btn{
  border:none;border-radius:var(--r-sm);padding:0 16px;height:36px;
  font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn-primary{background:var(--blush-d);color:white;}
.btn-primary:hover{background:var(--blush-dd);}
.btn-ghost{background:transparent;color:var(--night-2);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--blush-l);}
.btn-danger-soft{background:var(--red-l);color:var(--red);border:none;}
.btn-danger-soft:hover{background:#f5c5ca;}
.btn-lg{height:44px;font-size:14px;padding:0 20px;}
/* pulido-tarjetas */
.card-body .btn-ghost svg,.card-body .btn-danger-soft svg{width:14px;height:14px;flex:none;}

/* STATS */
.stats-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;padding:1.1rem 1.25rem 0;
}
.stat{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:.85rem 1rem;
}
.stat-label{font-size:11px;color:var(--night-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:500;}
.stat-val{font-size:24px;font-weight:600;line-height:1;color:var(--night);}
.stat-val.accent{color:var(--blush-d);}
.stat-val.warn{color:var(--amber);}
.stat-val.danger{color:var(--red);}

/* FILTERS */
.toolbar{
  padding:.85rem 1.25rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.chip{
  border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;
  font-size:12px;font-family:var(--body);font-weight:500;background:transparent;
  color:var(--night-3);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--blush);color:var(--blush-d);}
.chip.on{background:var(--blush-d);border-color:var(--blush-d);color:white;}
.search-box{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--white);border:1.5px solid var(--border);border-radius:20px;
  padding:0 14px;height:34px;
}
.search-box svg{width:14px;height:14px;opacity:.35;flex-shrink:0;}
.search-box input{
  border:none;outline:none;background:transparent;font-family:var(--body);
  font-size:13px;color:var(--night);width:100%;
}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;padding:0 1.25rem 2rem;
}
.card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(251,166,218,.35);}
.card-photo{aspect-ratio:3/4;background:var(--blush-l);position:relative;overflow:hidden;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-photo .no-img{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--blush);
}
.card-photo .no-img svg{width:32px;height:32px;opacity:.4;}
.card-photo .no-img span{font-size:11px;opacity:.5;}
.stock-pill{
  position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;background:var(--green-l);color:var(--green);
}
.stock-pill.low{background:var(--amber-l);color:var(--amber);}
.stock-pill.out{background:var(--red-l);color:var(--red);}
.card-body{padding:.7rem .85rem .85rem;}
.card-ref{font-size:10px;color:var(--night-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.card-name{font-size:13px;font-weight:600;color:var(--night);line-height:1.3;margin-bottom:6px;}
.tallas-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
.t-chip{
  font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px;
  background:var(--blush-l);color:var(--blush-dd);
}
.t-chip.low{background:var(--amber-l);color:var(--amber);}
.t-chip.out{background:var(--red-l);color:var(--red);text-decoration:line-through;}
.card-price{font-size:14px;font-weight:700;color:var(--blush-d);}

/* EMPTY */
.empty{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4rem 1rem;gap:12px;
}
.empty svg{width:48px;height:48px;color:var(--blush-m);}
.empty p{font-size:14px;color:var(--night-3);text-align:center;}

/* DRAWER */
.drawer-bg{position:fixed;inset:0;background:rgba(26,17,24,.45);z-index:150;backdrop-filter:blur(2px);}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(460px,100vw);
  background:var(--white);z-index:160;overflow-y:auto;
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(26,17,24,.12);
}
.drawer-head{
  padding:1rem 1.25rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--white);z-index:5;
}
.drawer-head h3{font-family:var(--display);font-size:20px;color:var(--night);}
.drawer-head h3 em{font-style:italic;color:var(--blush-d);}
.close-btn{
  width:32px;height:32px;border:1.5px solid var(--border);border-radius:50%;
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.close-btn svg{width:14px;height:14px;stroke:var(--night-2);fill:none;stroke-width:2;}
.drawer-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex:1;}

/* FORM */
.field label{font-size:11px;font-weight:600;color:var(--night-2);display:block;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blush-d);background:white;
}
.field textarea{resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* FOTO UPLOAD */
.foto-drop{
  border:2px dashed var(--blush-m);border-radius:var(--r);padding:1.5rem;
  text-align:center;cursor:pointer;transition:background .15s;position:relative;
  background:var(--blush-l);
}
.foto-drop:hover{background:var(--blush-m);}
.foto-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.foto-drop svg{width:32px;height:32px;stroke:var(--blush-d);fill:none;stroke-width:1.5;margin-bottom:8px;}
.foto-drop p{font-size:13px;color:var(--blush-d);font-weight:500;}
.foto-drop small{font-size:11px;color:var(--night-3);}
.foto-preview-wrap{position:relative;}
.foto-preview{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);display:block;}
.foto-change{
  position:absolute;bottom:10px;right:10px;background:white;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:4px;color:var(--night-2);
}
.foto-change input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.uploading-overlay{
  position:absolute;inset:0;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;border-radius:var(--r);
}

/* TALLAS */
.tallas-editor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.talla-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
.talla-cell label{font-size:10px;font-weight:700;color:var(--night-3);text-transform:uppercase;}
.talla-num{
  width:100%;border:1.5px solid var(--border);border-radius:6px;
  padding:6px 4px;text-align:center;font-size:13px;font-weight:600;
  font-family:var(--body);outline:none;color:var(--night);background:var(--mist);
  transition:border-color .15s;
}
.talla-num:focus{border-color:var(--blush-d);background:white;}
.talla-num::-webkit-outer-spin-button,.talla-num::-webkit-inner-spin-button{-webkit-appearance:none;}

/* SECCION TALLAS */
.section-title{
  font-size:11px;font-weight:700;color:var(--night-3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px;
}

/* DRAWER FOOTER */
.drawer-footer{
  padding:1rem 1.25rem;border-top:1px solid var(--border);
  display:flex;gap:8px;background:var(--white);
  position:sticky;bottom:0;
}

/* TOAST */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(0);
  background:var(--night);color:white;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:400;white-space:nowrap;
  transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px);}

/* CONFIRM */
.modal-bg{position:fixed;inset:0;background:rgba(26,17,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:20px;padding:1.75rem;width:100%;max-width:300px;text-align:center;}
.modal h3{font-family:var(--display);font-size:20px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--night-3);margin-bottom:1.5rem;line-height:1.5;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;height:40px;}

/* SPINNER */
.spinner{
  width:22px;height:22px;border:2.5px solid var(--blush-m);
  border-top-color:var(--blush-d);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-page{display:flex;align-items:center;justify-content:center;min-height:60vh;}

@media(max-width:480px){
  .tallas-editor{grid-template-columns:repeat(4,1fr);}
  .row2{grid-template-columns:1fr;}
}

/* TABS */
.tabs{display:flex;gap:4px;padding:0 1.25rem;margin-top:.75rem;}
.tab{
  border:none;background:transparent;padding:8px 4px;font-family:var(--body);
  font-size:13px;font-weight:600;color:var(--night-3);cursor:pointer;
  border-bottom:2px solid transparent;
}
.tab.on{color:var(--night);border-bottom:3px solid var(--blush);}

/* PEDIDOS */
.pk-zona{display:flex;gap:6px;margin:1rem 1.25rem 0;padding:5px;background:var(--white);border:2px solid var(--border);border-radius:14px}
.pk-zona button{flex:1;border:0;background:transparent;border-radius:10px;padding:12px 6px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--night-2);display:flex;align-items:center;justify-content:center;gap:6px}
.pk-zona button.on{background:var(--night-2);color:#fff}
.pk-zona .n{background:var(--blush);color:#121212;border-radius:999px;font-size:13px;padding:1px 8px;min-width:22px}
.pk-chips{display:flex;gap:8px;flex-wrap:wrap;padding:1rem 1.25rem 0}
.pk-chip{border:2px solid var(--border);background:var(--white);border-radius:999px;padding:12px 18px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--night-2)}
.pk-chip.on{background:var(--blush-d);border-color:var(--blush-d);color:#fff}
.pk-nota{margin:12px 1.25rem 0;padding:12px 14px;border-radius:12px;background:#FBF0D8;color:#7a5410;font-size:16px;line-height:1.4}
.pk-card{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:18px 18px 16px}
.pk-card.nuevo{border-color:#3D7A5A;box-shadow:0 0 0 4px rgba(61,122,90,.15)}
.pk-card.hecho{opacity:.62}
.pk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pk-nombre{font-size:23px;font-weight:700;line-height:1.2}
.pk-fecha{font-size:16px;color:var(--night-3)}
.pk-nuevo{display:inline-block;background:#3D7A5A;color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:3px 9px;margin-left:8px;vertical-align:middle}
.pk-items{margin:14px 0 6px;display:grid;gap:8px}
.pk-item{font-size:21px;line-height:1.3;padding:10px 14px;background:var(--blush-l);border-radius:12px}
.pk-item b{font-weight:800}
.pk-total{font-size:17px;color:var(--night-3);margin:6px 0 12px}
.pk-envio{background:#F7F3F5;border-radius:12px;padding:12px 14px;display:grid;gap:7px}
.pk-envio .t{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--night-3)}
.pk-envio .f{display:flex;gap:8px;font-size:19px;line-height:1.3;flex-wrap:nowrap}
.pk-envio .f span:first-child{color:var(--night-3);min-width:92px;flex:none}
.pk-envio .f span:last-child{font-weight:700;word-break:break-word}
.pk-falta{background:#FBF0D8;color:#7a5410;border-radius:12px;padding:12px 14px;font-size:18px}
.pk-acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pk-btn{border:none;border-radius:14px;padding:16px 20px;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;flex:1;min-width:150px}
.pk-btn.ok{background:#3D7A5A;color:#fff}
.pk-btn.sec{background:var(--white);border:2px solid var(--border);color:var(--night-2)}
.pedidos-list{display:flex;flex-direction:column;gap:12px;padding:1rem 1.25rem 2rem;}
.pedido-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:1rem;display:flex;flex-direction:column;gap:8px;
}
.pedido-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pedido-cliente{font-size:14px;font-weight:700;color:var(--night);}
.pedido-tel{font-size:12px;color:var(--night-3);}
.estado-badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}
.estado-badge.preguntando,.estado-badge.cuenta_enviada{background:var(--amber-l);color:var(--amber);}
.estado-badge.comprobante_recibido,.estado-badge.pendiente_confirmacion_humana{background:#E4ECF7;color:#2C5AA0;}
.estado-badge.confirmado,.estado-badge.pidiendo_datos_envio,.estado-badge.listo_para_enviar{background:var(--green-l);color:var(--green);}
.estado-badge.rechazado,.estado-badge.cancelado{background:var(--red-l);color:var(--red);}
.pedido-detalle{font-size:13px;color:var(--night-2);line-height:1.5;}
.pedido-detalle b{color:var(--night);}
.pedido-envio{
  background:var(--blush-l);border-radius:var(--r-sm);padding:.6rem .75rem;
  font-size:12px;color:var(--night-2);line-height:1.6;
}
.pedido-comprobante{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--blush-d);text-decoration:none;
}
.pedido-comprobante img{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

/* INVENTARIO: movimientos */
.card-acts{display:grid;grid-template-columns:1.35fr 1fr .9fr;gap:6px;margin-top:10px;}
.card-acts .btn{height:32px;font-size:11.5px;padding:0 4px;justify-content:center;border:none;font-weight:600;white-space:nowrap;}
.btn-in{background:var(--green-l);color:var(--green);} .btn-in:hover{background:#cfe8da;}
.btn-out{background:var(--amber-l);color:var(--amber);} .btn-out:hover{background:#f5e2b5;}
.btn-cnt{background:var(--blush-l);color:var(--blush-dd);} .btn-cnt:hover{background:var(--blush-m);}
.card-acts .btn-hist{grid-column:1/-1;background:transparent;border:1.5px solid var(--border);color:var(--night-2);height:28px;font-size:11.5px;}
.stock-ayuda{font-size:13px;color:var(--night-3);line-height:1.5;}
.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stock-cell{background:var(--mist);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.stock-cell .st-t{font-size:12px;font-weight:700;color:var(--night-2);text-transform:uppercase;}

function redimensionarImagen(file, maxDim, calidad){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width,height} = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else { width = Math.round(width*(maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error('No se pudo procesar la imagen')); return; }
        resolve(blob);
      }, 'image/jpeg', calidad);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

function uid(){ return 'nf'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ return n?'$'+Number(n).toLocaleString('es-CO'):''; }
function stockTotal(p){ return Object.values(p.tallas||{}).reduce((s,v)=>s+(parseInt(v)||0),0); }
function stockInfo(p){

}
function toast(msg){

  const [saving, setSaving] = useState(false);

  function set(k,v){ setF(p=>({...p,[k]:v})); }
  function cambiarCategoria(c){ const lista = tallasDeCategoria(c); setF(p=>({...p, categoria:c, linea: isNew ? (c==='Jeans' ? 'premium' : 'ninguna') : p.linea, tallas: isNew ? Object.fromEntries(Object.entries(p.tallas||{}).filter(([k])=>lista.includes(k))) : p.tallas})); }
  const listaTallas = [...new Set([...tallasDeCategoria(f.categoria), ...Object.keys(f.tallas||{})])].sort(cmpTalla);
  function setT(t,v){ setF(p=>({...p,tallas:{...p.tallas,[t]:parseInt(v)||0}})); }

  async function handleFoto(e){
    const file = e.target.files[0]; if(!file) return;
    setLocalImg(URL.createObjectURL(file));
    setUploading(true);
    try{
      const url = await DB.subirFoto(file, f.id);
      set('foto_url', url);
      toast('Foto subida ✓');
    } catch(err){ toast('Error al subir foto'); }
    setUploading(false);
  }

  /* foto de medidas: se guarda en el almacenamiento (medidas/<id>.jpg); el bot la manda cuando piden medidas */
  const [medidasSrc, setMedidasSrc] = useState('');
  const [uploadingM, setUploadingM] = useState(false);
  useEffect(()=>{
    if(isNew) return;
    const im = new Image();
    im.onload = ()=> setMedidasSrc(DB.urlMedidas(f.id)+'?v='+Date.now());
    im.src = DB.urlMedidas(f.id)+'?c='+Date.now();
  },[]);
  async function handleMedidas(e){
    const file = e.target.files[0]; if(!file) return;
    setMedidasSrc(URL.createObjectURL(file));
    setUploadingM(true);
    try{
      const url = await DB.subirMedidas(file, f.id);
      setMedidasSrc(url);
      toast('Foto de medidas subida ✓');
    } catch(err){ toast('Error al subir la foto de medidas'); setMedidasSrc(''); }
    setUploadingM(false);
  }

  async function handleSave(){
    if(!f.nombre.trim()){ toast('Escribe el nombre del producto'); return; }
    const pr = Number(f.precio);
    if(f.precio!=='' && pr>0 && pr<1000){ toast('El precio parece incompleto: escribe 75000 (no 75)'); return; }
    setSaving(true);
    try{
      const payload = {...(isNew ? f : (({tallas, ...resto})=>resto)(f))};

      const saved = await DB.guardar(payload);
      toast(isNew ? '✓ Producto agregado al inventario' : '✓ Cambios guardados');
      onSave(saved);
    } catch(err){ toast('Error: '+err.message); }
    setSaving(false);
  }

  const imgSrc = localImg || f.foto_url;

  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{isNew ? <>Nuevo <em>producto</em></> : <>Editar <em>producto</em></>}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>

      <div className="drawer-body">

        {/* FOTO */}
        <div className="field">
          <label>Foto del producto</label>
          {imgSrc
            ? <div className="foto-preview-wrap">
                <img src={imgSrc} className="foto-preview" alt=""/>
                {uploading && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleFoto}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleFoto}/>
                <Ico.Camera/>
                <p>{uploading ? 'Subiendo foto...' : 'Toca para subir foto'}</p>
                <small>JPG, PNG o WEBP</small>
              </div>
          }
        </div>

        {/* FOTO DE MEDIDAS */}
        <div className="field">
          <label>Foto de medidas (el bot la manda cuando piden las medidas)</label>
          {medidasSrc
            ? <div className="foto-preview-wrap">
                <img src={medidasSrc} className="foto-preview" alt=""/>
                {uploadingM && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleMedidas}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleMedidas}/>
                <Ico.Camera/>
                <p>{uploadingM ? 'Subiendo foto de medidas...' : 'Toca para subir la foto de medidas'}</p>
                <small>Foto de la prenda con las medidas al lado</small>
              </div>
          }
        </div>

        {/* NOMBRE + REF */}
        <div className="row2">
          <div className="field">
            <label>Nombre *</label>
            <input value={f.nombre} onChange={e=>set('nombre',e.target.value)} placeholder={f.categoria==='Blusas'?'Blusa Lino Blanca':'Jean Tiro Alto'}/>
          </div>
          <div className="field">
            <label>Referencia</label>
            <input value={f.ref} onChange={e=>set('ref',e.target.value)} placeholder={f.categoria==='Blusas'?'NF-B001':'NF-J001'}/>
          </div>
        </div>

        {/* CATEGORIA + PRECIO */}
        <div className="row2">
          <div className="field">
            <label>Categoría</label>
            <select value={f.categoria} onChange={e=>cambiarCategoria(e.target.value)}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Precio ($)</label>
            <input type="number" value={f.precio} onChange={e=>set('precio',e.target.value)} placeholder="85000"/>
          </div>
        </div>

        {/* LINEA (premium / económica) */}
        <div className="field">
          <label>Precio por mayor</label>
          <select value={f.linea} onChange={e=>set('linea',e.target.value)}>
            <option value="ninguna">Sin precio por mayor (solo al detal)</option>
            <option value="premium">Premium (por mayor desde 6: $60.000)</option>
            <option value="economica">Económica (6 a $50.000, 12 a $46.000)</option>
          </select>
        </div>

        {/* TALLAS */}
        <div>
          <div className="section-title">Cantidad por talla</div>
          {!isNew && <div className="stock-ayuda" style={{marginBottom:8}}>Para cambiar las unidades usa los botones <strong>Llegó</strong>, <strong>Vendí</strong> o <strong>Contar</strong> de la tarjeta. Así queda anotado en el historial.</div>}
          <div className="tallas-editor">
            {listaTallas.map(t=>(
              <div className="talla-cell" key={t}>
                <label>{t}</label>
                <input
                  type="number" min="0" className="talla-num" disabled={!isNew}
                  value={f.tallas[t]||''}
                  onChange={e=>setT(t,e.target.value)}
                  placeholder="0"
                />
              </div>
            ))}
          </div>
        </div>

        {/* NOTAS */}
        <div className="field">
          <label>Notas</label>
          <textarea rows={3} value={f.notas} onChange={e=>set('notas',e.target.value)} placeholder="Color, temporada, proveedor, detalles..."/>
        </div>
      </div>

      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={handleSave} disabled={saving} style={{flex:2}}>
          {saving ? '...' : (isNew ? '+ Agregar al inventario' : 'Guardar cambios')}
        </button>
      </div>
    </div>
  </>;
}

/* ── MOVER STOCK ── */
const MODOS = {
  venta_manual:{titulo:'Descontar unidades', ayuda:'Para ventas que no hizo el bot (mayoristas, en físico). Toca + por cada unidad que salió. Las ventas del bot se descuentan solas.'},
  llegada:{titulo:'Sumar unidades', ayuda:'Para mercancía que llegó. Toca + por cada unidad que entró, o escribe el número.'},
  conteo:{titulo:'Contar inventario', ayuda:'Cuenta lo que hay en físico y escribe el número de cada talla que contaste. La app te muestra la diferencia y deja el inventario con lo que contaste.'},
};
function StockModal({prod, modo, onClose, onDone}){
  const [actual,setActual] = useState(prod.tallas||{});
  const [vals,setVals] = useState({});
  const [nota,setNota] = useState('');
  const [dev,setDev] = useState(false);
  const [saving,setSaving] = useState(false);
  useEffect(()=>{ DB.cargarUno(prod.id).then(p=>setActual(p.tallas||{})).catch(()=>{}); },[]);
  const tipo = (modo==='llegada' && dev) ? 'devolucion' : modo;
  const llaves = Object.keys(actual);
  const tallasCat = tallasDeCategoria(prod.categoria);
  const base = modo==='venta_manual' ? llaves : [...new Set([...tallasCat, ...llaves])];
  const tallas = (base.length ? base : tallasCat).sort(cmpTalla);
  const hay = t => parseInt(actual[t])||0;
  const num = t => { const v = vals[t]; return (v===undefined||v==='') ? null : parseInt(v); };
  const filas = tallas.map(t=>({t, n:num(t)})).filter(x=>x.n!==null && !isNaN(x.n));
  const excede = filas.filter(x=>tipo==='venta_manual' && x.n>hay(x.t));
  const invalidas = filas.filter(x=>x.n<0 || (tipo!=='conteo' && x.n===0));
  const movs = filas.filter(x=>x.n>=0 && (tipo==='conteo' || x.n>0)).map(x=>({talla:x.t, cantidad:x.n}));
  const unidades = movs.reduce((s,m)=>s+m.cantidad,0);
  const difTotal = movs.reduce((s,m)=>s+(m.cantidad-hay(m.talla)),0);
  const puede = movs.length>0 && excede.length===0 && invalidas.length===0 && !saving;
  function paso(t,d){
    setVals(v=>{
      let n = (parseInt(v[t])||0) + d;
      if(n < 0) n = 0;
      if(tipo==='venta_manual' && n > hay(t)) n = hay(t);
      return {...v,[t]: n===0 ? '' : String(n)};
    });
  }
  let resumen = modo==='conteo' ? 'Escribe lo que contaste en cada talla.' : 'Toca + en las tallas que vas a '+(modo==='venta_manual'?'descontar':'sumar')+'.';
  if(movs.length>0){
    if(tipo==='conteo') resumen = difTotal===0 ? 'El conteo coincide con el inventario.' : 'Diferencia total: '+(difTotal>0?'+':'')+difTotal+' unidades. El inventario quedará con lo que contaste.';
    else if(tipo==='venta_manual') resumen = 'Se descontarán '+unidades+' unidad'+(unidades===1?'':'es')+'.';
    else resumen = 'Se sumarán '+unidades+' unidad'+(unidades===1?'':'es')+(tipo==='devolucion'?' (devolución).':'.');
  }
  if(excede.length>0) resumen = 'Solo hay '+excede.map(x=>hay(x.t)+' en la talla '+x.t).join(' y ')+'.';
  async function guardar(){
    if(!puede) return;
    setSaving(true);
    try{
      const nuevas = await DB.moverStock(prod.id,tipo,movs,nota);
      toast('✓ '+(tipo==='conteo'?'Conteo guardado':tipo==='venta_manual'?'Unidades descontadas':tipo==='devolucion'?'Devolución registrada':'Unidades sumadas'));
      onDone(nuevas); onClose();
    }catch(err){ toast('Error: '+(err.message||'no se pudo guardar')); setSaving(false); }
  }
  const textoBtn = saving ? '...' : tipo==='conteo' ? 'Guardar conteo' : tipo==='venta_manual' ? (unidades>0?'Descontar '+unidades:'Descontar') : (unidades>0?'Sumar '+unidades:'Sumar');
  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{MODOS[modo].titulo}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>
      <div className="drawer-body">
        <div className="stock-prod">
          {prod.foto_url ? <img src={prod.foto_url} alt=""/> : <div className="sp-ph"/>}
          <div>
            <div className="sp-n">{prod.nombre}{prod.ref?<span style={{color:'var(--night-3)',fontWeight:500}}> · {prod.ref}</span>:null}</div>
            {prod.precio ? <div className="sp-p">{fmt(prod.precio)}</div> : null}
          </div>
        </div>
        <div className="stock-ayuda">{MODOS[modo].ayuda}</div>
        {modo==='llegada' && (
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
            <input type="checkbox" checked={dev} onChange={e=>setDev(e.target.checked)}/> Es una devolución de una clienta
          </label>
        )}
        {modo==='venta_manual' && llaves.length===0 && <div className="stock-resumen err">Este producto no tiene unidades cargadas todavía.</div>}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {tallas.map(t=>{
            const n = num(t);
            const valido = n!==null && !isNaN(n);
            const malo = (tipo==='venta_manual' && valido && n>hay(t)) || (valido && n<0);
            const dif = (tipo==='conteo' && valido) ? n-hay(t) : null;
            let res = null;
            if(valido && tipo==='venta_manual' && !malo) res = <> → quedan <span className="res amber">{hay(t)-n}</span></>;
            if(valido && (tipo==='llegada'||tipo==='devolucion')) res = <> → quedan <span className="res green">{hay(t)+n}</span></>;
            return (
              <div className={`sr ${malo?'malo':''} ${tipo==='conteo'?'sr-conteo':''}`} key={t}>
                <div className="sr-t">
                  <div className="a">Talla {t}</div>
                  <div className="b">Hay {hay(t)}{res}</div>
                </div>
                {tipo==='conteo'
                  ? <>
                      <div className="sr-ctl">
                        <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                          onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="Contado"/>
                      </div>
                      <div className={`sr-dif ${dif===null?'':dif>0?'dif-mas':dif<0?'dif-menos':'dif-cero'}`}>{dif===null?'':dif===0?'Igual':(dif>0?'+':'')+dif}</div>
                    </>
                  : <div className="sr-ctl">
                      <button type="button" onClick={()=>paso(t,-1)} aria-label="Quitar uno">−</button>
                      <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                        onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="0"/>
                      <button type="button" onClick={()=>paso(t,1)} aria-label="Agregar uno">+</button>
                    </div>
                }
              </div>
            );
          })}
        </div>
        <div className="field">
          <label>Nota (opcional)</label>
          <input value={nota} onChange={e=>setNota(e.target.value)} maxLength={200}
            placeholder={tipo==='llegada'?'Ej: llegada del proveedor, factura 123':tipo==='venta_manual'?'Ej: venta mayorista a Laura':tipo==='conteo'?'Ej: conteo de fin de mes':'Ej: cambio de talla'}/>
        </div>
        <div className={`stock-resumen ${excede.length>0?'err':''}`}>{resumen}</div>
      </div>
      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={guardar} disabled={!puede} style={{flex:2,opacity:puede?1:.5}}>{textoBtn}</button>
      </div>
    </div>
  </>;
}

/* ── HISTORIAL ── */
const TIPO_LABEL = {llegada:'Se sumó', venta_bot:'Vendió el bot', venta_manual:'Descuento manual', conteo:'Conteo', devolucion:'Devolución', ajuste:'Ajuste'};
const CHIP_LABEL = {llegada:'Sumas', venta_bot:'Bot', venta_manual:'Manuales', conteo:'Conteos', devolucion:'Devoluciones'};
function HistorialView({productos, filtro, setFiltro}){
  const [rows,setRows] = useState(null);
  const [tipo,setTipo] = useState('todos');
  const [err,setErr] = useState('');
  useEffect(()=>{ DB.cargarMovimientos().then(setRows).catch(e=>setErr(e.message)); },[]);
  if(err) return <div className="empty"><p>No se pudo cargar el historial: {err}</p></div>;
  if(!rows) return <div className="loading-page"><div className="spinner"/></div>;
  const nombre = id => (productos.find(p=>p.id===id)||{}).nombre;
  const lista = rows.filter(r=>(filtro==='todos'||r.producto_id===filtro)&&(tipo==='todos'||r.tipo===tipo));
  const grupos = [];
  lista.forEach(r=>{
    const k = r.producto_id+'|'+r.tipo+'|'+r.created_at.slice(0,19)+'|'+r.nota;
    let g = grupos.find(x=>x.k===k);
    if(!g){ g = {k, r, items:[]}; grupos.push(g); }
    g.items.push(r);
  });
  let diaPrev = '';
  const ids = [...new Set(rows.map(r=>r.producto_id))];
  return <>
    <div className="hist-filtros">
      <select value={filtro} onChange={e=>setFiltro(e.target.value)}>
        <option value="todos">Todos los productos</option>
        {ids.map(id=><option key={id} value={id}>{nombre(id)||(rows.find(r=>r.producto_id===id)||{}).producto_nombre||id}</option>)}
      </select>
      {['todos','llegada','venta_bot','venta_manual','conteo','devolucion'].map(t=>(
        <button key={t} className={`chip ${tipo===t?'on':''}`} onClick={()=>setTipo(t)}>{t==='todos'?'Todo':CHIP_LABEL[t]}</button>
      ))}
    </div>
    <div className="hist-list">
      {grupos.length===0 && <div className="empty"><p>Todavía no hay movimientos{filtro!=='todos'||tipo!=='todos'?' con ese filtro':''}.</p></div>}
      {grupos.map(g=>{
        const d = new Date(g.r.created_at);
        const dia = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
        const cab = dia!==diaPrev ? <div className="hist-dia" key={'d'+g.k}>{dia}</div> : null;
        diaPrev = dia;
        const items = [...g.items].sort((a,b)=>cmpTalla(a.talla,b.talla));
        return <React.Fragment key={g.k}>{cab}
          <div className="hist-item">
            <div className="hist-top">
              <div className="hist-prod">{nombre(g.r.producto_id)||g.r.producto_nombre||g.r.producto_id}</div>
              <span className={`hist-tipo ${g.r.tipo}`}>{TIPO_LABEL[g.r.tipo]||g.r.tipo}</span>
            </div>
            <div className="hist-tallas">
              {items.map(it=><span key={it.id} className={`hist-t ${it.delta>0?'mas':'menos'}`}>T{it.talla}: {it.delta>0?'+':''}{it.delta} <span style={{color:'var(--night-3)',fontWeight:500}}>(quedan {it.stock_despues})</span></span>)}
            </div>
            <div className="hist-meta">{d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}{g.r.nota?' · '+g.r.nota:''}</div>
          </div>
        </React.Fragment>;
      })}
    </div>
  </>;
}

/* ── PEDIDOS ── */
const ESTADO_LABEL = {
  preguntando:'Preguntando',
  cuenta_enviada:'Cuenta enviada',
  comprobante_recibido:'Comprobante recibido',
  pendiente_confirmacion_humana:'Esperando confirmación',
  confirmado:'Confirmado',
  pidiendo_datos_envio:'Pidiendo datos de envío',
  listo_para_enviar:'Listo para enviar',
  rechazado:'Rechazado',
  cancelado:'Cancelado',
};

function fechaAmable(iso){
  if(!iso) return '';
  const d = new Date(iso), hoy = new Date(), ayer = new Date(hoy.getTime()-864e5);
  const hora = d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===hoy.toDateString()) return 'Hoy, '+hora;
  if(d.toDateString()===ayer.toDateString()) return 'Ayer, '+hora;
  return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+', '+hora;
}
/* cobro-envio-app */
const envioDeuda = f => !!f && f.envio_pagado!==true && Number(f.envio_valor)!==0 && f.envio_valor!==null && f.envio_valor!==undefined;
const envioTexto = f => Number(f.envio_valor)===-1 ? 'El valor del envío está por confirmar' : ('Falta pagar el '+(Number(f.envio_valor)===7000?'domicilio':'envío')+': $'+Number(f.envio_valor).toLocaleString('es-CO'));
function agruparPedidos(rows){
  /* Un paquete = una persona + una dirección: los jeans que son de la misma clienta, misma dirección y mismo estado salen en UNA sola tarjeta (así no se empaca uno y se olvida el otro). */
  const g = {};
  const norm = x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  /* OJO: el estado empacado NO va en la llave. Si una clienta pagó 2 jeans y uno ya se marcó empacado, el otro debe seguir en la MISMA tarjeta (antes salía como un pedido aparte de 1 solo jean y se olvidaba el otro). */
  rows.forEach(r=>{ const k = [r.cliente_telefono||r.grupo_id||r.id, norm(r.envio_direccion), r.estado].join('|'); (g[k] = g[k] || []).push(r); });
  return Object.values(g).map(fs=>{ const base = fs.slice().sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))[0]; return { id: fs.map(f=>f.id).join(','), filas: fs, base }; });
}

function pdfDesdeB64(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:'application/pdf'}); }
function imprimirPdf(blob){
  const url = URL.createObjectURL(blob);
  const f = document.createElement('iframe'); f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0'; f.src = url;
  f.onload = ()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.open(url,'_blank'); } setTimeout(()=>{ try{ f.remove(); }catch(e){} }, 120000); };
  document.body.appendChild(f);
}
async function compartirPdf(blob){

}

      if(!d || !d.ok || !d.pdf) throw new Error((d && (d.error || (d.fallas||[]).join('; '))) || 'sin PDF');
      const blob = pdfDesdeB64(d.pdf);
      setGuias({...(extra||{}), paso:'listo', blob, paginas:d.paginas, faltan:d.faltan||[]});
      setPedidos(await DB.cargarPedidos());
      return blob;
    }catch(e){ setGuias({...(extra||{}), paso:'error', error:'Las guías se compraron, pero no se pudo armar el PDF: '+(e.message||e)+'. Toca "Imprimir guía" en cada pedido en un minuto.'}); }
  }
  /* cobro-envio-app (11-nov, pedido de la usuaria y la jefa): el envio se cobra DESPUES de empacar y revisar todo.
     La jefa toca "Cobrar envíos": se cotiza en Skydropx (gratis), se cobra el siguiente multiplo de $2.000 por encima del valor real
     (8.713 → 10.000; 10.000 → 12.000), los envios de mas de $15.000 reales salen en rojo y SIN marcar. Al confirmar: se guarda
     envio_valor en el pedido (el bot ya sabe recibir el comprobante del envio y marcarlo pagado) y el mensaje sale por nf_salientes
     (texto normal si la clienta escribio en las ultimas 24 h; si no, plantilla de Meta 'nf_cobro_envio'). */
  const COBRO_CARO = 15000;
  const valorCobro = precio => Math.floor(Number(precio) / 2000) * 2000 + 2000;
  const esParaCobro = g => { const f = g.filas[0]||{}; return g.filas.every(x=>x.estado==='listo_para_enviar' && x.empacado && !x.nota_jefa && new Date(x.created_at).getTime() >= SKY_DESDE && !x.skydropx_compra && !(Number(x.envio_valor) > 0) && x.envio_pagado!==true) && f.envio_direccion && !/^Recoge en tienda/i.test(f.envio_direccion) && !/monter[ií]a/i.test(f.envio_ciudad||''); };
  const resumenItems = g => g.filas.map(f=>{ const p = productos.find(x=>x.id===f.producto_id); return (p ? p.nombre.trim() : 'Jean') + ' talla ' + f.talla + (Number(f.cantidad)>1 ? ' x' + f.cantidad : ''); }).join(', ');
  async function cotizarCobro(){
    if(cobro.paso==='cotizando' || cobro.paso==='enviando') return;
    const lista = empacados.filter(esParaCobro);
    if(!lista.length){ toast('No hay pedidos empacados de envío nacional sin cobro de envío'); return; }
    setCobro({paso:'cotizando'});
    try{
      const d = await invocar({accion:'cotizar_guias', ids: lista.flatMap(x=>x.filas.map(f=>f.id))});
      const sel = {}; (d.resultados||[]).forEach(r=>{ if(r.ok && r.precio<=COBRO_CARO) sel[r.clave]=true; });
      setCobro({paso:'cotizado', cot:d, sel, grupos:lista});
    }catch(e){ setCobro({paso:'error', error:'No se pudo cotizar: '+(e.message||e)}); }
  }
  async function enviarCobros(){
    const cot = cobro.cot; if(!cot) return;
    const sel = cobro.sel || {}; const oks = cot.resultados.filter(r=>r.ok && sel[r.clave]);
    if(!oks.length){ toast('Marca al menos una clienta'); return; }
    if(!confirm('¿Enviar el cobro del envío a '+oks.length+' clienta(s)?\n\n'+oks.map(r=>'• '+r.nombre+': $'+valorCobro(r.precio).toLocaleString('es-CO')).join('\n')+'\n\nLes llega por WhatsApp con los datos de Nequi para que paguen.')) return;
    setCobro(c=>({...c, paso:'enviando'}));
    const res = []; const salientes = [];
    for(const r of oks){
      const g = (cobro.grupos||[]).find(x=>x.filas.some(f=>(r.ids||[]).includes(f.id)));
      const f = (g && g.filas[0]) || {};
      const valor = valorCobro(r.precio); const vtxt = valor.toLocaleString('es-CO');
      const nombre = String(f.envio_nombre||'').trim().split(/\s+/)[0] || 'hola';
      const items = g ? resumenItems(g) : 'tu pedido';
      const ciudad = String(f.envio_ciudad||'').trim() || String(r.ciudad||'');
      const texto = 'Hola '+nombre+' 💕 tu pedido de Nova Floe ya está empacado y listo: '+items+'.\n\nEl envío a '+ciudad+' cuesta *$'+vtxt+'*. Para despacharlo, transfiere a:\n\nNequi o llave Bre-B: 3012582216\nTitular: Fiorella Aguirre\nValor: $'+vtxt+'\n\nY envíame por aquí la foto del comprobante. ¡Gracias!';
      try{
        const ahora = new Date().toISOString();
        const u = await sb.from('nf_pedidos').update({envio_valor:valor, envio_pagado:false, envio_costo_real:r.precio, envio_cobro_at:ahora}).in('id', r.ids); if(u.error) throw u.error;
        const ins = await sb.from('nf_salientes').insert({telefono:f.cliente_telefono, texto, autor:'cobro_envio', plantilla:{name:'nf_cobro_envio', lang:'es', params:[nombre, items, ciudad, vtxt]}}).select('id').single();
        if(ins.error){ await sb.from('nf_pedidos').update({envio_valor:null, envio_costo_real:null, envio_cobro_at:null}).in('id', r.ids); throw ins.error; }
        salientes.push({id:ins.data.id, nombre:r.nombre, valor, ids:r.ids});
      }catch(e){ res.push({nombre:r.nombre, ok:false, error:String(e.message||e)}); }
    }
    for(let i=0;i<25 && salientes.some(s=>!s.estado);i++){
      await new Promise(rr=>setTimeout(rr,1500));
      const q = await sb.from('nf_salientes').select('id,estado,error').in('id', salientes.map(s=>s.id));
      (q.data||[]).forEach(x=>{ const s = salientes.find(y=>y.id===x.id); if(s && (x.estado==='enviado' || x.estado==='error')){ s.estado = x.estado; s.error = x.error; } });
    }
    /* cobro-no-enviado-se-revierte: si el mensaje no salio (error, o el computador del bot no lo tomo), el pedido vuelve a "sin cobrar"
       para que no quede como cobrado sin que la clienta se entere. Si el puente ya lo estaba enviando, no se toca. */
    for(const s of salientes){
      if(s.estado==='enviado') continue;
      if(!s.estado){ const c = await sb.from('nf_salientes').update({estado:'error', error:'cancelado: el computador del bot no respondió a tiempo'}).eq('id', s.id).eq('estado','pendiente').select('id'); if(!(c.data && c.data.length)) { s.estado = 'en_curso'; continue; } s.estado = 'error'; s.error = 'el computador del bot no respondió; no se envió'; }
      await sb.from('nf_pedidos').update({envio_valor:null, envio_costo_real:null, envio_cobro_at:null}).in('id', s.ids);
      s.error = (s.error||'no se envió') + ' (el pedido quedó otra vez sin cobrar)';
    }
    salientes.forEach(s=>res.push({nombre:s.nombre, ok:s.estado==='enviado', valor:s.valor, error: s.estado==='error' ? s.error : (s.estado==='en_curso' ? 'se está enviando; revisa en un minuto en "Falta pagar envío"' : (s.error||null))}));
    setCobro({paso:'listo', res});
    setPedidos(await DB.cargarPedidos());
  }

          {p==='pdf' && <div style={{marginTop:8}}>Guías compradas. Armando el archivo para imprimir…</div>}
          {(p==='listo' || p==='comprado') && <div style={{marginTop:8,fontSize:15}}>
            {(guias.res||[]).map((r,i)=><div key={i}>{r.ok?'✅':'⚠️'} {r.nombre}{r.ok ? (r.precio?' → $'+Number(r.precio).toLocaleString('es-CO'):' → guía lista') : ': '+r.error}</div>)}
            {(guias.faltan||[]).map((x,i)=><div key={'f'+i}>⏳ {x}</div>)}
            {guias.blob && <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
              <button className="pk-btn ok" style={{minWidth:0,flex:'none',padding:'12px 16px',fontSize:17}} onClick={()=>imprimirPdf(guias.blob)}>🖨️ Imprimir {guias.paginas} guía(s)</button>
              <button className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>compartirPdf(guias.blob)}>📤 Enviar a la impresora (celular)</button>
              <button className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button>
            </div>}
            {guias.blob && <div style={{fontSize:14,marginTop:8,color:'var(--night-3)'}}>Cada guía viene en tamaño 10×15 cm. Al imprimir: papel 4×6 (100×150 mm) y escala 100%.</div>}
            {!guias.blob && <button className="pk-btn sec" style={{marginTop:10,minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button>}
          </div>}
          {p==='error' && <div style={{marginTop:8,color:'#C0392B'}}>⚠️ {guias.error} <button className="pk-btn sec" style={{marginLeft:8,minWidth:0,flex:'none',padding:'8px 12px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button></div>}
        </div>); })()}
      {filtro==='historial' ? <HistorialEnvios productos={productos} zona={zona}/> :
      <div className="pedidos-list">
        {cargando
          ? <div className="loading-page"><div className="spinner"/></div>
          : lista.length===0
            ? <div className="empty"><p style={{fontSize:18}}>{vacio}</p></div>
            : lista.map(g=><PedidoEmpaque key={g.id} g={g} productos={productos} onMarcar={marcar} onRevisado={revisado} onEnvioPagado={envioPagado} onQuitarAviso={quitarAviso} puedeSky={!cfgGuias.activa && esParaSky(g)} subiendoSky={subiendoSky} onSky={()=>subirSky(g)} onReimprimir={reimprimir}/>)
        }
      </div>}
    </div>
  );
}

/* historial-envios (12-nov, pedido de la jefa): TODOS los pedidos empacados desde el inicio, para revisar envíos anteriores
   (dirección, qué llevaba, guía, envío cobrado). Solo lectura. Carga de a 300 desde la base (no solo los 14 días de Pedidos vendidos). */
function HistorialEnvios({productos, zona}){
  const [filas, setFilas] = useState(null);
  const [hayMas, setHayMas] = useState(false);
  const [busca, setBusca] = useState('');
  const [cargandoMas, setCargandoMas] = useState(false);
  const POR = 300;
  async function cargar(desde){
    const {data, error} = await sb.from('nf_pedidos').select('*').eq('empacado', true).not('cliente_telefono','like','573990000%').order('created_at',{ascending:false}).range(desde, desde+POR-1);
    if(error){ toast('Error: '+error.message); return []; }
    setHayMas((data||[]).length===POR); return data||[];
  }
  useEffect(()=>{ cargar(0).then(setFilas); },[]);
  async function masAntiguos(){ setCargandoMas(true); const d = await cargar((filas||[]).length); setFilas(f=>[...(f||[]), ...d]); setCargandoMas(false); }
  if(filas===null) return <div className="loading-page"><div className="spinner"/></div>;
  const esMont = p => /monter[ií]a/i.test(p.envio_ciudad||'') || /^Recoge en tienda/i.test(p.envio_direccion||'');
  const enZona = p => zona==='todos' || (zona==='monteria' ? esMont(p) : !esMont(p));
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const q = norm(busca.trim()); const qd = busca.replace(/\D/g,'');
  const nomProd = (id, guardado) => { const p = productos.find(x=>x.id===id); return p ? p.nombre.trim() : (guardado ? guardado+' (ya no está en el inventario)' : 'Producto (ya no está en el inventario)'); };
  const coincide = p => !q || [p.envio_nombre, p.cliente_nombre, p.envio_ciudad, p.envio_direccion, p.skydropx_guia, nomProd(p.producto_id, p.producto_nombre)].some(v=>norm(v).includes(q)) || (qd.length>=4 && [p.envio_telefono, p.envio_cedula, p.cliente_telefono].some(v=>String(v||'').replace(/\D/g,'').includes(qd)));
  const grupos = agruparPedidos(filas.filter(p=>enZona(p) && coincide(p))).sort((a,b)=>new Date(b.base.created_at)-new Date(a.base.created_at));
  const diaDe = iso => { const s = new Date(iso).toLocaleDateString('es-CO',{timeZone:'America/Bogota', weekday:'long', day:'numeric', month:'long', year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); };
  let diaPrev = '';
  return (
    <div className="pedidos-list">
      <div className="pk-nota" style={{background:'#F7F3F5'}}>📚 <b>Historial de envíos:</b> todos los pedidos empacados desde el inicio (solo para consultar). Busca por nombre, teléfono, cédula, ciudad, dirección, jean o número de guía.</div>
      <input className="ch-buscar" type="search" value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar: nombre, teléfono, cédula, ciudad, guía…"/>
      <div style={{fontSize:15,color:'var(--night-2)'}}><b>{grupos.length} envío(s)</b>{busca.trim() ? ' encontrados' : ''} · {zona==='afuera' ? 'solo 🚚 Envío nacional' : zona==='monteria' ? 'solo 🏠 Montería' : 'todos (nacional y Montería)'}{zona!=='todos' ? <span style={{color:'var(--night-3)'}}> — para ver todos toca "Todos" arriba</span> : null}{hayMas ? ' · hay más antiguos abajo' : ''}</div>
      {grupos.length===0 && <div className="empty"><p style={{fontSize:18}}>No hay envíos que coincidan.</p></div>}
      {grupos.map(g=>{
        const b = g.base; const dia = diaDe(b.created_at); const sep = dia!==diaPrev ? <div key={'d'+g.id} className="ch-dia" style={{alignSelf:'flex-start',fontWeight:700,fontSize:15,textTransform:'none',color:'var(--night-2)'}}>{dia}</div> : null; diaPrev = dia;
        const recoge = /^Recoge en tienda/i.test(b.envio_direccion||'');
        const total = g.filas.reduce((s,f)=>s+(Number(f.precio_total)||0),0);
        const conGuia = g.filas.find(f=>f.skydropx_guia);
        const env = g.filas.find(f=>Number(f.envio_valor)>0);
        return <React.Fragment key={g.id}>{sep}
          <div className="pk-card hecho" style={{opacity:1}}>
            <div className="pk-top"><div className="pk-nombre">{b.envio_nombre || b.cliente_nombre || 'Clienta'}</div><div className="pk-fecha" style={{fontWeight:700,color:'var(--night-2)',textAlign:'right'}}>{(()=>{ const d = new Date(b.created_at); const f = d.toLocaleDateString('es-CO',{timeZone:'America/Bogota', weekday:'short', day:'numeric', month:'short'}).replace(/\./g,''); return f.charAt(0).toUpperCase()+f.slice(1)+' · '+d.toLocaleTimeString('es-CO',{timeZone:'America/Bogota',hour:'numeric',minute:'2-digit'}); })()}</div></div>
            <div className="pk-items">{g.filas.map(f=><div className="pk-item" key={f.id}><b>{nomProd(f.producto_id, f.producto_nombre)}</b> · Talla <b>{f.talla}</b> · <b>{f.cantidad}</b> {Number(f.cantidad)===1?'unidad':'unidades'}</div>)}</div>
            <div className="pk-total">Total del pedido: {fmt(total)}</div>
            {recoge ? <div className="pk-envio"><div className="t">🏬 Recogió en la tienda</div>{b.envio_telefono && <div className="f"><span>Teléfono</span><span>{b.envio_telefono}</span></div>}</div> :
            <div className="pk-envio">
              <div className="t">Datos de envío</div>
              <div className="f"><span>Nombre</span><span>{b.envio_nombre}</span></div>
              <div className="f"><span>Cédula</span><span>{b.envio_cedula}</span></div>
              <div className="f"><span>Teléfono</span><span>{b.envio_telefono}</span></div>
              <div className="f"><span>Dirección</span><span>{b.envio_direccion}</span></div>
              <div className="f"><span>Ciudad</span><span>{b.envio_ciudad}</span></div>
              {b.envio_email && <div className="f"><span>Correo</span><span>{b.envio_email}</span></div>}
            </div>}
            {conGuia && <div className="pk-falta" style={{marginTop:10,background:'#E8F3EC',color:'#2F6B4C'}}>🧾 Guía {conGuia.skydropx_transportadora ? conGuia.skydropx_transportadora.charAt(0).toUpperCase()+conGuia.skydropx_transportadora.slice(1) : ''} N.º <b>{conGuia.skydropx_guia}</b>{conGuia.skydropx_costo ? ' · costó $'+Number(conGuia.skydropx_costo).toLocaleString('es-CO') : ''}</div>}
            {env && <div className="pk-falta" style={{marginTop:10,background:'#F1EEF6',color:'#5B4B73'}}>💬 Envío cobrado: ${Number(env.envio_valor).toLocaleString('es-CO')} · {env.envio_pagado ? 'pagado ✓' : 'sin pagar'}</div>}
            {g.filas.some(f=>f.skydropx_compra==='contraentrega') && <div className="pk-falta" style={{marginTop:10,background:'#F1EEF6',color:'#5B4B73'}}>📦 Fue contra entrega</div>}
            {g.filas.some(f=>f.nota_jefa) && <div className="pk-falta" style={{marginTop:10}}>⏸ Aviso: {(g.filas.find(f=>f.nota_jefa)||{}).nota_jefa}</div>}
          </div></React.Fragment>;
      })}
      {hayMas && <button className="pk-btn sec" style={{flex:'none'}} disabled={cargandoMas} onClick={masAntiguos}>{cargandoMas ? 'Cargando…' : 'Ver envíos más antiguos'}</button>}
    </div>
  );
}

/* ── CHATS ── (solo lectura: ver las conversaciones del bot y detectar clientas que quedaron sin atender) */
const CIERRE_CHAT = /^\s*(gracias|muchas gracias|ok|okay|listo|vale|perfecto|bueno|dale|👍|🙏|❤️|😊)[\s!.]*$/i;
const hace = iso => { const m = Math.round((Date.now()-new Date(iso).getTime())/60000); if(m<1) return 'ahora'; if(m<60) return m+' min'; const h = Math.floor(m/60); if(h<24) return h+' h'; return Math.floor(h/24)+' d'; };
function numeroReal(c){
  const n = String(c.telefono_real||'').replace(/\D/g,'') || String(c.telefono||'').replace(/@.*$/,'').replace(/\D/g,'');
  return /^57\d{10}$/.test(n) ? n : null;
}
function telBonito(n){ return n ? '+57 '+n.slice(2,5)+' '+n.slice(5,8)+' '+n.slice(8) : null; }
function nombreChat(c){ return c.nombre || telBonito(numeroReal(c)) || 'Clienta (número oculto)'; }
function limpiarPreview(t){
  const s = String(t||'');
  const m = s.match(/^\[El cliente esta respondiendo[^\]]*\]\s*([\s\S]*)$/);
  if(m) return m[1] || '↩ Respondió a un mensaje';
  if(/^\[El cliente esta respondiendo/.test(s)) return '↩ Respondió a un mensaje';
  return s.replace(/\s+/g,' ');
}
function etiquetasChat(c){
  const t = [];
  const min = (Date.now()-new Date(c.ultimo_at).getTime())/60000;
  const texto = limpiarPreview(c.ultimo_texto);
  if(c.ultimo_rol==='user' && min>=3 && !c.con_asesora && !CIERRE_CHAT.test(texto)) t.push({k:'rojo', txt:'Sin respuesta · hace '+hace(c.ultimo_at)});
  if(c.pidio_cita) t.push({k:'azul', txt:'Cita: derivada a la asesora'}); else if(c.con_asesora) t.push({k:'azul', txt:'Derivada a la asesora'}); /* derivada-informativa */
  if(c.falta_datos) t.push({k:'ambar', txt:'Pagó y faltan datos de envío o correo'});
  if(c.por_revisar) t.push({k:'ambar', txt:'Pago por revisar'});
  if(c.quiso_comprar && !c.tiene_pedido && min>=20) t.push({k:'ambar', txt:'Quería comprar y no quedó pedido'});
  return t;
}
function vistosGet(){ try{ return JSON.parse(localStorage.getItem('nf_chats_vistos')||'{}'); }catch(e){ return {}; } }
function vistosSet(o){ try{ localStorage.setItem('nf_chats_vistos', JSON.stringify(o)); }catch(e){} }
function esPendiente(c, vistos){ return etiquetasChat(c).some(t=>t.k!=='azul') && vistos[c.telefono]!==c.ultimo_at; }
function diaLabel(iso){
  const d = new Date(iso), hoy = new Date(), ayer = new Date(hoy.getTime()-864e5);
  if(d.toDateString()===hoy.toDateString()) return 'Hoy';
  if(d.toDateString()===ayer.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
}
function partirMensaje(contenido){
  const m = String(contenido||'').match(/^\[El cliente esta respondiendo a este mensaje que le enviaste:\s*"([\s\S]*?)"\]\s*([\s\S]*)$/);
  return m ? {cita:m[1], texto:m[2]} : {cita:null, texto:String(contenido||'')};
}

const ESTADO_PEDIDO = {cuenta_enviada:['Esperando el pago','ambar'], pidiendo_datos_envio:['Pagó · faltan datos de envío','rojo'], listo_para_enviar:['Pagado · listo para enviar','verde'], cancelado:['Cancelado',''], reemplazado:['Reemplazado','']};
function PedidoEnChat({tel}){
  const [ps, setPs] = useState(null);
  async function pagarEnvio(g){ const ids = g.map(p=>p.id); const {error} = await sb.from('nf_pedidos').update({envio_pagado:true}).in('id',ids); if(error){ toast('No se pudo guardar: '+error.message); return; } setPs(prev=>(prev||[]).map(p=>ids.includes(p.id)?{...p,envio_pagado:true}:p)); toast('Listo, envío pagado'); }
  useEffect(()=>{
    let vivo = true;
    const cargar = ()=>DB.chatPedidos(tel).then(x=>{ if(vivo) setPs(x); }).catch(()=>{ if(vivo) setPs([]); });
    cargar(); const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 10000);
    return ()=>{ vivo=false; clearInterval(t); };
  },[tel]);
  const vivos = (ps||[]).filter(p=>p.estado!=='cancelado' && p.estado!=='reemplazado');
  if(!vivos.length) return null;
  const grupos = {}; vivos.forEach(p=>{ const k = p.grupo_id || p.id; (grupos[k] = grupos[k] || []).push(p); });
  return <div style={{padding:'10px 1.25rem 0'}}>{Object.values(grupos).map((g,i)=>{
    const p0 = g[0]; const [txt,k] = ESTADO_PEDIDO[p0.estado] || [p0.estado,''];
    const total = g.reduce((a,p)=>a+Number(p.precio_total||0),0);
    const campos = [['Nombre',p0.envio_nombre],['Cédula',p0.envio_cedula],['Teléfono',p0.envio_telefono],['Dirección',p0.envio_direccion],['Ciudad',p0.envio_ciudad],['Correo',p0.envio_email]];
    const faltan = campos.filter(x=>!x[1]).length;
    return <div key={i} style={{border:'1.5px solid var(--line,#EDD8E0)',borderRadius:14,padding:'10px 12px',marginBottom:8,background:'#fff'}}>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}><span className={'ch-tag '+k}>{txt}</span><b style={{fontSize:15}}>{g.map(p=>p.producto+' t'+p.talla+(p.cantidad>1?' x'+p.cantidad:'')).join(' + ')} · {'$'+total.toLocaleString('es-CO')}</b></div>
      {g.some(p=>p.nota_jefa) && <div style={{marginTop:8,fontSize:14,fontWeight:700,color:'#C0392B'}}>⏸ {(g.find(p=>p.nota_jefa)||{}).nota_jefa}</div>}
      {g.some(envioDeuda) && <div style={{marginTop:8,fontSize:14,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><b style={{color:'var(--red,#b3261e)'}}>{envioTexto(g.find(envioDeuda))}</b><button className="pk-btn ok" style={{minWidth:0,flex:'none',padding:'8px 14px',fontSize:15}} onClick={()=>pagarEnvio(g)}>Envío pagado</button></div>}
      {!g.some(envioDeuda) && g.some(p=>p.envio_pagado===true && Number(p.envio_valor)>0) && <div style={{marginTop:8,fontSize:14,color:'var(--green,#3D7A5A)'}}><b>Envío pagado ✓</b></div>}
      {(p0.estado==='pidiendo_datos_envio' || p0.estado==='listo_para_enviar') && <div style={{marginTop:8,fontSize:14,lineHeight:1.5}}>
        <div style={{color:'var(--muted,#7a6670)',marginBottom:2}}>{faltan===campos.length ? 'El bot ya le pidió los datos y ella todavía no los ha mandado.' : (faltan ? 'Mandó una parte de los datos:' : 'Datos de envío completos:')}</div>
        {campos.map(([n,v])=><div key={n}><span style={{color:'var(--muted,#7a6670)'}}>{n}: </span>{v ? <b>{v}</b> : <span style={{color:'var(--red,#b3261e)'}}>falta</span>}</div>)}
      </div>}
    </div>; })}</div>;
}
function ChatDetalle({c, onBack, atendido, onAtendido}){
  const [msgs, setMsgs] = useState(null);
  const finRef = useRef(null);
  const primera = useRef(true);
  async function cargar(){
    try{ setMsgs(await DB.chatMensajes(c.telefono)); }
    catch(e){ toast('Error: '+e.message); setMsgs(prev=>prev||[]); }
  }
  useEffect(()=>{
    cargar();
    const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 10000);
    return ()=>clearInterval(t);
  },[c.telefono]);
  useEffect(()=>{ if(msgs && msgs.length && primera.current && finRef.current){ primera.current = false; finRef.current.scrollIntoView(); } },[msgs]);
  const num = numeroReal(c);
  const tags = etiquetasChat(c);
  let diaPrev = '';
  /* escribir-desde-app (10-nov): la jefa escribe aqui → nf_salientes → el puente lo envia por WhatsApp.
     Al escribir, el bot se calla con esta clienta (nf_humano) hasta que toque "Devolver al bot". Regla de WhatsApp: solo si ella escribio en las ultimas 24 h. */
  const idsHumano = [c.telefono, num].filter(Boolean);
  const [humano, setHumano] = useState(false);
  const [texto, setTexto] = useState('');
  const [envio, setEnvio] = useState(null); // {estado:'enviando'|'enviado'|'error', error}
  const revisarHumano = async ()=>{ try{ const {data} = await sb.from('nf_humano').select('id,hasta').in('id', idsHumano).gt('hasta', new Date().toISOString()); setHumano(!!(data && data.length)); }catch(e){} };
  useEffect(()=>{ revisarHumano(); const t = setInterval(()=>{ if(document.visibilityState==='visible') revisarHumano(); }, 15000); return ()=>clearInterval(t); },[c.telefono]);
  const ultUser = (msgs||[]).filter(m=>m.rol==='user').map(m=>new Date(m.created_at).getTime()).sort((a,b)=>b-a)[0] || 0;
  const ventanaAbierta = ultUser && (Date.now() - ultUser < 24*3600000 - 120000);
  async function enviar(){
    const t = texto.trim(); if(!t || (envio && envio.estado==='enviando')) return;
    if(!ventanaAbierta){ toast('Pasaron más de 24 h: WhatsApp no deja escribirle hasta que ella escriba'); return; }
    setEnvio({estado:'enviando'});
    try{
      const hasta = new Date(Date.now() + 365*864e5).toISOString(), ahora = new Date().toISOString();
      const h = await sb.from('nf_humano').upsert(idsHumano.map(id=>({id, hasta, actualizado:ahora})), {onConflict:'id'}); if(h.error) throw h.error;
      setHumano(true);
      const {data, error} = await sb.from('nf_salientes').insert({telefono:c.telefono, texto:t}).select('id').single(); if(error) throw error;
      setTexto('');
      for(let i=0;i<20;i++){
        await new Promise(r=>setTimeout(r,1500));
        const r = await sb.from('nf_salientes').select('estado,error').eq('id', data.id).single();
        if(r.data && r.data.estado==='enviado'){ setEnvio({estado:'enviado'}); cargar(); setTimeout(()=>{ if(finRef.current) finRef.current.scrollIntoView({behavior:'smooth'}); }, 400); return; }
        if(r.data && r.data.estado==='error'){ setEnvio({estado:'error', error:r.data.error||'no se pudo enviar'}); setTexto(t); return; }
      }
      setEnvio({estado:'error', error:'El computador del bot no respondió (¿está prendido?). El mensaje queda en cola y sale apenas se conecte.'});
    }catch(e){ setEnvio({estado:'error', error:String(e.message||e)}); setTexto(t); }
  }
  async function devolverAlBot(){
    try{ const {error} = await sb.from('nf_humano').update({hasta:new Date().toISOString(), actualizado:new Date().toISOString()}).in('id', idsHumano); if(error) throw error; setHumano(false); toast('Listo: el bot vuelve a responderle'); }
    catch(e){ toast('No se pudo: '+(e.message||e)); }
  }
  return (
    <div className="ch-det">
      <div className="ch-det-top">
        <button className="pk-btn sec ch-volver" onClick={onBack}>← Volver</button>
        <div className="ch-det-quien">
          <div className="ch-nombre">{nombreChat(c)}</div>
          {num && <div className="ch-hora">{telBonito(num)}</div>}
        </div>
      </div>
      {tags.length>0 && <div className="ch-tags" style={{padding:'10px 1.25rem 0'}}>{tags.map((t,i)=><span key={i} className={`ch-tag ${t.k}`}>{t.txt}</span>)}</div>}
      <div className="pk-acciones" style={{padding:'10px 1.25rem 0'}}>
        {num && <a className="pk-btn ok ch-wa" href={'https://wa.me/'+num} target="_blank" rel="noopener noreferrer">Escribirle por WhatsApp</a>}
        {!atendido && tags.length>0 && <button className="pk-btn sec" onClick={onAtendido}>Ya lo atendí</button>}
      </div>
      {humano && <div className="ch-humano">🙋 <b>La estás atendiendo tú:</b> el bot no le responde a esta clienta. <button className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'8px 14px',fontSize:16,marginLeft:6}} onClick={devolverAlBot}>🤖 Devolver al bot</button></div>}

                  <span className="ch-h">{m.rol==='assistant'?(m.autor==='asesora'?'Asesora · ':'Bot · '):''}{new Date(m.created_at).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}</span>
                </div></React.Fragment>;

      <div className="ch-escribir">
        {!ventanaAbierta && msgs!==null ? <div className="ch-24h">Pasaron más de 24 horas desde su último mensaje: WhatsApp no deja escribirle desde aquí hasta que ella vuelva a escribir. Puedes usar "Escribirle por WhatsApp".</div> : <>

        </>}
        {envio && envio.estado==='enviado' && <div className="ch-env ok">✓ Enviado. El bot ya no le responde a esta clienta hasta que toques "Devolver al bot".</div>}
        {envio && envio.estado==='error' && <div className="ch-env mal">⚠️ {envio.error}</div>}
      </div>
    </div>
  );
}

/* ── CITAS (10-nov-2026): las citas que agenda el bot (nf_citas) ── */
const hoyCO = (dias=0) => { const d = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'})); d.setDate(d.getDate()+dias); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function diaCita(f){
  if(!f) return 'Día por confirmar';
  if(f===hoyCO(0)) return 'HOY'; if(f===hoyCO(1)) return 'Mañana'; if(f===hoyCO(-1)) return 'Ayer';
  const d = new Date(f+'T12:00:00'); const s = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1);
}
function CitaCard({c, onMarcar}){
  const num = /^\d{10,13}@/.test(c.telefono||'') ? String(c.telefono).replace(/@.*/,'') : '';
  const local = num ? (num.startsWith('57') ? num.slice(2) : num) : '';
  const dia = diaCita(c.fecha); const esHoy = c.fecha===hoyCO(0); const pasada = c.fecha && c.fecha < hoyCO(0);
  const etiqueta = {vino:'✓ Vino', no_vino:'✗ No vino', cancelada:'Cancelada'}[c.estado];
  return (
    <div className={`pk-card ${esHoy && c.estado==='pendiente'?'nuevo':''} ${c.estado!=='pendiente'?'hecho':''}`}>
      <div className="pk-top">
        <div className="pk-nombre">{c.nombre || 'Clienta'}{esHoy && c.estado==='pendiente' && <span className="pk-nuevo">HOY</span>}</div>
        {etiqueta && <div className="pk-fecha"><b>{etiqueta}</b></div>}
      </div>
      <div className="pk-items">
        <div className="pk-item"><b>{dia}</b>{c.hora ? <> · <b>{c.hora}</b></> : ' · hora por confirmar'}</div>
      </div>
      <div className="pk-envio">
        <div className="f"><span>Para qué</span><span>{c.motivo || 'visita al punto físico'}</span></div>
        <div className="f"><span>Teléfono</span><span>{local ? <a href={'https://wa.me/'+num} target="_blank" rel="noopener">{local}</a> : 'Ver en Chats (WhatsApp no mostró el número)'}</span></div>
        {c.cuando_texto && <div className="f"><span>Lo que dijo</span><span style={{fontWeight:400}}>{c.cuando_texto}</span></div>}
      </div>
      {pasada && c.estado==='pendiente' && <div className="pk-falta" style={{marginTop:10}}>Esta cita ya pasó: márcala como "Vino" o "No vino".</div>}
      <div className="pk-acciones">
        {c.estado==='pendiente' ? <>
          <button className="pk-btn ok" onClick={()=>onMarcar(c,'vino')}>Vino</button>
          <button className="pk-btn sec" onClick={()=>onMarcar(c,'no_vino')}>No vino</button>
          <button className="pk-btn sec" onClick={()=>onMarcar(c,'cancelada')}>Cancelada</button>
        </> : <button className="pk-btn sec" onClick={()=>onMarcar(c,'pendiente')}>Volver a pendiente</button>}
      </div>
    </div>
  );
}
function CitasView({onPend}){
  const [citas, setCitas] = useState(null);
  const [verHist, setVerHist] = useState(false);
  const cargar = async ()=>{ try{ const {data, error} = await sb.from('nf_citas').select('*').order('fecha',{ascending:true, nullsFirst:false}).order('created_at',{ascending:true}).limit(400); if(!error) setCitas(data||[]); }catch(e){} };
  useEffect(()=>{ cargar(); const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 45000); return ()=>clearInterval(t); },[]);
  const marcar = async (c, estado)=>{ try{ await sb.from('nf_citas').update({estado, updated_at:new Date().toISOString()}).eq('id', c.id); toast(estado==='pendiente'?'Cita pendiente otra vez':'Cita marcada'); cargar(); }catch(e){ toast('No se pudo guardar'); } };
  if(!citas) return <div className="pedidos-list"><div className="pk-falta">Cargando citas…</div></div>;
  const pend = citas.filter(c=>c.estado==='pendiente');
  const hoy = hoyCO(0), man = hoyCO(1);
  const grupos = [
    ['Ya pasaron (márcalas)', pend.filter(c=>c.fecha && c.fecha<hoy)],
    ['Hoy', pend.filter(c=>c.fecha===hoy)],
    ['Mañana', pend.filter(c=>c.fecha===man)],
    ['Próximas', pend.filter(c=>c.fecha && c.fecha>man)],
    ['Día por confirmar', pend.filter(c=>!c.fecha)]
  ].filter(g=>g[1].length);
  const hist = citas.filter(c=>c.estado!=='pendiente').sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
  return (
    <div className="pedidos-list">
      <div className="pk-falta" style={{background:'#F7F3F5',color:'var(--night-2)'}}>Aquí salen las citas que agenda el bot: quién viene, qué día, a qué hora y su número. Punto físico: Cra 19W #15-22, Vallejo · 10 a 12 y 3 a 6.</div>
      {!grupos.length && <div className="pk-falta">No hay citas pendientes.</div>}
      {grupos.map(([t, l])=> <React.Fragment key={t}><div className="pk-envio" style={{background:'transparent',padding:'6px 2px 0'}}><div className="t">{t} ({l.length})</div></div>{l.map(c=> <CitaCard key={c.id} c={c} onMarcar={marcar}/>)}</React.Fragment>)}
      {hist.length>0 && <button className="pk-btn sec" style={{flex:'none'}} onClick={()=>setVerHist(!verHist)}>{verHist?'Ocultar':'Ver'} citas anteriores ({hist.length})</button>}
      {verHist && hist.slice(0,60).map(c=> <CitaCard key={c.id} c={c} onMarcar={marcar}/>)}
    </div>
  );
}

function ChatsView({onPend}){
  const [chats, setChats] = useState(null);
  const [filtro, setFiltro] = useState('atender');
  const [abierto, setAbierto] = useState(null);
  const [vistos, setVistos] = useState(vistosGet());
  const [busca, setBusca] = useState('');
  const [largos, setLargos] = useState(null);
  const [cargandoLargos, setCargandoLargos] = useState(false);
  const largosAt = React.useRef(0);
  async function cargarLargos(){ if(cargandoLargos || Date.now()-largosAt.current < 60000) return; largosAt.current = Date.now(); setCargandoLargos(true); try{ setLargos(await DB.chatsResumen(24*30)); }catch(e){} setCargandoLargos(false); }
  async function cargar(){
    try{ setChats(await DB.chatsResumen(72)); }
    catch(e){ toast('Error: '+e.message); setChats(prev=>prev||[]); }
  }
  useEffect(()=>{
    cargar();
    const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 20000);
    const alVolver = ()=>{ if(document.visibilityState==='visible') cargar(); };
    document.addEventListener('visibilitychange', alVolver);
    return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange', alVolver); };
  },[]);
  useEffect(()=>{ if(chats && onPend) onPend(chats.filter(c=>esPendiente(c,vistos)).length); },[chats,vistos]);
  function atender(c){ const v = {...vistos, [c.telefono]: c.ultimo_at}; vistosSet(v); setVistos(v); toast('Listo, anotado como atendido'); }

  if(abierto){
    const actual = (chats||[]).find(x=>x.telefono===abierto.telefono) || abierto;
    return <ChatDetalle c={actual} onBack={()=>setAbierto(null)} atendido={vistos[actual.telefono]===actual.ultimo_at} onAtendido={()=>atender(actual)}/>;
  }
  const pend = (chats||[]).filter(c=>esPendiente(c,vistos));
  /* buscador-chats (10-nov): por nombre (sin importar tildes ni mayusculas) o por numero; al buscar mira hasta 30 dias atras */
  const _nz = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const qTxt = _nz(busca), qDig = String(busca||'').replace(/\D/g,'');
  const coincide = c => { if(!qTxt) return true; const nom = _nz(nombreChat(c)+' '+(c.nombre||'')); const dig = String(c.telefono||'').replace(/\D/g,'')+' '+String(c.telefono_real||'').replace(/\D/g,''); return (qTxt.length>=2 && qTxt.split(' ').every(w=>nom.includes(w))) || (qDig.length>=4 && dig.includes(qDig.startsWith('57')&&qDig.length>10 ? qDig.slice(2) : qDig)); };
  const baseBusqueda = (largos && largos.length ? largos : (chats||[]));
  const lista = qTxt ? baseBusqueda.filter(coincide) : (filtro==='atender' ? pend : (chats||[]));
  return (
    <div>
      <div style={{padding:'12px 16px 0'}}>
        <input className="ch-buscar" type="search" value={busca} onChange={e=>{ setBusca(e.target.value); if(e.target.value.trim().length>=2) cargarLargos(); }} placeholder="Buscar chat por nombre o número…" style={{width:'100%',boxSizing:'border-box',fontSize:17,padding:'12px 14px',borderRadius:14,border:'2px solid var(--border)',fontFamily:'inherit',background:'var(--white)'}}/>
        {qTxt && <div style={{fontSize:14,color:'var(--night-3)',marginTop:6}}>{lista.length} {lista.length===1?'chat encontrado':'chats encontrados'} (últimos 30 días){cargandoLargos?' · buscando…':''} <button onClick={()=>setBusca('')} style={{marginLeft:8,border:'none',background:'none',color:'var(--blush-dd)',fontWeight:700,cursor:'pointer',fontFamily:'inherit',fontSize:14}}>Borrar búsqueda</button></div>}
      </div>
      <div className="pk-chips">
        <button className={`pk-chip ${filtro==='atender'?'on':''}`} onClick={()=>setFiltro('atender')}>Por atender ({pend.length})</button>
        <button className={`pk-chip ${filtro==='todos'?'on':''}`} onClick={()=>setFiltro('todos')}>Todos los chats ({(chats||[]).length})</button>
      </div>
      {filtro==='atender' && <div className="pk-nota">Aquí aparecen las clientas que escribieron y <b>no recibieron respuesta</b>, las que pidieron asesora, los pagos por revisar y las que querían comprar pero no quedó pedido (últimos 3 días). Toca un chat para leerlo.</div>}
      <div className="ch-list">
        {chats===null ? <div className="loading-page"><div className="spinner"/></div>
          : lista.length===0 ? <div className="empty"><p style={{fontSize:18}}>{qTxt ? (cargandoLargos ? 'Buscando…' : 'No encontré ningún chat con ese nombre o número en los últimos 30 días.') : filtro==='atender' ? 'Todo al día: no hay clientas esperando.' : 'Todavía no hay chats en los últimos 3 días.'}</p></div>
          : lista.map(c=>{
              const tags = etiquetasChat(c);
              const nombre = nombreChat(c);
              const pre = (c.ultimo_media ? '📷 Envió una foto' : limpiarPreview(c.ultimo_texto));
              return (
                <button key={c.telefono} className={`ch-row ${esPendiente(c,vistos)?'alerta':''}`} onClick={()=>setAbierto(c)}>
                  <div className="ch-av">{(nombre.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/g,'')[0]||'?').toUpperCase()}</div>
                  <div className="ch-main">
                    <div className="ch-top"><div className="ch-nombre">{nombre}</div><div className="ch-hora">hace {hace(c.ultimo_at)}</div></div>
                    <div className="ch-prev">{c.ultimo_rol==='assistant' ? 'Bot: ' : ''}{pre}</div>
                    {tags.length>0 && <div className="ch-tags">{tags.map((t,i)=><span key={i} className={`ch-tag ${t.k}`}>{t.txt}</span>)}</div>}
                  </div>
                </button>
              );
            })}
      </div>
    </div>
  );
}
