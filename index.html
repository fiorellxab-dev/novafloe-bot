        </> : <button className="pk-btn sec" onClick={()=>onMarcar(c,'pendiente')}>Volver a pendiente</button>}
      </div>
    </div>
  );
}
/* cuentas-bot (24-nov): cuánto cuesta el bot y cuánto vende. Claude = gasto real por día (lo sube gastos_bot.js desde el servidor
   cada 10 min, desde el 24-nov). Fijos (360dialog, servidor) se reparten por día. Ventas = pedidos pagados del bot (nf_pedidos). */
function CuentasView(){
  /* cuentas-desde-inicio (24-nov): rango "Desde el inicio" (18-oct, primer pedido del bot). Ventas y respuestas salen de las vistas
     nf_bot_ventas_dia / nf_bot_respuestas_dia (sin tope de 1000 filas). Claude antes del 24-nov = respuestas x costo medido por respuesta (≈). */
  const INICIO = '2026-10-18', MEDIDO_DESDE = '2026-11-24';
  const [rango, setRango] = useState('todo');
  const [d, setD] = useState(null);
  const hoyCol = ()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10);
  const sumarDias = (f,n)=>{ const x = new Date(f+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
  useEffect(()=>{ let vivo = true; (async()=>{
    const hoy = hoyCol();
    const desde0 = rango==='hoy' ? hoy : rango==='7' ? sumarDias(hoy,-6) : rango==='mes' ? hoy.slice(0,8)+'01' : INICIO; const desde = desde0 < INICIO ? INICIO : desde0;
    const [ga, fi, pa, cf, ve, re] = await Promise.all([
      sb.from('nf_bot_gastos_dia').select('*').order('fecha',{ascending:false}).limit(1000),
      sb.from('nf_bot_gastos_fijos').select('*').eq('activo',true),
      sb.from('nf_bot_pagos').select('*').order('fecha',{ascending:false}).limit(200),
      sb.from('nf_bot_config').select('*').eq('clave','tasa_cop'),
      sb.from('nf_bot_ventas_dia').select('*').gte('fecha',desde).lte('fecha',hoy).limit(1000),
      sb.from('nf_bot_respuestas_dia').select('*').gte('fecha',desde).lte('fecha',hoy).limit(1000),
    ]);
    if(vivo) setD({desde, hoy, gastos:ga.data||[], fijos:fi.data||[], pagos:pa.data||[], tasa:Number((cf.data&&cf.data[0]&&cf.data[0].valor)||0), ventas:ve.data||[], resps:re.data||[]});
  })().catch(()=>{}); return ()=>{ vivo = false; }; },[rango]);
  const usd = n=>'US$'+Number(n||0).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cop = n=>'$'+Math.round(Number(n||0)).toLocaleString('es-CO');
  const fechaBonita = f=>new Date(f+'T12:00:00Z').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
  if(!d) return <div style={{padding:'2rem 1.25rem',color:'#6B5B73'}}>Cargando cuentas…</div>;
  /* días del rango */
  const dias = []; for(let f=d.desde; f<=d.hoy; f=sumarDias(f,1)) dias.push(f);
  const porDia = {}; dias.forEach(f=>porDia[f]={claude:0, resp:0, ventas:0, pedidos:0, estimado:false});
  /* costo por respuesta medido (lo que de verdad cobra Claude); se usa para calcular los días de antes de medir */
  const medidos = d.gastos.filter(g=>Number(g.respuestas)>0);
  const costoResp = medidos.length ? medidos.reduce((s,g)=>s+Number(g.claude_usd),0) / medidos.reduce((s,g)=>s+Number(g.respuestas),0) : 0.0075;
  d.resps.forEach(r=>{ if(porDia[r.fecha]){ porDia[r.fecha].resp = Number(r.respuestas); if(r.fecha < MEDIDO_DESDE){ porDia[r.fecha].claude = Number(r.respuestas)*costoResp; porDia[r.fecha].estimado = true; } } });
  d.gastos.forEach(g=>{ if(porDia[g.fecha] && g.fecha >= MEDIDO_DESDE){ porDia[g.fecha].claude = Number(g.claude_usd); porDia[g.fecha].resp = Number(g.respuestas); porDia[g.fecha].estimado = false; } });
  d.ventas.forEach(v=>{ if(porDia[v.fecha]){ porDia[v.fecha].ventas = Number(v.ventas||0); porDia[v.fecha].pedidos = Number(v.pedidos||0); porDia[v.fecha].jeans = Number(v.unidades||0); } });
  const hayEstimado = dias.some(f=>porDia[f].estimado && porDia[f].claude>0);
  const diasTabla = [...dias].reverse().filter(f=>porDia[f].resp || porDia[f].ventas || f===d.hoy);
  const totalPagado = d.pagos.reduce((s,p)=>s+Number(p.usd||0),0);
  const fijos = d.fijos.map(x=>({...x, usd: dias.filter(f=>f>=x.desde).length * Number(x.usd_mes)/30}));
  const claude = dias.reduce((s,f)=>s+porDia[f].claude,0), resp = dias.reduce((s,f)=>s+porDia[f].resp,0);
  const totalUsd = claude + fijos.reduce((s,x)=>s+x.usd,0);
  const ventas = dias.reduce((s,f)=>s+porDia[f].ventas,0), nPed = dias.reduce((s,f)=>s+porDia[f].pedidos,0), nJeans = dias.reduce((s,f)=>s+(porDia[f].jeans||0),0);
  const totalCop = totalUsd * (d.tasa||0);
  const pct = ventas>0 && d.tasa ? totalCop/ventas*100 : null;
  return (
    <div className="cuentas">
      <div className="cu-rangos">
        {[['todo','Desde el inicio'],['mes','Este mes'],['7','Últimos 7 días'],['hoy','Hoy']].map(([k,t])=><button key={k} className={'cu-rango'+(rango===k?' on':'')} onClick={()=>setRango(k)}>{t}</button>)}
      </div>
      <div className="cu-cards">
        <div className="cu-card"><div className="cu-lbl">Costó el bot</div><div className="cu-num">{usd(totalUsd)}</div>{d.tasa>0 && <div className="cu-sub">≈ {cop(totalCop)} pesos</div>}</div>
        <div className="cu-card"><div className="cu-lbl">Vendió por el bot</div><div className="cu-num">{cop(ventas)}</div><div className="cu-sub">{nPed.toLocaleString('es-CO')} {nPed===1?'pedido pagado':'pedidos pagados'} · {nJeans.toLocaleString('es-CO')} jeans{rango==='todo'?' (desde el 18 de oct)':''}</div></div>
        <div className="cu-card verde"><div className="cu-lbl">El bot se lleva</div><div className="cu-num">{pct===null ? '—' : pct.toLocaleString('es-CO',{maximumFractionDigits:1})+'%'}</div><div className="cu-sub">de lo que vende</div></div>
      </div>
      <div className="cu-box">
        <div className="cu-tit">¿En qué se va?</div>
        <div className="cu-fila"><span>🤖 Claude (escribe las respuestas) · {resp.toLocaleString('es-CO')} respuestas</span><b>{hayEstimado?'≈ ':''}{usd(claude)}</b></div>
        {fijos.map(x=><div key={x.id} className="cu-fila"><span>{x.id==='servidor'?'🖥️':'💬'} {x.concepto} <small>({usd(x.usd_mes)} al mes, repartido por día)</small></span><b>{usd(x.usd)}</b></div>)}
        <div className="cu-fila"><span>📨 Mensajes de Meta <small>(contestar es gratis; solo cobra si el bot escribe primero)</small></span><b>≈ US$0</b></div>
        <div className="cu-fila total"><span>Total</span><b>{usd(totalUsd)}</b></div>
        {d.tasa>0 && <div className="cu-nota">Dólar a {cop(d.tasa)} (se actualiza solo cada día).</div>}
        {hayEstimado && <div className="cu-nota">≈ Antes del 24 de noviembre el bot no anotaba lo que gastaba en Claude: esos días se calculan con lo que cuesta cada respuesta hoy ({usd(costoResp*100)} cada 100 respuestas). Desde el 24 es el gasto real.</div>}
        <div className="cu-nota">360dialog empezó el 22 de noviembre (antes el bot no pagaba WhatsApp) y el servidor el 24. Aquí se cuenta lo que se ha usado; lo que ya se pagó por adelantado sale abajo en "Pagos hechos".</div>
      </div>
      <div className="cu-box">
        <div className="cu-tit">Día por día</div>
        <div className="cu-tabla">
          <div className="cu-tr cu-th"><span>Día</span><span>Respuestas</span><span>Claude</span><span>Ventas</span></div>
          {diasTabla.map(f=><div key={f} className="cu-tr"><span>{fechaBonita(f)}</span><span>{porDia[f].resp ? porDia[f].resp.toLocaleString('es-CO') : '—'}</span><span>{porDia[f].claude ? (porDia[f].estimado?'≈ ':'')+usd(porDia[f].claude) : '—'}</span><span>{porDia[f].ventas ? cop(porDia[f].ventas) : '—'}</span></div>)}
          {diasTabla.length < dias.length && <div className="cu-nota">Solo salen los días en que el bot atendió o vendió.</div>}
        </div>
      </div>
      <div className="cu-box">
        <div className="cu-tit">Pagos hechos (facturas)</div>
        {d.pagos.length===0 ? <div className="cu-nota">No hay pagos anotados.</div> : d.pagos.map(p=><div key={p.id} className="cu-fila"><span>{fechaBonita(p.fecha)} · {p.concepto}{p.nota && <small> — {p.nota}</small>}</span><b>{usd(p.usd)}</b></div>)}
        {d.pagos.length>0 && <div className="cu-fila total"><span>Total pagado en facturas</span><b>{usd(totalPagado)}{d.tasa>0 && <small style={{fontWeight:400}}> ≈ {cop(totalPagado*d.tasa)}</small>}</b></div>}
        <div className="cu-nota">Claude se paga aparte en la cuenta de Anthropic (recarga automática); si me mandas esas facturas, las agrego aquí.</div>
      </div>
    </div>
  );
}

/* citas-solo-proximas (25-nov): minutos del día (hora Colombia) en que termina la cita, leídos de c.hora ("4:00 p. m.", "10 a 12 m."); null si no se entiende */
function minutosCita(h){ const t = String(h||'').toLowerCase(); const ns = [...t.matchAll(/(\d{1,2})(?::(\d{2}))?/g)]; if(!ns.length) return null; const u = ns[ns.length-1]; let hh = Number(u[1]), mm = Number(u[2]||0); if(hh>23) return null;
  if(/p\.?\s*m/.test(t) && hh<12) hh += 12; return hh*60+mm; }
function citaYaPaso(c){ const m = minutosCita(c.hora); if(m===null) return false; const ahora = new Date(Date.now()-5*3600e3); return ahora.getUTCHours()*60+ahora.getUTCMinutes() > m+60; }
function CitasView({onPend}){
  const [citas, setCitas] = useState(null);
  const [verHist, setVerHist] = useState(false);
  const cargar = async ()=>{ try{ const {data, error} = await sb.from('nf_citas').select('*').order('fecha',{ascending:true, nullsFirst:false}).order('created_at',{ascending:true}).limit(400); if(!error) setCitas(data||[]); }catch(e){} };
  useEffect(()=>{ cargar(); const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 45000); return ()=>clearInterval(t); },[]);
  const marcar = async (c, estado)=>{ try{ await sb.from('nf_citas').update({estado, updated_at:new Date().toISOString()}).eq('id', c.id); toast(estado==='pendiente'?'Cita pendiente otra vez':'Cita marcada'); cargar(); }catch(e){ toast('No se pudo guardar'); } };
  if(!citas) return <div className="pedidos-list"><div className="pk-falta">Cargando citas…</div></div>;
  const pend = citas.filter(c=>c.estado==='pendiente');
  const hoy = hoyCO(0), man = hoyCO(1);
  const grupos = [
    /* citas-solo-proximas (25-nov): las de días pasados ya no se muestran */
    ['Hoy', pend.filter(c=>c.fecha===hoy && !citaYaPaso(c))], /* citas-solo-proximas: las de hoy cuya hora ya pasó (más 1 hora) tampoco salen */
    ['Mañana', pend.filter(c=>c.fecha===man)],
    ['Próximas', pend.filter(c=>c.fecha && c.fecha>man)],
    ['Día por confirmar', pend.filter(c=>!c.fecha && Date.now()-new Date(c.created_at).getTime() < 7*864e5)]
  ].filter(g=>g[1].length);
  const hist = citas.filter(c=>c.estado!=='pendiente').sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
  return (
    <div className="pedidos-list">
      <div className="pk-falta" style={{background:'#F7F3F5',color:'var(--night-2)'}}>Aquí salen las citas que agenda el bot: quién viene, qué día, a qué hora y su número. Punto físico: Cra 19W #15-22, Vallejo · 10 a 12 y 3 a 6.</div>
      {!grupos.length && <div className="pk-falta">No hay citas pendientes.</div>}
      {grupos.map(([t, l])=> <React.Fragment key={t}><div className="pk-envio" style={{background:'transparent',padding:'6px 2px 0'}}><div className="t">{t} ({l.length})</div></div>{l.map(c=> <CitaCard key={c.id} c={c} onMarcar={marcar}/>)}</React.Fragment>)}
    </div>
  );
}

function ChatsView({onPend}){
  const [chats, setChats] = useState(null);
  const [filtro, setFiltro] = useState('atender');
  const [abierto, setAbierto] = useState(()=>{ const x = window._nfAbrirChat || null; window._nfAbrirChat = null; return x; }); /* abrir-chat-desde-pedido */
  const [vistos, setVistos] = useState(vistosGet());
  const [busca, setBusca] = useState('');
  const [largos, setLargos] = useState(null);
  const [cargandoLargos, setCargandoLargos] = useState(false);
  const largosAt = React.useRef(0);
  async function cargarLargos(){ if(cargandoLargos || Date.now()-largosAt.current < 60000) return; largosAt.current = Date.now(); setCargandoLargos(true); try{ setLargos((await DB.chatsHistoricos()) /* historial-completo-chats */.filter(c=>!/^WB.57399/.test(String(c.telefono||'')))); }catch(e){} setCargandoLargos(false); }
  async function cargar(){
    try{ setChats((await DB.chatsResumen(72)).filter(c=>!/^WB.57399/.test(String(c.telefono||'')))); } /* sin-chats-prueba (23-nov): los chats de prueba de Claude (numeros 57399...) no se muestran */
    catch(e){ toast('Error: '+e.message); setChats(prev=>prev||[]); }
  }
  useEffect(()=>{
    cargar();
    const t = setInterval(()=>{ if(document.visibilityState==='visible') cargar(); }, 20000);
    const alVolver = ()=>{ if(document.visibilityState==='visible') cargar(); };
    document.addEventListener('visibilitychange', alVolver);
    return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange', alVolver); };
  },[]);
  useEffect(()=>{ if(chats && onPend) onPend(chats.filter(c=>esPendiente(c,vistos)).length); },[chats,vistos]);
  function atender(c){ const v = {...vistos, [c.telefono]: c.ultimo_at}; vistosSet(v); setVistos(v); toast('Listo, anotado como atendido'); }

  if(abierto){
    const actual = (chats||[]).find(x=>x.telefono===abierto.telefono) || abierto;
    return <ChatDetalle c={actual} onBack={()=>setAbierto(null)} atendido={vistos[actual.telefono]===actual.ultimo_at} onAtendido={()=>atender(actual)}/>;
  }
  const pend = (chats||[]).filter(c=>esPendiente(c,vistos));
  /* buscador-chats (10-nov): por nombre (sin importar tildes ni mayusculas) o por numero; al buscar mira hasta 30 dias atras */
  const _nz = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const qTxt = _nz(busca), qDig = String(busca||'').replace(/\D/g,'');
  const coincide = c => { if(!qTxt) return true; const nom = _nz(nombreChat(c)+' '+(c.nombre||'')); const dig = String(c.telefono||'').replace(/\D/g,'')+' '+String(c.telefono_real||'').replace(/\D/g,''); return (qTxt.length>=2 && qTxt.split(' ').every(w=>nom.includes(w))) || (qDig.length>=4 && dig.includes(qDig.startsWith('57')&&qDig.length>10 ? qDig.slice(2) : qDig)); };
  const baseBusqueda = (largos && largos.length ? largos : (chats||[]));
  const lista = qTxt ? baseBusqueda.filter(coincide) : (filtro==='atender' ? pend : filtro==='historial' ? (largos||[]) : (chats||[]));
  return (
    <div>
      <div style={{padding:'12px 16px 0'}}>
        <input className="ch-buscar" type="search" value={busca} onChange={e=>{ setBusca(e.target.value); if(e.target.value.trim().length>=2) cargarLargos(); }} placeholder="Buscar chat por nombre o número…" style={{width:'100%',boxSizing:'border-box',fontSize:17,padding:'12px 14px',borderRadius:14,border:'2px solid var(--border)',fontFamily:'inherit',background:'var(--white)'}}/>
        {qTxt && <div style={{fontSize:14,color:'var(--night-3)',marginTop:6}}>{lista.length} {lista.length===1?'chat encontrado':'chats encontrados'} (todo el historial){cargandoLargos?' · buscando…':''} <button onClick={()=>setBusca('')} style={{marginLeft:8,border:'none',background:'none',color:'var(--blush-dd)',fontWeight:700,cursor:'pointer',fontFamily:'inherit',fontSize:14}}>Borrar búsqueda</button></div>}
      </div>
      <div className="pk-chips">
        <button className={`pk-chip ${filtro==='atender'?'on':''}`} onClick={()=>setFiltro('atender')}>Por atender ({pend.length})</button>
        <button className={`pk-chip ${filtro==='todos'?'on':''}`} onClick={()=>setFiltro('todos')}>Últimos 3 días ({(chats||[]).length})</button>
        <button className={`pk-chip ${filtro==='historial'?'on':''}`} onClick={()=>{ setFiltro('historial'); cargarLargos(); }}>📚 Todo el historial{largos ? ' ('+largos.length+')' : ''}</button>
      </div>
      {filtro==='atender' && <div className="pk-nota">Aquí aparecen las clientas que escribieron y <b>no recibieron respuesta</b>, las que pidieron asesora, los pagos por revisar y las que querían comprar pero no quedó pedido (últimos 3 días). Toca un chat para leerlo.</div>}
      <div className="ch-list">
        {(chats===null || (filtro==='historial' && !largos && !qTxt)) ? <div className="loading-page"><div className="spinner"/></div>
          : lista.length===0 ? <div className="empty"><p style={{fontSize:18}}>{qTxt ? (cargandoLargos ? 'Buscando…' : 'No encontré ningún chat con ese nombre o número.') : filtro==='atender' ? 'Todo al día: no hay clientas esperando.' : 'Todavía no hay chats en los últimos 3 días.'}</p></div>
          : lista.map(c=>{
              const tags = etiquetasChat(c);
              const nombre = nombreChat(c);
              const pre = (c.ultimo_media ? '📷 Envió una foto' : limpiarPreview(c.ultimo_texto));
              return (
                <button key={c.telefono} className={`ch-row ${esPendiente(c,vistos)?'alerta':''}`} onClick={()=>setAbierto(c)}>
                  <div className="ch-av">{(nombre.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/g,'')[0]||'?').toUpperCase()}</div>
                  <div className="ch-main">
                    <div className="ch-top"><div className="ch-nombre">{nombre}{/^WB\./.test(String(c.telefono||'')) && <span title="Escribió por el chat web (novabot.fyi/chat), no por WhatsApp" style={{marginLeft:6,fontSize:11,fontWeight:700,color:'#121212',background:'#FDD3EC',borderRadius:8,padding:'1px 6px',verticalAlign:'middle'}}>🌐 Web</span>}</div><div className="ch-hora">hace {hace(c.ultimo_at)}</div></div>
                    <div className="ch-prev">{c.ultimo_rol==='assistant' ? 'Bot: ' : ''}{pre}</div>
                    {tags.length>0 && <div className="ch-tags">{tags.map((t,i)=><span key={i} className={`ch-tag ${t.k}`}>{t.txt}</span>)}</div>}
                  </div>
                </button>
              );
            })}
      </div>
    </div>
  );
}

    setGuardando(false);
  }
  async function copiar(){
    try{ await navigator.clipboard.writeText(MSG_LIVE); toast('Instrucciones copiadas ✓'); }

  function mover(i,dir){
    const j=i+dir; if(j<0||j>=orden.length) return;
    const n=[...orden]; [n[i],n[j]]=[n[j],n[i]]; cambiar({orden_live:n});

      </div>
      <div style={{background:'var(--white)',border:'1.5px solid var(--border)',borderRadius:'var(--r)',padding:'1rem 1.1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:12}}>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>{auto?'Confirmación automática de pagos: ACTIVADA':'Confirmación automática de pagos: apagada'}</div>

            {auto ? 'Si el comprobante es válido (monto exacto y referencia sin repetir), el bot da el pago por registrado y pide los datos de envío. Tú verificas después en el panel (Conciliar). Si algo no cuadra, te avisa por WhatsApp.' : 'Cada comprobante te llega por WhatsApp y tú respondes SI con el código.'}
          </div>
        </div>
        <button className={`btn btn-lg ${auto?'btn-danger-soft':'btn-primary'}`} disabled={guardando} onClick={()=>cambiar({autoconfirmar:!auto})}>

          <div style={{fontWeight:600,fontSize:16}}>{activo?'Modo Live ACTIVO':'Modo Live apagado'}</div>

            </button>

function Login({onLogin}){
  const [pwd, setPwd] = useState('');
  const [err, setErr] = useState('');
  function tryLogin(){
    if(pwd===PASS){ onLogin(); }
    else{ setErr('Contraseña incorrecta'); }
  }
  return (
    <div className="login-page">
      <div className="login-card">
        <img className="login-logo-img" src="logo-novafloe.png" alt="Nova Floe"/>
        <p className="login-sub">Ingresa tu contraseña para acceder al inventario</p>
        <label>Contraseña</label>
        <input
          type="password" placeholder="••••••••••"
          value={pwd} onChange={e=>setPwd(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&tryLogin()}
          autoFocus
        />
        {err && <div className="login-err">{err}</div>}
        <button className="btn-login" onClick={tryLogin}>Entrar</button>
      </div>
    </div>
  );
}

  useEffect(()=>{ const f = ()=>{ setView('chats'); window.scrollTo(0,0); }; window.addEventListener('nf-abrir-chat', f); return ()=>window.removeEventListener('nf-abrir-chat', f); },[]); /* abrir-chat-desde-pedido */
  const [chatsPend, setChatsPend] = useState(0);
  const [pedPend, setPedPend] = useState(0); /* aviso-pedidos */ const [pedAvisos, setPedAvisos] = useState(0); /* pedidos-simples */
  const [citasPend, setCitasPend] = useState(0); /* citas */
  useEffect(()=>{ let vivo = true; const f = async ()=>{ if(document.visibilityState!=='visible') return; try{ const {data} = await sb.from('nf_citas').select('fecha,hora').eq('estado','pendiente').gte('fecha', hoyCO(0)).lte('fecha', hoyCO(1)); /* citas-solo-proximas */ if(vivo) setCitasPend((data||[]).filter(c=>!(c.fecha===hoyCO(0) && citaYaPaso(c))).length); }catch(e){} }; f(); const t = setInterval(f, 60000); return ()=>{ vivo = false; clearInterval(t); }; },[]);
  const [alertaEnt, setAlertaEnt] = useState(null); /* alerta-entrega */
  /* quitar-alertas (12-nov): cada aviso rojo se puede quitar. Clientas esperando: se ocultan las que ya se quitaron; si aparece una NUEVA, el aviso vuelve solo con ella. Inventario/atención: se ocultan hasta que el texto cambie. Se recuerda en este dispositivo. */
  const [quitadas, setQuitadas] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('nf_alertas_quitadas')||'{}'); }catch(e){ return {}; } });
  const guardarQuitadas = q => { setQuitadas(q); try{ localStorage.setItem('nf_alertas_quitadas', JSON.stringify(q)); }catch(e){} };
  /* pestaña-avisos */ const avisosTexto = alertaEnt && alertaEnt.alerta_entrega && quitadas.ent!==alertaEnt.alerta_entrega ? alertaEnt.alerta_entrega : ''; const invPend = !!(alertaEnt && alertaEnt.alerta_inventario && quitadas.inv!==alertaEnt.alerta_inventario); const nAvisos = (avisosTexto ? partirAvisos(avisosTexto).filter(a=>!a.claves.some(c=>(quitadas.avisos||[]).includes(c))).length : 0) + (invPend?1:0) + pedAvisos; /* pedidos-simples */
  const quienEspera = txt => String(txt||'').replace(/s+y d+ más.?$/,'').split(/,s*/).map(x=>x.replace(/s*(hace[^)]*)s*$/,'').trim()).filter(Boolean);
  const esperanNuevas = alertaEnt && alertaEnt.alerta_sin_respuesta ? String(alertaEnt.alerta_sin_respuesta).split(/,s*/).filter(p=>{ const n = p.replace(/s+y d+ más.?$/,'').replace(/s*(hace[^)]*)s*$/,'').trim(); return n && !(quitadas.resp||[]).includes(n); }) : [];
  useEffect(()=>{ let vivo = true; const f = async ()=>{ if(document.visibilityState!=='visible') return; try{ const {data} = await sb.from('nf_bot_estado').select('alerta_entrega,alerta_entrega_at,alerta_sin_respuesta,alerta_sin_respuesta_at,alerta_inventario,alerta_inventario_at').eq('id',1).single(); if(vivo) setAlertaEnt(data && (data.alerta_entrega || data.alerta_sin_respuesta || data.alerta_inventario) ? data : null); }catch(e){} }; f(); const t = setInterval(f, 45000); const v = ()=>{ if(document.visibilityState==='visible') f(); }; document.addEventListener('visibilitychange', v); return ()=>{ vivo = false; clearInterval(t); document.removeEventListener('visibilitychange', v); }; },[]);
  useEffect(()=>{
    let vivo = true;
    const f = async ()=>{ if(document.visibilityState!=='visible') return; try{ const c = await DB.chatsResumen(72); const v = vistosGet(); if(vivo) setChatsPend(c.filter(x=>esPendiente(x,v)).length); }catch(e){}
      try{ const ps = await DB.cargarPedidos(); /* pedidos-simples: el número de Pedidos = paquetes por empacar; lo que necesita a la jefa va en Avisos */
        const porEmp = agruparPedidos(ps.filter(p=>p.estado==='listo_para_enviar' && !p.empacado)); if(vivo){ setPedPend(porEmp.length); setPedAvisos(seccionesAvisoPedidos(ps).n); } }catch(e){} };
    f(); const t = setInterval(f, 90000);
    return ()=>{ vivo = false; clearInterval(t); };
  },[]);
  const [prods, setProds] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [editing, setEditing] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [cat, setCat] = useState('Todos');
  const [q, setQ] = useState('');
  const [stockModal, setStockModal] = useState(null);
  const escrituraRef = useRef(0);
  const [histProd, setHistProd] = useState('todos');
  const [verTallas, setVerTallas] = useState(false); /* tallas-editables */
  const [, setTallasVer] = useState(0);
  useEffect(()=>{ if(auth) Promise.all([cargarTallasConfig(), cargarMargenEnvio()]).then(()=>setTallasVer(v=>v+1)); },[auth]);

  useEffect(()=>{ if(auth) cargar(); },[auth]);
  useEffect(()=>{
    if(!auth) return;
    const refrescar = ()=>{
      if(document.hidden) return;
      const t0 = Date.now();
      DB.cargar().then(d=>{ if(escrituraRef.current > t0 - 500) return; setProds(d); }).catch(()=>{});
    };
    const id = setInterval(refrescar, 15000);
    document.addEventListener('visibilitychange', refrescar);
    return ()=>{ clearInterval(id); document.removeEventListener('visibilitychange', refrescar); };
  },[auth]);

  async function cargar(){
    setCargando(true);
    try{ setProds(await DB.cargar()); }
    catch(e){ toast('Error: '+e.message); }
    setCargando(false);
  }

  function login(){ try{ sessionStorage.setItem('nf_ok','1'); localStorage.setItem('nf_ok_ts', String(Date.now())); }catch(e){} setAuth(true); }

  function onSave(saved){
    setProds(p=>{
      const i=p.findIndex(x=>x.id===saved.id);
      if(i>=0){ const n=[...p]; n[i]=saved; return n; }
      return [saved,...p];
    });
    setEditing(null);
  }

  async function onDelete(prod){
    setConfirm(null);
    await DB.eliminar(prod.id);
    setProds(p=>p.filter(x=>x.id!==prod.id));
    toast('Producto eliminado');
  }

  if(!auth) return <Login onLogin={login}/>;

  const cats = ['Todos',...CATS.filter(c=>prods.some(p=>p.categoria===c))];
  const filtrados = prods.filter(p=>{
    const mc = cat==='Todos'||p.categoria===cat;
    const mq = !q||p.nombre?.toLowerCase().includes(q.toLowerCase())||p.ref?.toLowerCase().includes(q.toLowerCase());
    return mc&&mq;
  });

  const total = prods.length;
  const unidades = prods.reduce((s,p)=>s+stockTotal(p),0);
  const pocos = prods.filter(p=>{ const t=stockTotal(p); return t>0&&t<=3; }).length;
  const agotados = prods.filter(p=>stockTotal(p)===0).length;

  return (
    <div>
      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand">
          <img className="brand-logo" src="logo-novafloe.png" alt="Nova Floe"/>
        </div>
        <div className="topbar-right">
          <button className="btn btn-ghost" title="Actualizar la página" onClick={()=>{ window.location.href = window.location.pathname + '?v=' + Date.now(); }}>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></svg><span className="solo-ancho"> Actualizar</span>
          </button>
          {view==='inventario' && (
            <button className="btn btn-ghost" title="Agregar o quitar tallas (16, 18, XXL...)" onClick={()=>setVerTallas(true)}>
              <span style={{fontWeight:800,fontSize:13}}>T</span><span className="solo-ancho"> Tallas</span>
            </button>
          )}
          {view==='inventario' && (
            <button className="btn btn-primary" onClick={()=>setEditing({})}>
              <Ico.Plus/> Agregar
            </button>
          )}
        </div>
      </div>

      {/* pestaña-avisos (24-nov): los avisos ya no van arriba; están en la pestaña "Avisos" */}
      {/* sin-aviso-esperando (12-nov): la usuaria pidió quitar este aviso; las clientas sin respuesta se ven en Chats */ false && alertaEnt && alertaEnt.alerta_sin_respuesta && esperanNuevas.length>0 &&<div className="alerta-entrega"><b>⏰ Clientas esperando respuesta:</b> {esperanNuevas.join(', ')} <button className="alerta-quitar" onClick={()=>guardarQuitadas({...quitadas, resp:[...new Set([...(quitadas.resp||[]).slice(-200), ...quienEspera(alertaEnt.alerta_sin_respuesta)])]})}>✕ Quitar</button> <span style={{opacity:.8,fontSize:13}}>(revisado a las {new Date(alertaEnt.alerta_sin_respuesta_at).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}). Ábrelas en Chats.</span></div>}
      {/* TABS (24-nov: sin Live ni Calculadora; Avisos como pestaña; Historial al final) */}
      <div className="tabs">
        <button className={`tab ${view==='inventario'?'on':''}`} onClick={()=>setView('inventario')}>Inventario</button>
        <button className={`tab ${view==='pedidos'?'on':''}`} onClick={()=>setView('pedidos')}>Pedidos vendidos{pedPend>0 && <span className="tab-n">{pedPend}</span>}</button>
        <button className={`tab ${view==='avisos'?'on':''}`} onClick={()=>setView('avisos')}>Avisos{nAvisos>0 && <span className="tab-n">{nAvisos}</span>}</button>{/* pestaña-avisos */}
        <button className={`tab ${view==='chats'?'on':''}`} onClick={()=>setView('chats')}>Chats{chatsPend>0 && <span className="tab-n">{chatsPend}</span>}</button>
        <button className={`tab ${view==='citas'?'on':''}`} onClick={()=>setView('citas')}>Citas{citasPend>0 && <span className="tab-n">{citasPend}</span>}</button>
        <a className="tab" href="/etiquetas/" style={{textDecoration:'none'}}>Etiquetas</a> {/* enlace-etiquetas */}
        <button className={`tab ${view==='cuentas'?'on':''}`} onClick={()=>setView('cuentas')}>Cuentas del bot</button>{/* cuentas-bot */}
        <button className={`tab ${view==='ajustes'?'on':''}`} onClick={()=>setView('ajustes')}>Ajustes</button>{/* ajustes-jefa */}
        {/* sin-tab-historial (25-nov): se quitó la pestaña; el historial de un producto se abre desde su tarjeta */}
      </div>

      {view==='pedidos' ? <PedidosView productos={prods}/> : view==='avisos' ? <div className="avisos-pag">
          <AvisosPedidos productos={prods} onN={setPedAvisos}/>{/* pedidos-simples */}
          {invPend && <div className="aviso-card" style={{borderLeftColor:'#5B7FD6'}}><div className="aviso-top"><span className="aviso-nombre">📦 Revisar inventario</span></div><div className="aviso-motivo">{alertaEnt.alerta_inventario}</div><div className="aviso-btns"><button className="aviso-btn" onClick={()=>guardarQuitadas({...quitadas, inv:alertaEnt.alerta_inventario})}>✓ Listo</button></div></div>}
          {avisosTexto && <AvisosClientas texto={avisosTexto} completo quitados={quitadas.avisos||[]} onQuitar={cl=>guardarQuitadas({...quitadas, avisos:[...(quitadas.avisos||[]), ...cl].slice(-300)})} onQuitarTodos={cl=>guardarQuitadas({...quitadas, avisos:[...(quitadas.avisos||[]), ...cl].slice(-300)})}/>}
          {nAvisos===0 && <div className="avisos-vacio">✅ No hay avisos pendientes.<br/><span>Aquí salen las clientas que necesitan a una persona (reclamos, pagos, piden asesora), los pagos por confirmar o verificar, los pedidos con aviso y lo que haya que revisar del inventario.</span></div>}
        </div> : view==='chats' ? <ChatsView onPend={setChatsPend}/> : view==='citas' ? <CitasView/> : view==='historial' ? <HistorialView productos={prods} filtro={histProd} setFiltro={setHistProd}/> : view==='cuentas' ? <CuentasView/> : view==='ajustes' ? <AjustesView prods={prods} onTallas={()=>setTallasVer(v=>v+1)}/> : <>

      {/* STATS */}
      <div className="stats-bar">
        <div className="stat"><div className="stat-label">Productos</div><div className="stat-val accent">{total}</div></div>
        <div className="stat"><div className="stat-label">Unidades</div><div className="stat-val">{unidades}</div></div>
        <div className="stat"><div className="stat-label">Poco stock</div><div className="stat-val warn">{pocos}</div></div>
        <div className="stat"><div className="stat-label">Agotados</div><div className="stat-val danger">{agotados}</div></div>
      </div>

      <div className="auto-nota">Las unidades se actualizan solas cuando el bot vende.</div>

      {/* TOOLBAR */}
      <div className="toolbar">
        {cats.map(c=>(
          <button key={c} className={`chip ${cat===c?'on':''}`} onClick={()=>setCat(c)}>{c}</button>
        ))}
        <div className="search-box">
          <Ico.Search/>
          <input placeholder="Buscar por nombre o referencia..." value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
      </div>

      {/* GRID */}
      <div className="grid">
        {cargando
          ? <div className="loading-page" style={{gridColumn:'1/-1'}}><div className="spinner"/></div>
          : filtrados.length===0
            ? <div className="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7l.5 1h9l.5-1c2.5-1.5 4-4 4-7 0-5-4-9-9-9Z"/></svg>
                <p>{total===0 ? 'Aún no hay productos. Toca "+ Agregar" para empezar.' : 'Ningún producto coincide con la búsqueda.'}</p>
                {total===0 && <button className="btn btn-primary btn-lg" onClick={()=>setEditing({})}>+ Agregar primer producto</button>}
              </div>
            : filtrados.map(p=>(
                <ProductCard key={p.id} prod={p} onEdit={setEditing} onDelete={setConfirm} onStock={(prod,modo)=>setStockModal({prod,modo})} onHist={prod=>{ setHistProd(prod.id); setView('historial'); }}/>
              ))
        }
      </div>

      </>}

      {/* EDITOR */}
      {editing!==null && <Editor item={editing} onSave={onSave} onClose={()=>setEditing(null)}/>}
      {verTallas && <TallasModal prods={prods} onClose={()=>setVerTallas(false)} onSaved={()=>setTallasVer(v=>v+1)}/>}

      {/* MOVER STOCK */}
      {stockModal && <StockModal prod={stockModal.prod} modo={stockModal.modo} onClose={()=>setStockModal(null)}
        onDone={tallas=>{ escrituraRef.current = Date.now(); setProds(ps=>ps.map(x=>x.id===stockModal.prod.id?{...x,tallas}:x)); }}/>}

      {/* CONFIRM */}
      {confirm && (
        <div className="modal-bg">
          <div className="modal">
            <h3>¿Eliminar?</h3>
            <p>Se eliminará "<strong>{confirm.nombre}</strong>" del inventario. Esta acción no se puede deshacer.</p>
            {/* aviso-borrar-con-stock (23-nov): borrar y volver a crear dejó al bot 3 h diciendo "no hay jeans" y perdió las fotos de medidas */}
            {Object.values(confirm.tallas||{}).reduce((s,v)=>s+Number(v||0),0)>0 && (
              <p style={{background:'#fff4e5',border:'1px solid #f5c26b',borderRadius:10,padding:'10px 12px',fontSize:14}}>
                ⚠️ Este jean tiene <strong>{Object.values(confirm.tallas||{}).reduce((s,v)=>s+Number(v||0),0)} unidades</strong>. Si lo borras, el bot deja de venderlo y se pierde su foto de medidas.<br/>
                Si solo quieres <strong>cambiar la foto, el precio o las tallas</strong>, cancela y usa <strong>Editar</strong>.
              </p>
            )}
            <div className="modal-btns">
              <button className="btn btn-ghost" onClick={()=>setConfirm(null)}>Cancelar</button>
              <button className="btn btn-danger-soft btn-lg" onClick={()=>onDelete(confirm)}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
