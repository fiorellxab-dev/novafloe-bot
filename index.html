<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nova Floe — Inventario</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Nova Floe"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  /* marca-novafloe: colores del logo (negro + rosado #FBA6DA) */
  --blush:   #FBA6DA;
  --blush-d: #121212;
  --blush-dd:#000000;
  --blush-l: #FFF1F9;
  --blush-m: #FDD3EC;
  --night:   #121212;
  --night-2: #3A3539;
  --night-3: #6F666C;
  --mist:    #FCF8FA;
  --white:   #FFFFFF;
  --border:  #F2E1EB;
  --green:   #3D7A5A;
  --green-l: #E4F2EB;
  --amber:   #B07820;
  --amber-l: #FBF0D8;
  --red:     #C03040;
  --red-l:   #FCEAEC;
  --body:    'DM Sans', sans-serif;
  --display: 'Playfair Display', serif;
  --r: 14px;
  --r-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--body);background:var(--mist);color:var(--night);min-height:100vh;}

/* LOGIN */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: linear-gradient(160deg, #FFF1F9 0%, #FFFFFF 55%, #FDE3F2 100%);
  padding:1.5rem;
}
.login-card{
  background:var(--white);border-radius:24px;padding:2.5rem 2rem;
  width:100%;max-width:360px;
  box-shadow: 0 8px 40px rgba(251,166,218,.28), 0 2px 8px rgba(18,18,18,.05);
}
.login-logo{
  width:56px;height:56px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;
}
.login-logo svg{width:26px;height:26px;fill:white;}
.login-title{font-family:var(--display);font-size:26px;text-align:center;color:var(--night);margin-bottom:4px;}
.login-title em{font-style:italic;color:var(--blush-d);}
.login-sub{font-size:13px;color:var(--night-3);text-align:center;margin-bottom:1.75rem;}
.login-card label{font-size:12px;font-weight:600;color:var(--night-2);display:block;margin-bottom:6px;letter-spacing:.3px;}
.login-card input{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:11px 14px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
  margin-bottom:12px;
}
.login-card input:focus{border-color:var(--blush-d);background:white;}
.login-err{font-size:12px;color:var(--red);margin-bottom:10px;text-align:center;}
.btn-login{
  width:100%;height:44px;background:var(--blush-d);color:white;border:none;
  border-radius:var(--r-sm);font-family:var(--body);font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:.2px;transition:background .15s;
}
.btn-login:hover{background:var(--blush-dd);}

/* TOPBAR */
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 1.25rem;height:58px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:50%;background:var(--blush-d);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px;fill:white;}
.brand-name{font-family:var(--display);font-size:18px;color:var(--night);}
.brand-logo{height:30px;width:auto;display:block}
@media (max-width:480px){ .topbar{padding:0 12px;gap:8px} .brand-logo{height:22px} .topbar-right .btn{padding:0 12px} .solo-ancho{display:none} }
.login-logo-img{display:block;width:230px;max-width:80%;height:auto;margin:0 auto 1.25rem;}
.brand-name em{font-style:italic;color:var(--blush-d);}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* BUTTONS */
.btn{
  border:none;border-radius:var(--r-sm);padding:0 16px;height:36px;
  font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn-primary{background:var(--blush-d);color:white;}
.btn-primary:hover{background:var(--blush-dd);}
.btn-ghost{background:transparent;color:var(--night-2);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--blush-l);}
.btn-danger-soft{background:var(--red-l);color:var(--red);border:none;}
.btn-danger-soft:hover{background:#f5c5ca;}
.btn-lg{height:44px;font-size:14px;padding:0 20px;}
/* pulido-tarjetas */
.card-body .btn-ghost svg,.card-body .btn-danger-soft svg{width:14px;height:14px;flex:none;}

/* STATS */
.stats-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;padding:1.1rem 1.25rem 0;
}
.stat{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  padding:.85rem 1rem;
}
.stat-label{font-size:11px;color:var(--night-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-weight:500;}
.stat-val{font-size:24px;font-weight:600;line-height:1;color:var(--night);}
.stat-val.accent{color:var(--blush-d);}
.stat-val.warn{color:var(--amber);}
.stat-val.danger{color:var(--red);}

/* FILTERS */
.toolbar{
  padding:.85rem 1.25rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.chip{
  border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;
  font-size:12px;font-family:var(--body);font-weight:500;background:transparent;
  color:var(--night-3);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--blush);color:var(--blush-d);}
.chip.on{background:var(--blush-d);border-color:var(--blush-d);color:white;}
.search-box{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--white);border:1.5px solid var(--border);border-radius:20px;
  padding:0 14px;height:34px;
}
.search-box svg{width:14px;height:14px;opacity:.35;flex-shrink:0;}
.search-box input{
  border:none;outline:none;background:transparent;font-family:var(--body);
  font-size:13px;color:var(--night);width:100%;
}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;padding:0 1.25rem 2rem;
}
.card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(251,166,218,.35);}
.card-photo{aspect-ratio:3/4;background:var(--blush-l);position:relative;overflow:hidden;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-photo .no-img{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--blush);
}
.card-photo .no-img svg{width:32px;height:32px;opacity:.4;}
.card-photo .no-img span{font-size:11px;opacity:.5;}
.stock-pill{
  position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:20px;background:var(--green-l);color:var(--green);
}
.stock-pill.low{background:var(--amber-l);color:var(--amber);}
.stock-pill.out{background:var(--red-l);color:var(--red);}
.card-body{padding:.7rem .85rem .85rem;}
.card-ref{font-size:10px;color:var(--night-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;}
.card-name{font-size:13px;font-weight:600;color:var(--night);line-height:1.3;margin-bottom:6px;}
.tallas-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
.t-chip{
  font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px;
  background:var(--blush-l);color:var(--blush-dd);
}
.t-chip.low{background:var(--amber-l);color:var(--amber);}
.t-chip.out{background:var(--red-l);color:var(--red);text-decoration:line-through;}
.card-price{font-size:14px;font-weight:700;color:var(--blush-d);}

/* EMPTY */
.empty{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4rem 1rem;gap:12px;
}
.empty svg{width:48px;height:48px;color:var(--blush-m);}
.empty p{font-size:14px;color:var(--night-3);text-align:center;}

/* DRAWER */
.drawer-bg{position:fixed;inset:0;background:rgba(26,17,24,.45);z-index:150;backdrop-filter:blur(2px);}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(460px,100vw);
  background:var(--white);z-index:160;overflow-y:auto;
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(26,17,24,.12);
}
.drawer-head{
  padding:1rem 1.25rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--white);z-index:5;
}
.drawer-head h3{font-family:var(--display);font-size:20px;color:var(--night);}
.drawer-head h3 em{font-style:italic;color:var(--blush-d);}
.close-btn{
  width:32px;height:32px;border:1.5px solid var(--border);border-radius:50%;
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.close-btn svg{width:14px;height:14px;stroke:var(--night-2);fill:none;stroke-width:2;}
.drawer-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex:1;}

/* FORM */
.field label{font-size:11px;font-weight:600;color:var(--night-2);display:block;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;font-size:14px;font-family:var(--body);outline:none;
  color:var(--night);background:var(--mist);transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blush-d);background:white;
}
.field textarea{resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* FOTO UPLOAD */
.foto-drop{
  border:2px dashed var(--blush-m);border-radius:var(--r);padding:1.5rem;
  text-align:center;cursor:pointer;transition:background .15s;position:relative;
  background:var(--blush-l);
}
.foto-drop:hover{background:var(--blush-m);}
.foto-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.foto-drop svg{width:32px;height:32px;stroke:var(--blush-d);fill:none;stroke-width:1.5;margin-bottom:8px;}
.foto-drop p{font-size:13px;color:var(--blush-d);font-weight:500;}
.foto-drop small{font-size:11px;color:var(--night-3);}
.foto-preview-wrap{position:relative;}
.foto-preview{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);display:block;}
.foto-change{
  position:absolute;bottom:10px;right:10px;background:white;
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:4px;color:var(--night-2);
}
.foto-change input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.uploading-overlay{
  position:absolute;inset:0;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;border-radius:var(--r);
}

/* TALLAS */
.tallas-editor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.talla-cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
.talla-cell label{font-size:10px;font-weight:700;color:var(--night-3);text-transform:uppercase;}
.talla-num{
  width:100%;border:1.5px solid var(--border);border-radius:6px;
  padding:6px 4px;text-align:center;font-size:13px;font-weight:600;
  font-family:var(--body);outline:none;color:var(--night);background:var(--mist);
  transition:border-color .15s;
}
.talla-num:focus{border-color:var(--blush-d);background:white;}
.talla-num::-webkit-outer-spin-button,.talla-num::-webkit-inner-spin-button{-webkit-appearance:none;}
/* tallas-editables */
.tallas-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.talla-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--mist);border:1.5px solid var(--border);font-weight:700;font-size:14px;color:var(--night);}
.talla-chip button{width:22px;height:22px;border-radius:50%;border:none;background:white;color:var(--night-3);font-size:15px;line-height:1;cursor:pointer;}
.talla-chip button:hover{background:#f6dede;color:#b3261e;}
.tallas-nueva{display:flex;gap:8px;}
.tallas-nueva input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:var(--body);outline:none;}
.tallas-nueva input:focus{border-color:var(--blush-d);}
.tallas-nueva .btn{white-space:nowrap;}
/* cobros-envio-lista */
.cobros-dia{margin-bottom:18px;}
.cobros-tit{font-size:15px;padding:6px 2px 10px;}
.cobros-tit .ok{color:#2F6B4C;font-weight:700;} .cobros-tit .no{color:#A0522D;font-weight:700;}
.cobro-card{background:var(--white);border:1.5px solid #F1D9A0;border-left:5px solid #E0A63C;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.cobro-card.pago{border-color:#BFE0CC;border-left-color:#3E9A66;}
.cobro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.cobro-nom{font-weight:700;font-size:16px;}
.cobro-sub{font-size:13px;color:var(--night-3);margin-top:2px;}
.cobro-est{font-weight:800;font-size:14px;white-space:nowrap;padding:4px 10px;border-radius:999px;}
.cobro-est.ok{background:#E8F3EC;color:#2F6B4C;} .cobro-est.no{background:#FFF1DC;color:#A0522D;}
.cobro-est.anu{background:#EEEAF4;color:#5B4B73;} .cobro-anu{font-size:13px;background:#F4F1F8;color:#5B4B73;border-radius:8px;padding:6px 9px;margin-top:8px;}
.cobro-det{font-size:14px;margin-top:8px;} .cobro-det .viejo{color:#C0392B;}
.cobro-items{font-size:13px;color:var(--night-3);margin:4px 0 10px;}
.cobro-fotos{margin:0 0 10px;} .cobro-fotos-tit{font-size:13px;font-weight:700;margin-bottom:6px;}
.cobro-fotos-fila{display:flex;gap:8px;flex-wrap:wrap;}
.cobro-fotos-fila a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--night-3);font-size:12px;}
.visor-bg{position:fixed;inset:0;background:rgba(20,12,24,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
.visor-caja{background:var(--white);border-radius:14px;max-width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.visor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-weight:700;font-size:14px;border-bottom:1px solid var(--border);}
.visor-x{width:36px;height:36px;border-radius:50%;border:none;background:var(--mist);font-size:18px;cursor:pointer;flex:none;}
.visor-x:hover{background:#f6dede;}
.visor-caja img{display:block;max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;margin:0 auto;}
.cobro-fotos-fila img{width:96px;height:128px;object-fit:cover;border-radius:8px;border:1.5px solid var(--border);background:var(--mist);}
/* envio-en-tarjeta */ .pk-envest{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:16px;border:1.5px solid;}
.pk-envest.ok{background:#E8F3EC;border-color:#9CCFB0;color:#2F6B4C;} .pk-envest.no{background:#FFF1DC;border-color:#E8C48A;color:#A0522D;} .pk-envest.anu{background:#F1EEF6;border-color:#C9BEDA;color:#5B4B73;} .pk-envest.sin{background:#F4F4F4;border-color:#DDD;color:#555;} .pk-envest.jean{background:#EEF4FB;border-color:#9DB8D9;color:#2C5AA0;} /* comprobantes-en-tarjeta */
.pk-envest b{font-size:19px;} .pk-envest .sub{font-size:15px;font-weight:400;opacity:.9;margin-top:2px;} .pk-envest .fotos{display:flex;gap:8px;} .pk-envest .fotos a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:inherit;text-decoration:none;}
.pk-envest .fotos img{width:68px;height:90px;object-fit:cover;border-radius:7px;border:1.5px solid rgba(0,0,0,.15);background:#fff;}
.avp-tit{font-size:20px;font-weight:800;margin:6px 0 8px;color:var(--night,#2B1E33);} .avisos-pedidos{margin-bottom:18px;} /* pedidos-simples */
.cobros-busca{width:100%;box-sizing:border-box;padding:12px 14px;font-size:17px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--white);}
/* ajustes-jefa */
.ajustes{padding:1rem 1.25rem 3rem;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.aj-box{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;}
.aj-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.aj-rojo{background:var(--red-l);border-color:var(--red);}
.aj-tit{font-weight:700;font-size:16px;}
.aj-ayuda{font-size:13px;color:var(--night-3);margin-top:4px;line-height:1.4;}
.aj-aviso{font-size:13px;background:#FFF6E0;border:1px solid #F1D9A0;color:#7A5A12;border-radius:10px;padding:8px 10px;margin-bottom:12px;}
.ajustes .field input,.ajustes textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;font-family:var(--body);outline:none;background:var(--white);}
.ajustes textarea{resize:vertical;line-height:1.45;}
.ajustes .field input:focus,.ajustes textarea:focus{border-color:var(--blush-d);}
@media (max-width:560px){ .aj-fila{flex-direction:column;align-items:stretch;} .aj-fila .btn{width:100%;} }

/* SECCION TALLAS */
.section-title{
  font-size:11px;font-weight:700;color:var(--night-3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px;
}

/* DRAWER FOOTER */
.drawer-footer{
  padding:1rem 1.25rem;border-top:1px solid var(--border);
  display:flex;gap:8px;background:var(--white);
  position:sticky;bottom:0;
}

/* TOAST */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(0);
  background:var(--night);color:white;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:400;white-space:nowrap;
  transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.hidden{opacity:0;transform:translateX(-50%) translateY(8px);}

/* CONFIRM */
.modal-bg{position:fixed;inset:0;background:rgba(26,17,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:20px;padding:1.75rem;width:100%;max-width:300px;text-align:center;}
.modal h3{font-family:var(--display);font-size:20px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--night-3);margin-bottom:1.5rem;line-height:1.5;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;height:40px;}

/* SPINNER */
.spinner{
  width:22px;height:22px;border:2.5px solid var(--blush-m);
  border-top-color:var(--blush-d);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-page{display:flex;align-items:center;justify-content:center;min-height:60vh;}

@media(max-width:480px){
  .tallas-editor{grid-template-columns:repeat(4,1fr);}
  .row2{grid-template-columns:1fr;}
}

/* TABS */
.tabs{display:flex;gap:4px;padding:0 1.25rem;margin-top:.75rem;}
.tab{

/* tallas-editables (25-nov): la jefa agrega o quita tallas desde el botón "Tallas" (se guardan en nf_bot_config:
   tallas_numericas / tallas_letras). Estas listas son solo el valor por defecto si no hay nada guardado. */
let TALLAS_JEANS = ['4','6','8','10','12','14'];
let TALLAS_LETRAS = ['XS','S','M','L','XL'];
async function cargarTallasConfig(){
  try{
    const {data} = await sb.from('nf_bot_config').select('clave,valor').in('clave',['tallas_numericas','tallas_letras']);
    (data||[]).forEach(r=>{ let l = null; try{ l = JSON.parse(r.valor); }catch(e){}
      if(Array.isArray(l) && l.length){ l = [...new Set(l.map(x=>String(x).trim()).filter(Boolean))].sort((a,b)=>cmpTalla(a,b));
        if(r.clave==='tallas_numericas') TALLAS_JEANS = l; else TALLAS_LETRAS = l; } });
  }catch(e){}
}
/* envio-margen (25-nov): el cobro del envío = lo que cuesta en Skydropx + ENVIO_MARGEN, redondeado al mil de arriba.
   La jefa lo cambia en Ajustes (nf_bot_config 'envio_margen'). Antes era el siguiente múltiplo de $2.000 (8.743 -> 10.000). */
let ENVIO_MARGEN = 4000; /* margen-miles-4000 (26-nov, Chispi): se cobra el valor de la guía en miles cerrados + 4.000 → 8.743 → 12.000 · 9.410 → 13.000 · 10.000 → 14.000 (siempre de $3.000 a $4.000 arriba) */
async function cargarMargenEnvio(){ try{ const {data} = await sb.from('nf_bot_config').select('valor').eq('clave','envio_margen').maybeSingle(); const v = data && data.valor; const n = Number(v); if(v!==null && v!==undefined && String(v).trim()!=='' && n>=2000 && n<=50000) ENVIO_MARGEN = n; } /* margen-piso-seguridad: sin valor guardado queda en 4.000 (antes quedaba en 0) */catch(e){} }
async function guardarTallasConfig(num, letras){
  const ahora = new Date().toISOString();
  const {error} = await sb.from('nf_bot_config').upsert([{clave:'tallas_numericas', valor:JSON.stringify(num), actualizado:ahora},{clave:'tallas_letras', valor:JSON.stringify(letras), actualizado:ahora}],{onConflict:'clave'});
  if(error) throw error;
  TALLAS_JEANS = num; TALLAS_LETRAS = letras;
}
const CATS_NUMERICAS = ['Jeans','Shorts'];            // el resto (Blusas, Camisetas, Vestidos...) usa XS, S, M, L, XL
const ORDEN_LETRAS = ['XXS','XS','S','M','L','XL','XXL'];
const TALLAS_LIST = TALLAS_JEANS;
function tallasDeCategoria(cat){ return CATS_NUMERICAS.includes(cat) ? TALLAS_JEANS : TALLAS_LETRAS; }
function ordenTalla(t){ const n = Number(t); if(String(t).trim()!=='' && !isNaN(n)) return n; const i = ORDEN_LETRAS.indexOf(String(t).trim().toUpperCase()); return 1000 + (i<0 ? 99 : i); }
function cmpTalla(a,b){ return ordenTalla(a)-ordenTalla(b); }
function etiquetaTalla(t){ return /^[0-9]+$/.test(String(t)) ? 'T'+t : String(t); }

const DB = {
  async cargar(){
    const {data,error} = await sb.from('nf_productos').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    return data||[];
  },
  async cargarUno(id){
    const {data,error} = await sb.from('nf_productos').select('*').eq('id',id).single();
    if(error) throw error;
    return data;
  },
  /* tallas-editables: si la talla es nueva para este jean (ej. 16), primero se crea en 0 sin pisar lo que el bot
     esté vendiendo en ese momento (solo guarda si el inventario no cambió mientras tanto; si cambió, lo intenta otra vez) */
  async asegurarTalla(id, talla){
    for(let i=0;i<4;i++){
      const {data:p,error:e1} = await sb.from('nf_productos').select('tallas').eq('id',id).single();
      if(e1) throw e1;
      const t = p.tallas||{};
      if(Object.prototype.hasOwnProperty.call(t, talla)) return;
      const {data,error} = await sb.from('nf_productos').update({tallas:{...t,[talla]:0}}).eq('id',id).eq('tallas',JSON.stringify(t)).select('id');
      if(error) throw error;
      if(data && data.length) return;
    }
    throw new Error('no se pudo crear la talla '+talla+', intenta otra vez');
  },
  async moverStock(id,tipo,movs,nota){
    try{ const {data:p} = await sb.from('nf_productos').select('tallas').eq('id',id).single(); const t = (p&&p.tallas)||{};
      for(const m of movs){ if(!Object.prototype.hasOwnProperty.call(t, m.talla)) await DB.asegurarTalla(id, m.talla); } }catch(e){ throw e; }
    const {data,error} = await sb.rpc('nf_mover_stock',{p_producto:id,p_tipo:tipo,p_movs:movs,p_nota:nota||''});
    if(error) throw error;
    return data;
  },
  async cargarMovimientos(){
    const {data,error} = await sb.from('nf_movimientos').select('*').order('created_at',{ascending:false}).limit(500);
    if(error) throw error;
    return data||[];
  },
  async guardar(item){
    const {data,error} = await sb.from('nf_productos').upsert(item,{onConflict:'id'}).select().single();
    if(error) throw error;
    return data;
  },
  async cargarPedidos(){
    const {data,error} = await sb.from('nf_pedidos').select('*').gte('created_at', new Date(Date.now()-14*864e5).toISOString()).order('created_at',{ascending:false});
    if(error) throw error;
    return data||[];
  },
  async chatsResumen(h){
    const {data,error} = await sb.rpc('nf_chats_resumen',{p_horas:h||72});
    if(error) throw error;
    return data||[];
  },
  /* historial-completo-chats (23-nov): nf_chats_resumen trae maximo 400 chats; aqui se completan TODAS las clientas desde nf_conversaciones */
  async chatsHistoricos(){
    const rpc = await DB.chatsResumen(24*3650);
    const conocidos = new Set(rpc.map(c=>c.telefono));
    const {count} = await sb.from('nf_conversaciones').select('id',{count:'exact',head:true});
    const pags = []; for(let o=0;o<(count||0);o+=1000) pags.push(sb.from('nf_conversaciones').select('telefono,created_at').order('id',{ascending:true}).range(o,o+999));
    const ult = {}; for(const r of await Promise.all(pags)) for(const x of (r.data||[])) if(!ult[x.telefono] || x.created_at > ult[x.telefono]) ult[x.telefono] = x.created_at;
    const nombres = {}; for(let o=0;o<20000;o+=1000){ const {data} = await sb.from('nf_pedidos').select('cliente_telefono,cliente_nombre,envio_nombre').order('created_at',{ascending:true}).range(o,o+999); (data||[]).forEach(p=>{ const n = String(p.envio_nombre||p.cliente_nombre||'').trim(); if(n && n.length>1) nombres[p.cliente_telefono] = n; }); if(!data || data.length<1000) break; }
    const extra = Object.entries(ult).filter(([t])=>!conocidos.has(t)).map(([t,at])=>({telefono:t, ultimo_rol:'assistant', ultimo_texto:'Chat anterior: tócalo para leerlo', ultimo_at:at, ultimo_media:false, nombre:nombres[t]||'', telefono_real:null}));
    return [...rpc, ...extra.sort((a,b)=>String(b.ultimo_at).localeCompare(String(a.ultimo_at)))];
  },
  async chatMensajes(tel){
    const [m, f] = await Promise.all([
      sb.from('nf_conversaciones').select('id,rol,contenido,created_at,media_url,foto_publica,autor').eq('telefono',tel).order('created_at',{ascending:false}).limit(5000), /* historial-completo-chats */
      sb.from('nf_fotos_enviadas').select('id,pie,created_at,url').eq('telefono',tel).order('created_at',{ascending:false}).limit(1000)
    ]);
    if(m.error) throw m.error;
    const fotos = (f.error ? [] : (f.data||[])).map(x=>({id:'foto-'+x.id, rol:'assistant', contenido:'', foto_pie:x.pie||'', foto_url:x.url||'', created_at:x.created_at}));
    return [...(m.data||[]), ...fotos].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  },
  async chatPedidos(tel){ /* pedido-en-chat */
    const [p, pr] = await Promise.all([
      sb.from('nf_pedidos').select('id,estado,talla,cantidad,precio_total,producto_id,producto_nombre,created_at,grupo_id,envio_nombre,envio_cedula,envio_telefono,envio_direccion,envio_ciudad,envio_email,monto_detectado,envio_valor,envio_pagado,nota_jefa').eq('cliente_telefono',tel).gte('created_at', new Date(Date.now()-7*864e5).toISOString()).order('created_at',{ascending:false}).limit(20),
      sb.from('nf_productos').select('id,nombre')
    ]);
    if(p.error) throw p.error;
    const nom = {}; (pr.data||[]).forEach(x=>{ nom[x.id]=String(x.nombre||'').trim(); });
    return (p.data||[]).map(x=>({...x, producto:nom[x.producto_id]||x.producto_nombre||'Producto'}));
  },
  async eliminar(id){
    const {error} = await sb.from('nf_productos').delete().eq('id',id);
    if(error) throw error;
  },
  async cargarLive(){
    const {data,error} = await sb.from('nf_bot_estado').select('modo_live,producto_live,orden_live,bot_pausado,autoconfirmar').eq('id',1).single();

    if(error) throw error;

  async subirFoto(file,id){
    const resized = await redimensionarImagen(file, 1500, 0.85);
    const path = `productos/${id}.jpg`;
    await sb.storage.from('nf-fotos').remove([path]);
    const {error} = await sb.storage.from('nf-fotos').upload(path,resized,{upsert:true,contentType:'image/jpeg'});
    if(error) throw error;
    return sb.storage.from('nf-fotos').getPublicUrl(path).data.publicUrl;
  },
  urlMedidas(id){
    return sb.storage.from('nf-fotos').getPublicUrl(`medidas/${id}.jpg`).data.publicUrl;
  },
  async subirMedidas(file,id){
    const resized = await redimensionarImagen(file, 1800, 0.9);
    const path = `medidas/${id}.jpg`;
    await sb.storage.from('nf-fotos').remove([path]);
    const {error} = await sb.storage.from('nf-fotos').upload(path,resized,{upsert:true,contentType:'image/jpeg'});
    if(error) throw error;
    return DB.urlMedidas(id)+'?v='+Date.now();
  }
};

function redimensionarImagen(file, maxDim, calidad){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width,height} = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else { width = Math.round(width*(maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error('No se pudo procesar la imagen')); return; }
        resolve(blob);
      }, 'image/jpeg', calidad);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

function uid(){ return 'nf'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ return n?'$'+Number(n).toLocaleString('es-CO'):''; }
function stockTotal(p){ return Object.values(p.tallas||{}).reduce((s,v)=>s+(parseInt(v)||0),0); }
function stockInfo(p){
  const t=stockTotal(p);
  if(t===0) return {label:'Agotado',cls:'out'};
  if(t<=3)  return {label:t+' uds',cls:'low'};
  return {label:t+' uds',cls:''};
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.remove('hidden');
  clearTimeout(window._t);
  window._t=setTimeout(()=>el.classList.add('hidden'),2600);
}

<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ── SVG ICONS ── */
const Ico = {
  Hanger: ()=><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 18H2.5a.5.5 0 0 1-.33-.87L11 10V8a1 1 0 1 1 2 0v2l8.83 7.13a.5.5 0 0 1-.33.87Z"/><path d="M10 8a2 2 0 1 1 4 0"/></svg>,
  Plus:   ()=><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3" y1="10" x2="17" y2="10"/></svg>,
  X:      ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2.2"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>,
  Trash:  ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><polyline points="2,4 14,4"/><path d="M6 4V2h4v2"/><path d="M4 4l1 10h6l1-10"/></svg>,
  Camera: ()=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="7" width="20" height="14" rx="3"/><circle cx="12" cy="14" r="4"/><path d="M8 7l2-3h4l2 3"/></svg>,
  Search: ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>,
  Edit:   ()=><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M11 2l3 3-8 8H3v-3L11 2Z"/></svg>,
};

/* ── EDITOR DRAWER ── */
function Editor({item, onSave, onClose}){
  const isNew = !item.id;
  const [f, setF] = useState({
    id: item.id||uid(),
    nombre: item.nombre||'',
    ref: item.ref||'',
    categoria: item.categoria||'Jeans',
    precio: item.precio||'',
    linea: item.linea||((item.categoria||'Jeans')==='Jeans' ? 'premium' : 'ninguna'), /* mayoreo-general */
    foto_url: item.foto_url||'',
    tallas: item.tallas||{},
    notas: item.notas||'',
  });
  const [localImg, setLocalImg] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);

  function set(k,v){ setF(p=>({...p,[k]:v})); }
  function cambiarCategoria(c){ const lista = tallasDeCategoria(c); setF(p=>({...p, categoria:c, linea: isNew ? (c==='Jeans' ? 'premium' : 'ninguna') : p.linea, tallas: isNew ? Object.fromEntries(Object.entries(p.tallas||{}).filter(([k])=>lista.includes(k))) : p.tallas})); }
  const listaTallas = [...new Set([...tallasDeCategoria(f.categoria), ...Object.keys(f.tallas||{})])].sort(cmpTalla);
  function setT(t,v){ setF(p=>({...p,tallas:{...p.tallas,[t]:parseInt(v)||0}})); }
  /* talla-en-editor (26-nov): agregar una talla nueva (ej. 2, 16, XXL) desde aquí; queda en la lista de tallas para todos los productos
     de esa clase (igual que el botón "Tallas") y, si el producto ya existe, se crea en 0 (las unidades se suman con "Llegó") */
  const [nuevaT, setNuevaT] = useState(''); const [agregandoT, setAgregandoT] = useState(false);
  async function agregarTalla(){
    const t = nuevaT.trim().toUpperCase(); if(!t) return;
    if(!/^[0-9]{1,2}$|^[A-Z]{1,4}$/.test(t)){ toast('Escribe la talla como número (ej. 2, 16) o letras (ej. XXL)'); return; }
    if(listaTallas.includes(t)){ toast('La talla '+t+' ya está'); return; }
    const esNum = /^[0-9]+$/.test(t);
    if(esNum !== CATS_NUMERICAS.includes(f.categoria)){ toast(esNum ? 'Esta categoría usa tallas de letras (XS, S, M...)' : 'Esta categoría usa tallas de número (4, 6, 8...)'); return; }
    setAgregandoT(true);
    try{
      const num = esNum ? [...new Set([...TALLAS_JEANS, t])].sort(cmpTalla) : TALLAS_JEANS;
      const letras = esNum ? TALLAS_LETRAS : [...new Set([...TALLAS_LETRAS, t])].sort(cmpTalla);
      await guardarTallasConfig(num, letras);
      if(!isNew) await DB.asegurarTalla(item.id, t);
      setF(p=>({...p, tallas:{...p.tallas, [t]: 0}})); setNuevaT('');
      toast('✓ Talla '+t+' agregada'+(isNew ? '' : '. Para sumarle unidades usa el botón Llegó de la tarjeta.'));
    }catch(e){ toast('No se pudo agregar la talla: '+(e.message||e)); }
    setAgregandoT(false);
  }

  async function handleFoto(e){
    const file = e.target.files[0]; if(!file) return;
    setLocalImg(URL.createObjectURL(file));
    setUploading(true);
    try{
      const url = await DB.subirFoto(file, f.id);
      set('foto_url', url);
      toast('Foto subida ✓');
    } catch(err){ toast('Error al subir foto'); }
    setUploading(false);
  }

  /* foto de medidas: se guarda en el almacenamiento (medidas/<id>.jpg); el bot la manda cuando piden medidas */
  const [medidasSrc, setMedidasSrc] = useState('');
  const [uploadingM, setUploadingM] = useState(false);
  useEffect(()=>{
    if(isNew) return;
    const im = new Image();
    im.onload = ()=> setMedidasSrc(DB.urlMedidas(f.id)+'?v='+Date.now());
    im.src = DB.urlMedidas(f.id)+'?c='+Date.now();
  },[]);
  async function handleMedidas(e){
    const file = e.target.files[0]; if(!file) return;
    setMedidasSrc(URL.createObjectURL(file));
    setUploadingM(true);
    try{
      const url = await DB.subirMedidas(file, f.id);
      setMedidasSrc(url);
      toast('Foto de medidas subida ✓');
    } catch(err){ toast('Error al subir la foto de medidas'); setMedidasSrc(''); }
    setUploadingM(false);
  }

  async function handleSave(){
    if(!f.nombre.trim()){ toast('Escribe el nombre del producto'); return; }
    const pr = Number(f.precio);
    if(f.precio!=='' && pr>0 && pr<1000){ toast('El precio parece incompleto: escribe 75000 (no 75)'); return; }
    setSaving(true);
    try{
      const payload = {...(isNew ? f : (({tallas, ...resto})=>resto)(f))};

      const saved = await DB.guardar(payload);
      toast(isNew ? '✓ Producto agregado al inventario' : '✓ Cambios guardados');
      onSave(saved);
    } catch(err){ toast('Error: '+err.message); }
    setSaving(false);
  }

  const imgSrc = localImg || f.foto_url;

  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{isNew ? <>Nuevo <em>producto</em></> : <>Editar <em>producto</em></>}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>

      <div className="drawer-body">

        {/* FOTO */}
        <div className="field">
          <label>Foto del producto</label>
          {imgSrc
            ? <div className="foto-preview-wrap">
                <img src={imgSrc} className="foto-preview" alt=""/>
                {uploading && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleFoto}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleFoto}/>
                <Ico.Camera/>
                <p>{uploading ? 'Subiendo foto...' : 'Toca para subir foto'}</p>
                <small>JPG, PNG o WEBP</small>
              </div>
          }
        </div>

        {/* FOTO DE MEDIDAS */}
        <div className="field">
          <label>Foto de medidas (el bot la manda cuando piden las medidas)</label>
          {medidasSrc
            ? <div className="foto-preview-wrap">
                <img src={medidasSrc} className="foto-preview" alt=""/>
                {uploadingM && <div className="uploading-overlay"><div className="spinner"/></div>}
                <label className="foto-change">
                  <Ico.Camera/> Cambiar
                  <input type="file" accept="image/*" onChange={handleMedidas}/>
                </label>
              </div>
            : <div className="foto-drop">
                <input type="file" accept="image/*" onChange={handleMedidas}/>
                <Ico.Camera/>
                <p>{uploadingM ? 'Subiendo foto de medidas...' : 'Toca para subir la foto de medidas'}</p>
                <small>Foto de la prenda con las medidas al lado</small>
              </div>
          }
        </div>

        {/* NOMBRE + REF */}
        <div className="row2">
          <div className="field">
            <label>Nombre *</label>
            <input value={f.nombre} onChange={e=>set('nombre',e.target.value)} placeholder={f.categoria==='Blusas'?'Blusa Lino Blanca':'Jean Tiro Alto'}/>
          </div>
          <div className="field">
            <label>Referencia</label>
            <input value={f.ref} onChange={e=>set('ref',e.target.value)} placeholder={f.categoria==='Blusas'?'NF-B001':'NF-J001'}/>
          </div>
        </div>

        {/* CATEGORIA + PRECIO */}
        <div className="row2">
          <div className="field">
            <label>Categoría</label>
            <select value={f.categoria} onChange={e=>cambiarCategoria(e.target.value)}>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Precio ($)</label>
            <input type="number" value={f.precio} onChange={e=>set('precio',e.target.value)} placeholder="85000"/>

        <div className="field">
          <label>Precio por mayor</label>
          <select value={f.linea} onChange={e=>set('linea',e.target.value)}>
            <option value="ninguna">Sin precio por mayor (solo al detal)</option>
            <option value="premium">Premium (por mayor desde 6: $60.000)</option>

        {/* TALLAS */}
        <div>
          <div className="section-title">Cantidad por talla</div>
          {!isNew && <div className="stock-ayuda" style={{marginBottom:8}}>Para cambiar las unidades usa los botones <strong>Llegó</strong>, <strong>Vendí</strong> o <strong>Contar</strong> de la tarjeta. Así queda anotado en el historial.</div>}
          <div className="tallas-editor">

              <div className="talla-cell" key={t}>
                <label>{t}</label>
                <input
                  type="number" min="0" className="talla-num" disabled={!isNew}
                  value={f.tallas[t]||''}
                  onChange={e=>setT(t,e.target.value)}
                  placeholder="0"
                />
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginTop:10,flexWrap:'wrap'}}>{/* talla-en-editor */}
            <input value={nuevaT} onChange={e=>setNuevaT(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); agregarTalla(); } }} placeholder="Nueva talla (ej. 2, 16)" style={{width:170,padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:10,fontSize:15}}/>
            <button type="button" className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'9px 14px',fontSize:15}} disabled={agregandoT || !nuevaT.trim()} onClick={agregarTalla}>{agregandoT ? 'Agregando…' : '+ Agregar talla'}</button>
          </div>
        </div>

        {/* NOTAS */}
        <div className="field">
          <label>Notas</label>
          <textarea rows={3} value={f.notas} onChange={e=>set('notas',e.target.value)} placeholder="Color, temporada, proveedor, detalles..."/>
        </div>
      </div>

      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={handleSave} disabled={saving} style={{flex:2}}>
          {saving ? '...' : (isNew ? '+ Agregar al inventario' : 'Guardar cambios')}
        </button>
      </div>
    </div>
  </>;
}

/* ── TALLAS QUE MANEJAMOS (tallas-editables, 25-nov) ── */
function TallasModal({prods, onClose, onSaved}){
  const [num, setNum] = useState([...TALLAS_JEANS]);
  const [letras, setLetras] = useState([...TALLAS_LETRAS]);
  const [nueva, setNueva] = useState({num:'', letras:''});
  const [saving, setSaving] = useState(false);
  const unidadesEn = (talla, numerica) => prods.filter(p=>CATS_NUMERICAS.includes(p.categoria)===numerica).reduce((s,p)=>s+(parseInt((p.tallas||{})[talla])||0),0);
  function agregar(tipo){
    let v = String(nueva[tipo]||'').trim(); if(tipo==='letras') v = v.toUpperCase();
    if(!v){ toast('Escribe la talla'); return; }
    if(v.length>6){ toast('La talla es muy larga'); return; }
    const lista = tipo==='num' ? num : letras;
    if(lista.some(x=>x.toUpperCase()===v.toUpperCase())){ toast('Esa talla ya está'); return; }
    const l = [...lista, v].sort(cmpTalla);
    tipo==='num' ? setNum(l) : setLetras(l);
    setNueva(n=>({...n,[tipo]:''}));
  }
  function quitar(tipo, t){
    const u = unidadesEn(t, tipo==='num');
    if(u>0){ toast('La talla '+t+' todavía tiene '+u+' unidad'+(u===1?'':'es')+'. Primero descuéntalas o cuéntalas en 0.'); return; }
    tipo==='num' ? setNum(num.filter(x=>x!==t)) : setLetras(letras.filter(x=>x!==t));
  }
  async function guardar(){
    if(!num.length || !letras.length){ toast('Deja al menos una talla en cada grupo'); return; }
    setSaving(true);
    try{ await guardarTallasConfig(num, letras); toast('✓ Tallas guardadas'); onSaved(); onClose(); }
    catch(e){ toast('Error: '+(e.message||'no se pudo guardar')); setSaving(false); }
  }
  const grupo = (tipo, titulo, ayuda, lista, ph) => (
    <div className="field">
      <div className="section-title">{titulo}</div>
      <div className="stock-ayuda" style={{marginBottom:8}}>{ayuda}</div>
      <div className="tallas-chips">
        {lista.map(t=><span className="talla-chip" key={t}>{t}<button title={'Quitar talla '+t} onClick={()=>quitar(tipo,t)}>×</button></span>)}
      </div>
      <div className="tallas-nueva">
        <input value={nueva[tipo]} placeholder={ph} onChange={e=>setNueva(n=>({...n,[tipo]:e.target.value}))} onKeyDown={e=>{ if(e.key==='Enter') agregar(tipo); }}/>
        <button className="btn btn-in" onClick={()=>agregar(tipo)}>+ Agregar talla</button>
      </div>
    </div>
  );
  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>Tallas que <em>manejamos</em></h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>
      <div className="drawer-body">
        <div className="pk-falta" style={{background:'#F7F3F5',color:'var(--night-2)',marginBottom:14}}>Las tallas que pongas aquí salen al <strong>crear</strong> un producto y en los botones <strong>+ Sumar</strong> y <strong>Contar</strong> de cada tarjeta. El bot vende las tallas que tengan unidades. Para cargar la mercancía nueva, guarda aquí y luego usa <strong>+ Sumar</strong> en el jean.</div>
        {grupo('num','Jeans y shorts (números)','Ej: 2, 16, 18.', num, 'Ej: 16')}
        {grupo('letras','Blusas y demás (letras)','Ej: XXL, XS.', letras, 'Ej: XXL')}
        <div className="stock-ayuda">Si quitas una talla, los jeans que todavía tengan unidades en ella la siguen mostrando. Solo se puede quitar una talla que esté en 0 en todos los productos.</div>
      </div>
      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={guardar} disabled={saving} style={{flex:2}}>{saving?'...':'Guardar tallas'}</button>
      </div>
    </div>
  </>;
}

/* ── MOVER STOCK ── */
const MODOS = {
  venta_manual:{titulo:'Descontar unidades', ayuda:'Para ventas que no hizo el bot (mayoristas, en físico). Toca + por cada unidad que salió. Las ventas del bot se descuentan solas.'},
  llegada:{titulo:'Sumar unidades', ayuda:'Para mercancía que llegó. Toca + por cada unidad que entró, o escribe el número.'},
  conteo:{titulo:'Contar inventario', ayuda:'Cuenta lo que hay en físico y escribe el número de cada talla que contaste. La app te muestra la diferencia y deja el inventario con lo que contaste.'},
};
function StockModal({prod, modo, onClose, onDone}){
  const [actual,setActual] = useState(prod.tallas||{});
  const [vals,setVals] = useState({});
  const [nota,setNota] = useState('');
  const [dev,setDev] = useState(false);
  const [saving,setSaving] = useState(false);
  useEffect(()=>{ DB.cargarUno(prod.id).then(p=>setActual(p.tallas||{})).catch(()=>{}); },[]);
  const tipo = (modo==='llegada' && dev) ? 'devolucion' : modo;
  const llaves = Object.keys(actual);
  const tallasCat = tallasDeCategoria(prod.categoria);
  const base = modo==='venta_manual' ? llaves : [...new Set([...tallasCat, ...llaves])];
  const tallas = (base.length ? base : tallasCat).sort(cmpTalla);
  const hay = t => parseInt(actual[t])||0;
  const num = t => { const v = vals[t]; return (v===undefined||v==='') ? null : parseInt(v); };
  const filas = tallas.map(t=>({t, n:num(t)})).filter(x=>x.n!==null && !isNaN(x.n));
  const excede = filas.filter(x=>tipo==='venta_manual' && x.n>hay(x.t));
  const invalidas = filas.filter(x=>x.n<0 || (tipo!=='conteo' && x.n===0));
  const movs = filas.filter(x=>x.n>=0 && (tipo==='conteo' || x.n>0)).map(x=>({talla:x.t, cantidad:x.n}));
  const unidades = movs.reduce((s,m)=>s+m.cantidad,0);
  const difTotal = movs.reduce((s,m)=>s+(m.cantidad-hay(m.talla)),0);
  const puede = movs.length>0 && excede.length===0 && invalidas.length===0 && !saving;
  function paso(t,d){
    setVals(v=>{
      let n = (parseInt(v[t])||0) + d;
      if(n < 0) n = 0;
      if(tipo==='venta_manual' && n > hay(t)) n = hay(t);
      return {...v,[t]: n===0 ? '' : String(n)};
    });
  }
  let resumen = modo==='conteo' ? 'Escribe lo que contaste en cada talla.' : 'Toca + en las tallas que vas a '+(modo==='venta_manual'?'descontar':'sumar')+'.';
  if(movs.length>0){
    if(tipo==='conteo') resumen = difTotal===0 ? 'El conteo coincide con el inventario.' : 'Diferencia total: '+(difTotal>0?'+':'')+difTotal+' unidades. El inventario quedará con lo que contaste.';
    else if(tipo==='venta_manual') resumen = 'Se descontarán '+unidades+' unidad'+(unidades===1?'':'es')+'.';
    else resumen = 'Se sumarán '+unidades+' unidad'+(unidades===1?'':'es')+(tipo==='devolucion'?' (devolución).':'.');
  }
  if(excede.length>0) resumen = 'Solo hay '+excede.map(x=>hay(x.t)+' en la talla '+x.t).join(' y ')+'.';
  async function guardar(){
    if(!puede) return;
    setSaving(true);
    try{
      const nuevas = await DB.moverStock(prod.id,tipo,movs,nota);
      toast('✓ '+(tipo==='conteo'?'Conteo guardado':tipo==='venta_manual'?'Unidades descontadas':tipo==='devolucion'?'Devolución registrada':'Unidades sumadas'));
      onDone(nuevas); onClose();
    }catch(err){ toast('Error: '+(err.message||'no se pudo guardar')); setSaving(false); }
  }
  const textoBtn = saving ? '...' : tipo==='conteo' ? 'Guardar conteo' : tipo==='venta_manual' ? (unidades>0?'Descontar '+unidades:'Descontar') : (unidades>0?'Sumar '+unidades:'Sumar');
  return <>
    <div className="drawer-bg" onClick={onClose}/>
    <div className="drawer">
      <div className="drawer-head">
        <h3>{MODOS[modo].titulo}</h3>
        <button className="close-btn" onClick={onClose}><Ico.X/></button>
      </div>
      <div className="drawer-body">
        <div className="stock-prod">
          {prod.foto_url ? <img src={prod.foto_url} alt=""/> : <div className="sp-ph"/>}
          <div>
            <div className="sp-n">{prod.nombre}{prod.ref?<span style={{color:'var(--night-3)',fontWeight:500}}> · {prod.ref}</span>:null}</div>
            {prod.precio ? <div className="sp-p">{fmt(prod.precio)}</div> : null}
          </div>
        </div>
        <div className="stock-ayuda">{MODOS[modo].ayuda}</div>
        {modo==='llegada' && (
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13}}>
            <input type="checkbox" checked={dev} onChange={e=>setDev(e.target.checked)}/> Es una devolución de una clienta
          </label>
        )}
        {modo==='venta_manual' && llaves.length===0 && <div className="stock-resumen err">Este producto no tiene unidades cargadas todavía.</div>}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {tallas.map(t=>{
            const n = num(t);
            const valido = n!==null && !isNaN(n);
            const malo = (tipo==='venta_manual' && valido && n>hay(t)) || (valido && n<0);
            const dif = (tipo==='conteo' && valido) ? n-hay(t) : null;
            let res = null;
            if(valido && tipo==='venta_manual' && !malo) res = <> → quedan <span className="res amber">{hay(t)-n}</span></>;
            if(valido && (tipo==='llegada'||tipo==='devolucion')) res = <> → quedan <span className="res green">{hay(t)+n}</span></>;
            return (
              <div className={`sr ${malo?'malo':''} ${tipo==='conteo'?'sr-conteo':''}`} key={t}>
                <div className="sr-t">
                  <div className="a">Talla {t}</div>
                  <div className="b">Hay {hay(t)}{res}</div>
                </div>
                {tipo==='conteo'
                  ? <>
                      <div className="sr-ctl">
                        <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                          onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="Contado"/>
                      </div>
                      <div className={`sr-dif ${dif===null?'':dif>0?'dif-mas':dif<0?'dif-menos':'dif-cero'}`}>{dif===null?'':dif===0?'Igual':(dif>0?'+':'')+dif}</div>
                    </>
                  : <div className="sr-ctl">
                      <button type="button" onClick={()=>paso(t,-1)} aria-label="Quitar uno">−</button>
                      <input type="number" min="0" inputMode="numeric" value={vals[t]===undefined?'':vals[t]}
                        onChange={e=>setVals(v=>({...v,[t]:e.target.value}))} placeholder="0"/>
                      <button type="button" onClick={()=>paso(t,1)} aria-label="Agregar uno">+</button>
                    </div>
                }
              </div>
            );
          })}
        </div>
        <div className="field">
          <label>Nota (opcional)</label>
          <input value={nota} onChange={e=>setNota(e.target.value)} maxLength={200}
            placeholder={tipo==='llegada'?'Ej: llegada del proveedor, factura 123':tipo==='venta_manual'?'Ej: venta mayorista a Laura':tipo==='conteo'?'Ej: conteo de fin de mes':'Ej: cambio de talla'}/>
        </div>
        <div className={`stock-resumen ${excede.length>0?'err':''}`}>{resumen}</div>
      </div>
      <div className="drawer-footer">
        <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>Cancelar</button>
        <button className="btn btn-primary btn-lg" onClick={guardar} disabled={!puede} style={{flex:2,opacity:puede?1:.5}}>{textoBtn}</button>
      </div>
    </div>
  </>;
}

/* ── HISTORIAL ── */
const TIPO_LABEL = {llegada:'Se sumó', venta_bot:'Vendió el bot', venta_manual:'Descuento manual', conteo:'Conteo', devolucion:'Devolución', ajuste:'Ajuste'};
const CHIP_LABEL = {llegada:'Sumas', venta_bot:'Bot', venta_manual:'Manuales', conteo:'Conteos', devolucion:'Devoluciones'};
function HistorialView({productos, filtro, setFiltro}){
  const [rows,setRows] = useState(null);
  const [tipo,setTipo] = useState('todos');
  const [err,setErr] = useState('');
  useEffect(()=>{ DB.cargarMovimientos().then(setRows).catch(e=>setErr(e.message)); },[]);
  if(err) return <div className="empty"><p>No se pudo cargar el historial: {err}</p></div>;
  if(!rows) return <div className="loading-page"><div className="spinner"/></div>;
  const nombre = id => (productos.find(p=>p.id===id)||{}).nombre;
  const lista = rows.filter(r=>(filtro==='todos'||r.producto_id===filtro)&&(tipo==='todos'||r.tipo===tipo));
  const grupos = [];
  lista.forEach(r=>{
    const k = r.producto_id+'|'+r.tipo+'|'+r.created_at.slice(0,19)+'|'+r.nota;
    let g = grupos.find(x=>x.k===k);
    if(!g){ g = {k, r, items:[]}; grupos.push(g); }
    g.items.push(r);
  });
  let diaPrev = '';
  const ids = [...new Set(rows.map(r=>r.producto_id))];
  return <>
    <div className="hist-filtros">
      <select value={filtro} onChange={e=>setFiltro(e.target.value)}>
        <option value="todos">Todos los productos</option>
        {ids.map(id=><option key={id} value={id}>{nombre(id)||(rows.find(r=>r.producto_id===id)||{}).producto_nombre||id}</option>)}
      </select>
      {['todos','llegada','venta_bot','venta_manual','conteo','devolucion'].map(t=>(
        <button key={t} className={`chip ${tipo===t?'on':''}`} onClick={()=>setTipo(t)}>{t==='todos'?'Todo':CHIP_LABEL[t]}</button>
      ))}
    </div>
    <div className="hist-list">
      {grupos.length===0 && <div className="empty"><p>Todavía no hay movimientos{filtro!=='todos'||tipo!=='todos'?' con ese filtro':''}.</p></div>}
      {grupos.map(g=>{
        const d = new Date(g.r.created_at);
        const dia = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
        const cab = dia!==diaPrev ? <div className="hist-dia" key={'d'+g.k}>{dia}</div> : null;
        diaPrev = dia;
        const items = [...g.items].sort((a,b)=>cmpTalla(a.talla,b.talla));
        return <React.Fragment key={g.k}>{cab}
          <div className="hist-item">
            <div className="hist-top">
              <div className="hist-prod">{nombre(g.r.producto_id)||g.r.producto_nombre||g.r.producto_id}</div>
              <span className={`hist-tipo ${g.r.tipo}`}>{TIPO_LABEL[g.r.tipo]||g.r.tipo}</span>
            </div>
            <div className="hist-tallas">
              {items.map(it=><span key={it.id} className={`hist-t ${it.delta>0?'mas':'menos'}`}>T{it.talla}: {it.delta>0?'+':''}{it.delta} <span style={{color:'var(--night-3)',fontWeight:500}}>(quedan {it.stock_despues})</span></span>)}
            </div>
            <div className="hist-meta">{d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}{g.r.nota?' · '+g.r.nota:''}</div>
          </div>
        </React.Fragment>;
      })}
    </div>
  </>;
}

/* ── PEDIDOS ── */
const ESTADO_LABEL = {
  preguntando:'Preguntando',
  cuenta_enviada:'Cuenta enviada',
  comprobante_recibido:'Comprobante recibido',
  pendiente_confirmacion_humana:'Esperando confirmación',
  confirmado:'Confirmado',
  pidiendo_datos_envio:'Pidiendo datos de envío',
  listo_para_enviar:'Listo para enviar',
  rechazado:'Rechazado',
  cancelado:'Cancelado',
};

function fechaAmable(iso){
  if(!iso) return '';
  const d = new Date(iso), hoy = new Date(), ayer = new Date(hoy.getTime()-864e5);
  const hora = d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===hoy.toDateString()) return 'Hoy, '+hora;
  if(d.toDateString()===ayer.toDateString()) return 'Ayer, '+hora;
  return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'})+', '+hora;
}
/* cobro-envio-app */
const envioDeuda = f => !!f && f.envio_pagado!==true && Number(f.envio_valor)!==0 && f.envio_valor!==null && f.envio_valor!==undefined;
const envioTexto = f => Number(f.envio_valor)===-1 ? 'El valor del envío está por confirmar' : ('Falta pagar el '+(Number(f.envio_valor)===7000?'domicilio':'envío')+': $'+Number(f.envio_valor).toLocaleString('es-CO'));
function agruparPedidos(rows){
  /* Un paquete = una persona + una dirección: los jeans que son de la misma clienta, misma dirección y mismo estado salen en UNA sola tarjeta (así no se empaca uno y se olvida el otro). */
  const g = {};
  const norm = x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  /* OJO: el estado empacado NO va en la llave. Si una clienta pagó 2 jeans y uno ya se marcó empacado, el otro debe seguir en la MISMA tarjeta (antes salía como un pedido aparte de 1 solo jean y se olvidaba el otro). */

function imprimirPdf(blob){

  const lista = buscados ? buscados : filtro==='mayoreo' ? mayoreoG : filtro==='listo' ? porEmpacar : filtro==='datos' ? faltanDatos : empacados;
  listaRef.current = lista; const clvFotos = filtro + '|' + lista.map(g=>g.filas.map(f=>f.id+(f.envio_pagado?'p':'')+(f.envio_cobro_at?'c':'')).join('.')).join(',');
  useEffect(()=>{ if(['cobros','historial'].includes(filtro)) return; let vivo = true; /* comprobantes-en-tarjeta */
    const ir = ()=>fotosDePagos(listaRef.current.flatMap(g=>g.filas)).then(x=>{ if(vivo) setFotosCobro(x); }).catch(()=>{});
    ir(); const t = setInterval(()=>{ if(document.visibilityState==='visible') ir(); }, 45000); return ()=>{ vivo = false; clearInterval(t); }; },[clvFotos]);
  const vacio = {mayoreo:'No hay pedidos por mayor pendientes.', listo:'No hay pedidos por empacar por ahora. Cuando llegue uno, aparece aquí solo.',esperando:'No hay pagos en revisión.', hechos:'Todavía no has marcado pedidos como empacados.',revisar:'No hay pagos por revisar.',datos:'No hay clientas pendientes de mandar sus datos.'}[filtro];

  return (

      </div>

      {filtro==='mayoreo' && <div className="pk-nota" style={{background:'#FFF4D6',borderColor:'#E0B44C'}}><b>📦 Pedidos por mayor</b> (6 o más unidades). <b>Antes de empacar</b>, verifica en el banco que entró <b>todo el dinero</b> del pedido (el total aparece en cada tarjeta) y que los datos de envío estén completos. Cuando lo verifiques, empácalo y toca <b>Ya empaqué este pedido</b>.</div>}
      {filtro==='aviso' && <div className="pk-nota"><b>Estos pedidos tienen un aviso</b>: léelo antes de despachar. Cuando se resuelva, toca <b>Ya lo resolví</b>.</div>}
      {filtro==='envio' && <div className="pk-nota">Estas clientas <b>ya pagaron el jean</b>, pero <b>falta que paguen el envío</b> (o domicilio). Si ya se les envió el cobro desde "Cobrar envíos", cuando manden el comprobante el bot lo marca pagado solo y el pedido vuelve a <b>Ya empacados</b> para comprar la guía. Si pagan por otro lado, toca <b>Envío pagado</b>.</div>}
      {filtro==='datos' && <div className="pk-nota">Estas clientas <b>ya pagaron</b>, pero todavía no mandan sus datos de envío (o su correo). Escríbeles para que los manden. No se deben empacar hasta tener los datos.</div>}

              </div>

              <span>{r.nombre}{r.ok ? ' → '+r.ciudad+': $'+Number(r.precio).toLocaleString('es-CO')+(r.dias?' ('+r.dias+' día'+(r.dias>1?'s':'')+')':'')+(r.precio>caro?' 🔴 ENVÍO CARO':'') : ': '+r.error}</span></label>)}
            {(()=>{ const m = guias.cot.resultados.filter(r=>r.ok && (guias.sel||{})[r.clave]); return cfgGuias.activa
              ? <div style={{marginTop:8,fontSize:17}}><b>Marcados: {m.length} · Total ${m.reduce((t,r)=>t+r.precio,0).toLocaleString('es-CO')}</b> <span style={{fontSize:14,color:'var(--night-3)'}}>(solo se compran los marcados)</span></div>
              : <div style={{marginTop:8,fontSize:17}}><b>Total de todos: ${Number(guias.cot.total).toLocaleString('es-CO')}</b> ({guias.cot.resultados.filter(r=>r.ok).length} guías)</div>; })()}
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
              {cfgGuias.activa && guias.cot.activa && guias.cot.resultados.some(r=>r.ok) && <button className="pk-btn ok" style={{minWidth:0,flex:'none',padding:'12px 16px',fontSize:17}} onClick={comprarGuias}>Comprar e imprimir los marcados</button>}

          {(p==='listo' || p==='comprado') && <div style={{marginTop:8,fontSize:15}}>

            {guias.blob && <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
              <button className="pk-btn ok" style={{minWidth:0,flex:'none',padding:'12px 16px',fontSize:17}} onClick={()=>imprimirPdf(guias.blob)}>🖨️ Imprimir {guias.paginas} guía(s)</button>
              <button className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>compartirPdf(guias.blob)}>📤 Enviar a la impresora (celular)</button>
              <button className="pk-btn sec" style={{minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button>
            </div>}
            {guias.blob && <div style={{fontSize:14,marginTop:8,color:'var(--night-3)'}}>Cada guía viene en tamaño 10×15 cm. Al imprimir: papel 4×6 (100×150 mm) y escala 100%.</div>}
            {!guias.blob && <button className="pk-btn sec" style={{marginTop:10,minWidth:0,flex:'none',padding:'12px 16px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button>}
          </div>}
          {p==='error' && <div style={{marginTop:8,color:'#C0392B'}}>⚠️ {guias.error} <button className="pk-btn sec" style={{marginLeft:8,minWidth:0,flex:'none',padding:'8px 12px'}} onClick={()=>setGuias({paso:''})}>Cerrar</button></div>}
        </div>); })()}
      {filtro==='historial' && !buscados ? <HistorialEnvios productos={productos} zona={zona}/> :
      <div className="pedidos-list">
        {cargando
          ? <div className="loading-page"><div className="spinner"/></div>

    </div>
  );

/* historial-envios (12-nov, pedido de la jefa): TODOS los pedidos empacados desde el inicio, para revisar envíos anteriores
   (dirección, qué llevaba, guía, envío cobrado). Solo lectura. Carga de a 300 desde la base (no solo los 14 días de Pedidos vendidos). */
/* cobros-envio-lista (25-nov, la jefa): a quién se le cobró el envío con el botón "Cobrar envíos", cuándo, cuánto y si ya pagó
   (el bot marca envio_pagado cuando la clienta manda el comprobante). Últimos 14 días, agrupado por día del cobro. */
/* envio-en-tarjeta (25-nov): fotos que mandó cada clienta DESPUÉS de que se le cobró el envío. Si justo después el bot respondió
   "pago de tu envío…", esa foto es el comprobante del envío (envio:true). Se usa en Cobros de envío y en cada tarjeta de pedido. */
async function fotosTrasCobro(filas){
  const cob = (filas||[]).filter(f=>f.envio_cobro_at && f.cliente_telefono);
  const tels = [...new Set(cob.map(f=>f.cliente_telefono))]; if(!tels.length) return {};
  const desde = cob.reduce((m,f)=>f.envio_cobro_at<m?f.envio_cobro_at:m, new Date().toISOString());
  const c = await sb.from('nf_conversaciones').select('telefono,created_at,rol,contenido,foto_publica').in('telefono', tels).gte('created_at', desde).order('created_at',{ascending:false}).limit(3000);
  const msgs = (c.data||[]).slice().reverse(); const por = {};
  msgs.forEach((m,i)=>{ if(m.rol!=='user' || !m.foto_publica) return; const sig = msgs.slice(i+1).find(x=>x.telefono===m.telefono && x.rol==='assistant'); (por[m.telefono] = por[m.telefono] || []).push({url:m.foto_publica, at:m.created_at, envio: !!(sig && /pago de tu env[ií]o|env[ií]o.{0,40}(pagado|registrado|recib)/i.test(String(sig.contenido||'')))}); });
  return por;
}
/* comprobantes-en-tarjeta (25-nov): TODAS las fotos de pago de las clientas, clasificadas por lo que respondió el bot justo después:
   tipo 'envio' ("Recibí el pago de tu envío…") o 'jean' ("tu pago quedó registrado…"); '' = otra foto. Se consulta de a 40 clientas. */
async function fotosDePagos(filas){
  const fl = (filas||[]).filter(f=>f.cliente_telefono); const tels = [...new Set(fl.map(f=>f.cliente_telefono))]; if(!tels.length) return {};
  const desde = new Date(fl.reduce((m,f)=>Math.min(m, new Date(f.created_at).getTime(), f.envio_cobro_at ? new Date(f.envio_cobro_at).getTime() : Infinity), Date.now()) - 3600e3).toISOString();
  const por = {};
  for(let i=0;i<tels.length;i+=40){
    const c = await sb.from('nf_conversaciones').select('telefono,created_at,rol,contenido,foto_publica').in('telefono', tels.slice(i,i+40)).gte('created_at', desde).order('created_at',{ascending:false}).limit(4000);
    const sig = {}; /* recorre de lo más nuevo a lo más viejo: sig[tel] = la respuesta del bot que vino DESPUÉS de cada mensaje */
    for(const m of (c.data||[])){
      if(m.rol==='assistant'){ sig[m.telefono] = String(m.contenido||''); continue; }
      if(m.rol!=='user' || !m.foto_publica) continue;
      const t = sig[m.telefono] || '';
      const tipo = /pago de tu env[ií]o|env[ií]o.{0,40}(pagado|registrado|recib)/i.test(t) ? 'envio' : /(pago|comprobante|transferencia).{0,40}(qued[oó] registrad|registrad|recib|confirmad)|recib[ií] tu (pago|comprobante)/i.test(t) ? 'jean' : '';
      (por[m.telefono] = por[m.telefono] || []).unshift({url:m.foto_publica, at:m.created_at, tipo, envio: tipo==='envio'});
    }
  }
  return por;
}

   (la más reciente), con hora, nombre, número, motivo, lo que dijo y botones "Abrir chat" / "Listo". El texto lo sigue escribiendo el puente igual. */
function partirAvisos(texto){
  const items = String(texto||'').split(/\s*‖\s*/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const it of items){
    const m = it.match(/^🕐\s*([^—]+?)\s*—\s*([\s\S]*)$/);
    const hora = m ? m[1].trim() : '';
    const partes = (m ? m[2] : it).split(/\s+·\s+/).map(s=>s.trim()).filter(Boolean);
    const a = {hora, titulo:'', nombre:'', tel:'', motivo:'', reclamo:false, dijo:'', otros:[], clave: it.slice(0,160)};
    partes.forEach((p,i)=>{
      let x;
      if((x = p.match(/^Cliente:\s*(.*)$/i))){ const c = x[1]; const t = c.match(/\(([^)]+)\)\s*$/); const t2 = !t && c.match(/\s+[-–]\s*\+?(\d[\d ]{7,})\s*$/); /* aviso-tel-guion (25-nov): "Nombre - 573205399317" también trae el número */ a.tel = t ? t[1].trim() : (t2 ? t2[1].replace(/\s/g,'') : ''); a.nombre = t ? c.replace(/\s*\([^)]*\)?\s*$/,'').trim() : (t2 ? c.slice(0, c.length - t2[0].length).trim() : c.trim()); }
      else if((x = p.match(/^Motivo:\s*(.*)$/i))){ let mo = x[1]; if(/^RECLAMA:?\s*/i.test(mo)){ a.reclamo = true; mo = mo.replace(/^RECLAMA:?\s*/i,''); } a.motivo = mo; }
      else if((x = p.match(/^Dijo:\s*(.*)$/i))) a.dijo = x[1];
      else if(/^Resp[oó]ndele desde/i.test(p)) {}
      else if(i===0) a.titulo = p.replace(/^🙋\s*/,'');
      else a.otros.push(p);
    });
    out.push(a);
  }
  /* una tarjeta por clienta: se queda la más reciente (vienen de la más nueva a la más vieja) */
  const vistos = new Set(), res = [];
  for(const a of out){ const k = a.tel || a.nombre || a.clave; if(vistos.has(k)){ const prev = res.find(r=>(r.tel||r.nombre||r.clave)===k); if(prev){ prev.veces=(prev.veces||1)+1; prev.claves.push(a.clave); } continue; } vistos.add(k); res.push({...a, veces:1, claves:[a.clave]}); }
  return res;
}
/* pedidos-simples (25-nov): en la pestaña Avisos salen los pedidos que necesitan a la jefa: pagos por confirmar, pagos para
   verificar en el banco (REVISAR) y pedidos con aviso. Con las mismas tarjetas y botones de Pedidos (y los comprobantes). */
function seccionesAvisoPedidos(ps){
  const vivos = (ps||[]).filter(p=>p.estado!=='cancelado'); const usados = new Set();
  const tomar = arr => { const g = agruparPedidos(arr.filter(p=>!usados.has(p.id))); g.forEach(x=>x.filas.forEach(f=>usados.add(f.id))); return g; };
  const espera = tomar(vivos.filter(p=>p.estado==='pendiente_confirmacion_humana'));
  const revisar = tomar(vivos.filter(p=>/^REVISAR:/.test(p.notas||'')));
  const aviso = tomar(vivos.filter(p=>p.nota_jefa));
  return {espera, revisar, aviso, n: espera.length + revisar.length + aviso.length};
}

  return <div className="avisos-pedidos">
    {sec.espera.length>0 && <><div className="avp-tit">💰 Pagos por confirmar ({sec.espera.length})</div><div className="pk-nota">Estos pedidos <b>no se deben empacar todavía</b>: el pago se está revisando. Cuando se confirme, pasan solos a "Listo para enviar".</div>{tarjetas(sec.espera)}</>}

function nombreChat(c){ return c.nombre || telBonito(numeroReal(c)) || 'Clienta (número oculto)'; }
function limpiarPreview(t){
  const s = String(t||'');
  const m = s.match(/^\[El cliente esta respondiendo[^\]]*\]\s*([\s\S]*)$/);
  if(m) return m[1] || '↩ Respondió a un mensaje';
  if(/^\[El cliente esta respondiendo/.test(s)) return '↩ Respondió a un mensaje';
  return s.replace(/\s+/g,' ');
}
function etiquetasChat(c){
  const t = [];
  const min = (Date.now()-new Date(c.ultimo_at).getTime())/60000;
  const texto = limpiarPreview(c.ultimo_texto);
  if(c.ultimo_rol==='user' && min>=3 && !c.con_asesora && !CIERRE_CHAT.test(texto)) t.push({k:'rojo', txt:'Sin respuesta · hace '+hace(c.ultimo_at)});
  if(c.pidio_cita) t.push({k:'azul', txt:'Cita: derivada a la asesora'}); else if(c.con_asesora) t.push({k:'azul', txt:'Derivada a la asesora'}); /* derivada-informativa */
  if(c.falta_datos) t.push({k:'ambar', txt:'Pagó y faltan datos de envío o correo'});
  if(c.por_revisar) t.push({k:'ambar', txt:'Pago por revisar'});
  if(c.quiso_comprar && !c.tiene_pedido && min>=20) t.push({k:'ambar', txt:'Quería comprar y no quedó pedido'});
  return t;
}
function vistosGet(){ try{ return JSON.parse(localStorage.getItem('nf_chats_vistos')||'{}'); }catch(e){ return {}; } }
function vistosSet(o){ try{ localStorage.setItem('nf_chats_vistos', JSON.stringify(o)); }catch(e){} }
function esPendiente(c, vistos){ return etiquetasChat(c).some(t=>t.k!=='azul') && vistos[c.telefono]!==c.ultimo_at; }
function diaLabel(iso){
  const d = new Date(iso), hoy = new Date(), ayer = new Date(hoy.getTime()-864e5);
  if(d.toDateString()===hoy.toDateString()) return 'Hoy';
  if(d.toDateString()===ayer.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
}
function partirMensaje(contenido){
  const m = String(contenido||'').match(/^\[El cliente esta respondiendo a este mensaje que le enviaste:\s*"([\s\S]*?)"\]\s*([\s\S]*)$/);
  return m ? {cita:m[1], texto:m[2]} : {cita:null, texto:String(contenido||'')};
}

          <textarea className="ch-txt" rows={2} value={texto} onChange={e=>setTexto(e.target.value)} placeholder="Escríbele a la clienta…" maxLength={2000}/>
          <button className="pk-btn ok ch-enviar" disabled={!texto.trim() || (envio && envio.estado==='enviando')} onClick={enviar}>{envio && envio.estado==='enviando' ? 'Enviando…' : 'Enviar'}</button>

/* ── CITAS (10-nov-2026): las citas que agenda el bot (nf_citas) ── */
const hoyCO = (dias=0) => { const d = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'})); d.setDate(d.getDate()+dias); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function diaCita(f){
  if(!f) return 'Día por confirmar';
  if(f===hoyCO(0)) return 'HOY'; if(f===hoyCO(1)) return 'Mañana'; if(f===hoyCO(-1)) return 'Ayer';
  const d = new Date(f+'T12:00:00'); const s = d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1);
}
function CitaCard({c, onMarcar}){
  const num = /^\d{10,13}@/.test(c.telefono||'') ? String(c.telefono).replace(/@.*/,'') : '';
  const local = num ? (num.startsWith('57') ? num.slice(2) : num) : '';
  const dia = diaCita(c.fecha); const esHoy = c.fecha===hoyCO(0); const pasada = c.fecha && c.fecha < hoyCO(0);
  const etiqueta = {vino:'✓ Vino', no_vino:'✗ No vino', cancelada:'Cancelada'}[c.estado];
  return (
    <div className={`pk-card ${esHoy && c.estado==='pendiente'?'nuevo':''} ${c.estado!=='pendiente'?'hecho':''}`}>
      <div className="pk-top">
        <div className="pk-nombre">{c.nombre || 'Clienta'}{esHoy && c.estado==='pendiente' && <span className="pk-nuevo">HOY</span>}</div>
        {etiqueta && <div className="pk-fecha"><b>{etiqueta}</b></div>}
      </div>
      <div className="pk-items">
        <div className="pk-item"><b>{dia}</b>{c.hora ? <> · <b>{c.hora}</b></> : ' · hora por confirmar'}</div>
      </div>
      <div className="pk-envio">
        <div className="f"><span>Para qué</span><span>{c.motivo || 'visita al punto físico'}</span></div>
        <div className="f"><span>Teléfono</span><span>{local ? <a href={'https://wa.me/'+num} target="_blank" rel="noopener">{local}</a> : 'Ver en Chats (WhatsApp no mostró el número)'}</span></div>
        {c.cuando_texto && <div className="f"><span>Lo que dijo</span><span style={{fontWeight:400}}>{c.cuando_texto}</span></div>}
      </div>
      {pasada && c.estado==='pendiente' && <div className="pk-falta" style={{marginTop:10}}>Esta cita ya pasó: márcala como "Vino" o "No vino".</div>}
      <div className="pk-acciones">
        {c.estado==='pendiente' ? <>
          <button className="pk-btn ok" onClick={()=>onMarcar(c,'vino')}>Vino</button>
          <button className="pk-btn sec" onClick={()=>onMarcar(c,'no_vino')}>No vino</button>
